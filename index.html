<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deal Analyzer — MB Adviesgroep</title>
<!-- PDF.js voor echte tekstextractie (werkt ook bij Graydon/CreditSafe) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>if(typeof pdfjsLib!=='undefined')pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ── Reset ───────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* ── Design tokens ───────────────────────────────── */
:root{
  /* ── Brand — MB Adviesgroep ── */
  --bl:#2B5F8E;        /* primair blauw */
  --bl-d:#142e47;      /* donker (header) */
  --bl-m:#1e4469;      /* medium */
  --bl-l:#3d79ac;      /* licht */
  --bl-bg:#EEF4FA;     /* achtergrond tint */
  --bl-bg2:#dde9f5;
  --bl-bd:#b8d4ec;

  --or:#D96B3A;         /* oranje accent */
  --or-d:#bf5a2c;
  --or-bg:#FDF0EA;
  --or-bd:#f5c4a5;

  /* ── Neutralen ── */
  --wh:#ffffff;
  --bg:#F5F6F8;
  --bg2:#ECEEF2;
  --bg3:#E2E5EA;
  --bd:#DDE1E8;
  --bd-l:#ECEEF2;

  /* ── Tekst ── */
  --tx:#111827;
  --tx2:#374151;
  --tx3:#6B7280;
  --tx4:#9CA3AF;

  /* ── Semantisch ── */
  --gn:#166534;--gn-bg:#F0FDF4;--gn-bd:#BBF7D0;--gn-d:#14532D;
  --wn:#92400E;--wn-bg:#FFFBEB;--wn-bd:#FDE68A;
  --rk:#991B1B;--rk-bg:#FEF2F2;--rk-bd:#FECACA;
  --pur:#5B21B6;--pur-bg:#F5F3FF;--pur-bd:#DDD6FE;

  /* ── Typography ── */
  --font:'Inter',system-ui,-apple-system,sans-serif;
  --head:'Inter',system-ui,-apple-system,sans-serif;
  --mono:'Inter',system-ui,-apple-system,sans-serif;

  /* ── Shadows ── */
  --sh:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --sh-md:0 4px 12px rgba(0,0,0,.08),0 1px 3px rgba(0,0,0,.05);
  --sh-lg:0 8px 24px rgba(0,0,0,.10),0 2px 6px rgba(0,0,0,.06);

  /* ── Radius ── */
  --r:12px;--r-sm:8px;--r-lg:16px;
}

html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font-family:var(--font);font-size:14px;min-height:100vh;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}

/* Print styles are defined in the comprehensive block below */

/* Print header — alleen zichtbaar tijdens print */
.print-header{
  display:none;align-items:center;justify-content:space-between;
  padding:0 0 14px;border-bottom:2.5px solid var(--bl);margin-bottom:20px;gap:16px
}
.print-logo-wrap{display:flex;align-items:center;gap:10px}
.print-logo-text{display:flex;flex-direction:column;gap:1px}
.print-logo-name{font-size:16px;font-weight:800;color:var(--bl);letter-spacing:-.3px;line-height:1}
.print-logo-sub{font-size:9px;font-weight:600;color:var(--or);letter-spacing:1.5px;text-transform:uppercase}
.print-meta{text-align:right;font-size:10px;color:var(--tx3);line-height:1.6}
.print-meta strong{color:var(--tx);font-weight:700;display:block;font-size:12px;margin-bottom:2px}

/* ── HEADER ──────────────────────────────────────── */
.hdr{background:linear-gradient(135deg,var(--bl-d) 0%,var(--bl) 60%,var(--bl-m) 100%);padding:0 28px;height:54px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:300;box-shadow:0 2px 14px rgba(15,50,76,.25)}
.hdr::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--or),#f09060,transparent)}

/* Logo */
.logo-wrap{display:flex;align-items:center;gap:10px;flex-shrink:0;text-decoration:none}
.logo-img-wrap{
  height:40px;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.97);border-radius:8px;padding:4px 6px;
  box-shadow:0 1px 4px rgba(0,0,0,.15)
}
.logo-img-wrap img{height:32px;width:auto}
.logo-app-name{
  display:flex;flex-direction:column;gap:1px;
  border-left:1px solid rgba(255,255,255,.15);padding-left:12px
}
.logo-app-title{font-size:13px;font-weight:700;color:#fff;letter-spacing:-.2px;line-height:1.1}
.logo-app-sub{font-size:10px;font-weight:400;color:rgba(255,255,255,.45);letter-spacing:.2px}

.hdr-div{width:1px;height:20px;background:rgba(255,255,255,.12);flex-shrink:0}
.hdr-sp{flex:1}
.hdr-kl{
  font-size:12px;color:rgba(255,255,255,.5);font-weight:500;
  max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}
.hdr-btn{
  display:flex;align-items:center;gap:5px;padding:7px 13px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
  border-radius:8px;cursor:pointer;font-family:var(--font);font-size:11px;font-weight:600;
  color:rgba(255,255,255,.85);transition:all .15s;white-space:nowrap;letter-spacing:.1px
}
.hdr-btn:hover{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.2)}
.hdr-btn.accent{background:rgba(217,107,58,.25);border-color:rgba(217,107,58,.4);color:#f4a981}
.hdr-btn.accent:hover{background:rgba(217,107,58,.4)}

/* ── APP SHELL ───────────────────────────────────── */
.app-shell{
  display:grid;grid-template-columns:300px 1fr 276px;gap:0;
  min-height:calc(100vh - 54px);max-width:1680px;margin:0 auto
}
.panel-input{
  border-right:1px solid var(--bd);background:var(--wh);
  height:calc(100vh - 54px);overflow-y:auto;position:sticky;top:54px;
  padding:20px 16px 56px
}
.panel-main{padding:22px 24px 56px;min-width:0}
.panel-aside{
  border-left:1px solid var(--bd);background:var(--wh);
  height:calc(100vh - 54px);overflow-y:auto;position:sticky;top:54px;
  padding:18px 14px 56px
}

/* ── FORM ────────────────────────────────────────── */
.p-head{
  font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;
  color:var(--tx4);padding-bottom:10px;border-bottom:1px solid var(--bd);
  margin-bottom:14px;display:flex;align-items:center;justify-content:space-between
}
.p-head-lbl{display:flex;align-items:center;gap:6px}
.p-head-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.fgrp{margin-bottom:10px}
.fgrp label{
  display:block;margin-bottom:4px;font-size:10px;font-weight:600;
  text-transform:uppercase;letter-spacing:.8px;color:var(--tx3)
}
.finput,.fselect{
  width:100%;padding:8px 10px;background:var(--bg);
  border:1.5px solid var(--bd);border-radius:var(--r-sm);
  color:var(--tx);font-family:var(--font);font-size:12px;
  outline:none;transition:border-color .15s,box-shadow .15s,background .15s;
  -webkit-appearance:none
}
.finput:focus,.fselect:focus{
  border-color:var(--bl);background:var(--wh);
  box-shadow:0 0 0 3px rgba(43,95,142,.1)
}
.finput.from-client,.fselect.from-client{background:var(--bl-bg);border-color:var(--bl-bd)}
.finput.err{border-color:var(--rk);background:var(--rk-bg)}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ferr{font-size:10px;color:var(--rk);margin-top:3px;font-weight:500}
.sec-lbl{
  font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.4px;
  color:var(--tx4);display:flex;align-items:center;gap:6px;margin-bottom:8px;margin-top:16px
}
.sec-lbl::after{content:'';flex:1;height:1px;background:var(--bd)}
.src{
  display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:700;
  letter-spacing:.3px;padding:2px 6px;border-radius:20px;text-transform:uppercase
}
.src-c{background:var(--bl-bg2);color:var(--bl);border:1px solid var(--bl-bd)}
.sl-row{display:flex;align-items:center;gap:8px}
.sl-lbl{font-size:11px;color:var(--tx3);font-weight:500;min-width:48px}
.sl-val{font-size:12px;font-weight:700;color:var(--bl);min-width:40px;text-align:right}
input[type=range]{
  flex:1;-webkit-appearance:none;height:3px;border-radius:2px;
  background:var(--bd);outline:none;cursor:pointer
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:var(--bl);border:2.5px solid var(--wh);cursor:pointer;
  box-shadow:0 1px 3px rgba(43,95,142,.3)
}

/* ── DEAL SNAPSHOT ───────────────────────────────── */
.deal-snapshot{
  background:linear-gradient(140deg,var(--bl-d) 0%,var(--bl) 55%,var(--bl-l) 100%);
  border-radius:var(--r-lg);padding:20px 22px;margin-bottom:16px;
  position:relative;overflow:hidden;
  box-shadow:0 4px 20px rgba(43,95,142,.25)
}
.deal-snapshot::before{
  content:'';position:absolute;top:-60px;right:-40px;
  width:180px;height:180px;border-radius:50%;
  background:rgba(255,255,255,.03)
}
.deal-snapshot::after{
  content:'';position:absolute;bottom:-40px;left:20px;
  width:120px;height:120px;border-radius:50%;
  background:rgba(255,255,255,.02)
}
.snap-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.snap-title{
  font-size:10px;font-weight:600;color:rgba(255,255,255,.5);
  letter-spacing:1.2px;text-transform:uppercase
}
.snap-gng{
  display:inline-flex;align-items:center;gap:5px;padding:5px 13px;
  border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.3px
}
.snap-gng.go{background:rgba(22,101,52,.3);color:#86EFAC;border:1px solid rgba(134,239,172,.25)}
.snap-gng.no{background:rgba(153,27,27,.3);color:#FCA5A5;border:1px solid rgba(252,165,165,.25)}
.snap-gng.cond{background:rgba(146,64,14,.3);color:#FCD34D;border:1px solid rgba(252,211,77,.25)}
.snap-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
.snap-kpi{padding:10px 12px;background:rgba(255,255,255,.07);border-radius:10px;border:1px solid rgba(255,255,255,.1)}
.snap-kpi-lbl{font-size:8px;font-weight:700;color:rgba(255,255,255,.4);letter-spacing:.8px;text-transform:uppercase;margin-bottom:4px}
.snap-kpi-val{font-size:20px;font-weight:800;color:#fff;letter-spacing:-.5px;line-height:1}
.snap-kpi-val.good{color:#86EFAC}.snap-kpi-val.warn{color:#FCD34D}.snap-kpi-val.bad{color:#FCA5A5}.snap-kpi-val.neutral{color:rgba(255,255,255,.3)}
.snap-kpi-sub{font-size:9px;color:rgba(255,255,255,.35);margin-top:3px;font-weight:500}
.snap-concl{
  background:rgba(255,255,255,.09);border-radius:10px;
  padding:11px 14px;border:1px solid rgba(255,255,255,.12);
  display:flex;gap:14px;align-items:flex-start
}
.snap-concl-txt{font-size:12px;color:rgba(255,255,255,.82);line-height:1.6;flex:1;font-weight:400}

/* ── SECTION HEADS ───────────────────────────────── */
.section-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;margin-top:4px}
.section-num{
  width:24px;height:24px;border-radius:50%;background:var(--bl);color:#fff;
  font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0
}
.section-head-lbl{
  font-size:11px;font-weight:700;text-transform:uppercase;
  letter-spacing:.8px;color:var(--tx3);white-space:nowrap
}
.section-head-line{flex:1;height:1px;background:var(--bd)}

/* ── CARDS ───────────────────────────────────────── */
.acard{
  background:var(--wh);border:1px solid var(--bd);
  border-radius:var(--r);padding:16px 18px;margin-bottom:10px;
  box-shadow:var(--sh)
}
.acard-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
.acard-lbl{
  font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;
  color:var(--bl);display:flex;align-items:center;gap:6px
}
.acard-lbl::before{content:'';width:3px;height:11px;background:var(--or);border-radius:2px;flex-shrink:0}
.mrow{display:grid;gap:8px}
.mrow.c2{grid-template-columns:1fr 1fr}
.mrow.c3{grid-template-columns:1fr 1fr 1fr}
.mrow.c4{grid-template-columns:1fr 1fr 1fr 1fr}
.metric{background:var(--bg);border-radius:10px;padding:11px 13px;border:1px solid var(--bd-l)}
.metric.accent{background:var(--bl-bg);border-color:var(--bl-bd)}
.m-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--tx4);margin-bottom:3px}
.m-val{font-size:17px;font-weight:800;line-height:1;letter-spacing:-.3px}
.m-sub{font-size:9px;color:var(--tx4);margin-top:3px;font-weight:500}
.cg{color:var(--gn)}.cw{color:var(--wn)}.cr{color:var(--rk)}.cb{color:var(--bl)}.cgy{color:var(--tx4)}

/* ── BADGES ──────────────────────────────────────── */
.bdg{
  display:inline-flex;align-items:center;padding:3px 8px;
  border-radius:20px;font-size:10px;font-weight:600;letter-spacing:.2px
}
.bdg-g{background:var(--gn-bg);color:var(--gn);border:1px solid var(--gn-bd)}
.bdg-w{background:var(--wn-bg);color:var(--wn);border:1px solid var(--wn-bd)}
.bdg-r{background:var(--rk-bg);color:var(--rk);border:1px solid var(--rk-bd)}
.bdg-b{background:var(--bl-bg);color:var(--bl);border:1px solid var(--bl-bd)}

/* ── LTV BAR ─────────────────────────────────────── */
.ltv-track{height:6px;background:var(--bd);border-radius:4px;overflow:hidden;margin:8px 0 4px}
.ltv-fill{height:100%;border-radius:4px;transition:width .4s ease}
.ltv-marks{display:flex;justify-content:space-between;font-size:9px;color:var(--tx4);font-weight:500}

/* ── RISKS ───────────────────────────────────────── */
.risk-list{display:flex;flex-direction:column;gap:6px}
.risk-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:10px}
.risk-item.krit{background:var(--rk-bg);border:1px solid var(--rk-bd)}
.risk-item.aand{background:var(--wn-bg);border:1px solid var(--wn-bd)}
.risk-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:3px}
.risk-t{font-size:12px;font-weight:600;color:var(--tx);margin-bottom:2px;line-height:1.4}
.risk-sub{font-size:10px;color:var(--tx3);font-weight:400}
.risk-act{font-size:10px;color:var(--tx2);margin-top:3px;font-weight:500}
.risk-act::before{content:"→ ";font-weight:700;color:var(--or)}
.action-item{
  display:flex;align-items:flex-start;gap:8px;padding:8px 11px;
  border-radius:8px;margin-bottom:5px;font-size:12px;line-height:1.5;font-weight:400
}
.action-item.kritisch{background:var(--rk-bg);border-left:3px solid var(--rk)}
.action-item.hoog{background:var(--or-bg);border-left:3px solid var(--or)}
.action-item.medium{background:var(--bl-bg);border-left:3px solid var(--bl)}
.action-item.laag{background:var(--gn-bg);border-left:3px solid var(--gn)}

/* ── DOCUMENT UPLOAD ─────────────────────────────── */
.doc-category{
  background:var(--wh);border:1px solid var(--bd);
  border-radius:var(--r-sm);margin-bottom:8px;overflow:hidden
}
.doc-cat-header{
  display:flex;align-items:center;gap:8px;padding:9px 11px;
  cursor:pointer;background:var(--bg);border-bottom:1px solid var(--bd-l);
  transition:background .12s
}
.doc-cat-header:hover{background:var(--bg2)}
.doc-cat-icon{font-size:14px;flex-shrink:0}
.doc-cat-lbl{font-size:11px;font-weight:600;flex:1;color:var(--tx2)}
.doc-cat-count{font-size:10px;font-weight:600;color:var(--tx4);flex-shrink:0}
.doc-cat-status{font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px;flex-shrink:0;letter-spacing:.2px}
.doc-cat-status.ok{background:var(--gn-bg);color:var(--gn)}
.doc-cat-status.miss{background:var(--rk-bg);color:var(--rk)}
.doc-cat-status.opt{background:var(--bg3);color:var(--tx4)}
.doc-cat-body{padding:10px 11px}
.doc-file-list{display:flex;flex-direction:column;gap:4px;margin-bottom:7px}
.doc-file-item{
  display:flex;align-items:center;gap:7px;padding:6px 9px;
  background:var(--bg);border:1px solid var(--bd-l);border-radius:7px;font-size:10px;
  transition:background .3s,border-color .3s
}
.doc-file-item.doc-file-new{
  background:var(--gn-bg);border-color:var(--gn-bd);
  animation:fileSlideIn .3s ease-out
}
@keyframes fileSlideIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.doc-file-name{flex:1;color:var(--tx2);font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.doc-file-date{color:var(--tx4);font-size:9px;flex-shrink:0}
.doc-file-del{
  width:20px;height:20px;border-radius:5px;background:var(--rk-bg);
  border:none;cursor:pointer;color:var(--rk);font-size:11px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .12s
}
.doc-file-del:hover{background:var(--rk);color:var(--wh)}
.doc-upload-btn{
  display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 12px;
  background:var(--bl-bg);border:1.5px dashed var(--bl-bd);border-radius:8px;
  cursor:pointer;font-size:11px;font-weight:600;color:var(--bl);
  transition:all .15s;position:relative;width:100%
}
.doc-upload-btn:hover{background:var(--bl-bg2);border-color:var(--bl)}
.doc-upload-btn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.doc-upload-btn.loading{opacity:.6;pointer-events:none}

/* ── LENDER CARDS ────────────────────────────────── */
.lender-card{
  background:var(--wh);border:1px solid var(--bd);
  border-radius:var(--r);margin-bottom:10px;overflow:hidden;box-shadow:var(--sh)
}
.lender-card-header{display:flex;align-items:center;gap:11px;padding:13px 15px;border-bottom:1px solid var(--bd-l)}
.lender-badge-type{
  font-size:9px;font-weight:700;text-transform:uppercase;
  letter-spacing:.8px;padding:3px 7px;border-radius:20px
}
.lender-badge-type.bank{background:var(--bl-bg);color:var(--bl);border:1px solid var(--bl-bd)}
.lender-badge-type.non-bank{background:var(--pur-bg);color:var(--pur);border:1px solid var(--pur-bd)}
.lender-name{font-size:14px;font-weight:700;flex:1;color:var(--tx)}
.lender-score-wrap{text-align:right;flex-shrink:0}
.lender-score{font-size:22px;font-weight:800;line-height:1}
.lender-score-lbl{font-size:8px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-top:1px;font-family:var(--font)}
.lender-bar-outer{height:3px;background:var(--bd);border-radius:2px;overflow:hidden;width:52px;margin-left:auto;margin-top:3px}
.lender-bar-fill{height:100%;border-radius:2px;transition:width .4s}
.lender-card-body{padding:11px 15px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lender-col-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--tx4);margin-bottom:6px}
.lender-point{display:flex;align-items:flex-start;gap:6px;font-size:11px;color:var(--tx2);margin-bottom:4px;line-height:1.4;font-weight:400}
.lender-point.plus::before{content:'+';color:var(--gn);font-weight:700;flex-shrink:0}
.lender-point.min::before{content:'−';color:var(--rk);font-weight:700;flex-shrink:0}
.lender-match-type{font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px;margin-top:4px;display:inline-block;letter-spacing:.2px}
.lender-match-type.sterk{background:var(--gn-bg);color:var(--gn);border:1px solid var(--gn-bd)}
.lender-match-type.redelijk{background:var(--wn-bg);color:var(--wn);border:1px solid var(--wn-bd)}
.lender-match-type.zwak{background:var(--rk-bg);color:var(--rk);border:1px solid var(--rk-bd)}
.lender-descr{font-size:11px;color:var(--tx3);padding:0 15px 11px;font-style:italic;font-weight:400;line-height:1.5}

/* ── DOCUMENT ANALYSE BLOK ───────────────────────── */
/* ── DOCUMENTANALYSE — nieuw design ─────────────────── */
.da-blok{margin-bottom:10px}
.da-kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.da-kpi{background:var(--wh);border:1px solid var(--bd);border-radius:var(--r);padding:11px 13px}
.da-kpi-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--tx4);margin-bottom:3px}
.da-kpi-val{font-size:20px;font-weight:700;color:var(--tx);line-height:1.1}
.da-kpi-val.da-good{color:var(--gn)}
.da-kpi-val.da-warn{color:var(--wn)}
.da-kpi-val.da-danger{color:var(--rk)}
.da-kpi-sub{font-size:10px;color:var(--tx4);margin-top:2px}
.da-cards-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.da-card{background:var(--wh);border:1px solid var(--bd);border-radius:var(--r);padding:13px 15px}
.da-card-head{display:flex;align-items:center;gap:7px;margin-bottom:10px;padding-bottom:9px;border-bottom:1px solid var(--bd-l)}
.da-card-icon{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;font-style:normal}
.da-icon-bedrijf{background:var(--bl-bg);color:var(--bl)}
.da-icon-fin{background:var(--pur-bg);color:var(--pur)}
.da-icon-vastgoed{background:var(--wn-bg);color:var(--wn)}
.da-icon-krediet{background:var(--gn-bg);color:var(--gn)}
.da-card-title{font-size:11px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.5px}
.da-row{display:flex;justify-content:space-between;align-items:baseline;padding:3.5px 0;border-bottom:1px solid var(--bd-l)}
.da-row:last-child{border-bottom:none}
.da-row-key{font-size:11.5px;color:var(--tx3)}
.da-row-val{font-size:11.5px;font-weight:600;color:var(--tx2);text-align:right;max-width:58%}
.da-row-val.da-good{color:var(--gn)}
.da-row-val.da-warn{color:var(--wn)}
.da-row-val.da-danger{color:var(--rk)}
.da-risico-blok{background:var(--wh);border:1px solid var(--bd);border-radius:var(--r);padding:13px 15px;margin-bottom:8px}
.da-risico-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:9px;border-bottom:1px solid var(--bd-l)}
.da-risico-head-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--tx2)}
.da-risico-count{font-size:10px;padding:2px 8px;border-radius:20px;background:var(--rk-bg);color:var(--rk);border:1px solid var(--rk-bd);font-weight:600;margin-left:auto}
.da-risico-list{display:flex;flex-direction:column;gap:5px}
.da-risico-item{display:flex;align-items:flex-start;gap:8px;padding:7px 10px;border-radius:7px}
.da-risico-item.r-high{background:var(--rk-bg);border:1px solid var(--rk-bd)}
.da-risico-item.r-med{background:var(--wn-bg);border:1px solid var(--wn-bd)}
.da-risico-item.r-low{background:var(--gn-bg);border:1px solid var(--gn-bd)}
.da-risico-item.r-info{background:var(--bl-bg);border:1px solid var(--bl-bd)}
.da-rdot{width:7px;height:7px;border-radius:50%;margin-top:4px;flex-shrink:0}
.da-rdot.r-high{background:var(--rk)}
.da-rdot.r-med{background:var(--wn)}
.da-rdot.r-low{background:var(--gn)}
.da-rdot.r-info{background:var(--bl)}
.da-risico-text{font-size:11.5px;color:var(--tx2);line-height:1.4}
.da-risico-text strong{font-weight:700}
.da-risico-text span{display:block;font-size:10.5px;color:var(--tx3);margin-top:1px}
.da-vervolg-blok{background:var(--wh);border:1px solid var(--bd);border-radius:var(--r);padding:13px 15px;margin-bottom:8px}
.da-vervolg-head{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--tx2);margin-bottom:9px;padding-bottom:9px;border-bottom:1px solid var(--bd-l)}
.da-vervolg-item{display:flex;align-items:flex-start;gap:8px;padding:5px 0;border-bottom:1px solid var(--bd-l);font-size:11.5px;color:var(--tx2)}
.da-vervolg-item:last-child{border-bottom:none}
.da-vervolg-num{font-weight:700;color:var(--bl);min-width:16px;flex-shrink:0}
.da-note-bar{background:var(--bl-bg);border:1px solid var(--bl-bd);border-radius:7px;padding:9px 13px;font-size:11.5px;color:var(--tx3);display:flex;gap:8px}
.da-note-bar strong{color:var(--tx2);font-weight:700}
/* samenvatting blok */
.da-summary-blok{background:var(--wh);border:1px solid var(--bd);border-radius:var(--r);padding:13px 15px;margin-bottom:8px}
.da-summary-head{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--tx2);margin-bottom:9px;padding-bottom:9px;border-bottom:1px solid var(--bd-l);display:flex;align-items:center;gap:7px}
.da-summary-badge{background:var(--pur);color:#fff;font-size:9px;font-weight:700;letter-spacing:.5px;padding:2px 8px;border-radius:20px;text-transform:uppercase}
.da-summary-item{font-size:11.5px;color:var(--tx3);line-height:1.6;padding:3px 0;border-bottom:1px solid var(--bd-l)}
.da-summary-item:last-child{border-bottom:none}
.da-summary-item em{font-style:normal;color:var(--tx2);font-weight:600}
/* print compat */
.doc-analyse-blok{margin-bottom:10px}

/* ── VERDICT ─────────────────────────────────────── */
.verdict-card{border-radius:var(--r);padding:16px 18px;margin-bottom:10px;border-width:1.5px;border-style:solid}
.verdict-card.good{background:var(--gn-bg);border-color:var(--gn-bd)}
.verdict-card.blauw{background:var(--bl-bg);border-color:var(--bl-bd)}
.verdict-card.warn{background:var(--wn-bg);border-color:var(--wn-bd)}
.verdict-card.oranje{background:var(--or-bg);border-color:var(--or-bd)}
.verdict-card.bad{background:var(--rk-bg);border-color:var(--rk-bd)}
.verdict-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.verdict-gng{font-size:14px;font-weight:800}
.verdict-lbl{font-size:13px;font-weight:600}
.verdict-txt{font-size:12.5px;color:var(--tx2);line-height:1.65;font-weight:400}

/* ── WHAT-IF ─────────────────────────────────────── */
.whatif-result{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px}

/* ── CONFLICT ────────────────────────────────────── */
.cf-item{display:flex;gap:8px;padding:8px 10px;border-radius:8px;margin-bottom:5px}
.cf-hard{background:var(--rk-bg);border:1px solid var(--rk-bd)}
.cf-zacht{background:var(--wn-bg);border:1px solid var(--wn-bd)}
.cf-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:3px}
.cf-lbl{font-size:11px;font-weight:600;margin-bottom:2px}
.cf-sub{font-size:9.5px;color:var(--tx3)}
.cf-act{font-size:10px;color:var(--tx2);margin-top:2px;font-weight:500}
.cf-act::before{content:"→ ";font-weight:700;color:var(--or)}

/* ── ASIDE ───────────────────────────────────────── */
.aside-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:4px 0;border-bottom:1px solid var(--bd-l)
}
.aside-row:last-child{border-bottom:none}
.aside-k{font-size:10px;color:var(--tx3);font-weight:400}
.aside-v{font-size:11px;font-weight:700}
.aside-v.cg{color:var(--gn)}.aside-v.cw{color:var(--wn)}.aside-v.cr{color:var(--rk)}.aside-v.cb{color:var(--bl)}.aside-v.cgy{color:var(--tx4)}
.doss-bar{height:5px;background:var(--bd);border-radius:3px;overflow:hidden;margin-bottom:5px}
.doss-fill{height:100%;border-radius:3px;transition:width .4s}
.doss-lbl{display:flex;justify-content:space-between;font-size:10px;margin-bottom:8px;font-weight:500}
.rd-pills{display:flex;flex-direction:column;gap:4px}
.rd-pill{display:flex;align-items:center;justify-content:space-between;padding:3px 0}
.rd-pill-lbl{font-size:10px;color:var(--tx3);font-weight:400}
.rd-pill-val{font-size:9px;font-weight:700;padding:2px 6px;border-radius:20px;letter-spacing:.2px}
.rd-ok{background:var(--gn-bg);color:var(--gn)}
.rd-bl{background:var(--bl-bg);color:var(--bl)}
.rd-warn{background:var(--wn-bg);color:var(--wn)}
.rd-bad{background:var(--rk-bg);color:var(--rk)}

/* ── SCORE RING ──────────────────────────────────── */
.sc-w{display:flex;flex-direction:column;align-items:center;gap:6px}
.sc-r{position:relative;width:80px;height:80px}
.sc-tr{fill:none;stroke:var(--bd);stroke-width:7}
.sc-fl{fill:none;stroke-width:7;stroke-linecap:round;transform:rotate(-90deg);transform-origin:center;transition:stroke-dashoffset .5s ease}
.sc-in{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column}
.sc-n{font-size:24px;font-weight:800;line-height:1;letter-spacing:-.5px}
.sc-d{font-size:10px;color:var(--tx4);font-weight:500}
.sc-lb{font-size:10px;font-weight:700;text-align:center}

/* ── MISC ────────────────────────────────────────── */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px;gap:10px}
.es-icon{font-size:40px}
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:9px 16px;
  border-radius:8px;cursor:pointer;font-family:var(--font);font-size:11px;
  font-weight:600;border:none;transition:all .15s;letter-spacing:.1px
}
.btn-sm{padding:5px 10px;font-size:10px}
.btn-bl{background:var(--bl);color:#fff;box-shadow:0 1px 3px rgba(43,95,142,.25)}
.btn-bl:hover{background:var(--bl-m)}
.btn-or{background:var(--or);color:#fff;box-shadow:0 1px 3px rgba(217,107,58,.25)}
.btn-or:hover{background:var(--or-d)}
.btn-ghost{background:transparent;color:var(--tx3);border:1.5px solid var(--bd)}
.btn-ghost:hover{background:var(--bg2);color:var(--tx2)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.spn{
  display:inline-block;width:12px;height:12px;border-radius:50%;
  border:2px solid rgba(43,95,142,.2);border-top-color:var(--bl);
  animation:spin .7s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}
.af-banner{
  background:var(--bl-bg);border:1px solid var(--bl-bd);
  border-radius:10px;padding:10px 12px;margin-bottom:10px;
  display:flex;align-items:center;gap:8px
}
.af-tag{
  background:var(--bl);color:#fff;font-size:8px;font-weight:700;
  padding:2px 6px;border-radius:10px;letter-spacing:.5px;
  text-transform:uppercase;flex-shrink:0
}
.af-txt{font-size:11px;color:var(--bl);flex:1;font-weight:500}
.sum-t{width:100%;border-collapse:collapse;font-size:11px}
.sum-t td{padding:4px 0;border-bottom:1px solid var(--bd-l)}
.sum-t td:first-child{color:var(--tx4);width:48%;font-weight:400}
.sum-t td:last-child{font-weight:700;text-align:right;color:var(--tx)}
.d-it{
  display:flex;align-items:center;gap:7px;padding:5px 0;
  border-bottom:1px solid var(--bd-l);font-size:11px;color:var(--tx2);font-weight:400
}
.memo{
  font-size:10px;line-height:1.8;white-space:pre-wrap;color:var(--tx2);
  background:var(--bg);border-radius:8px;padding:12px 14px;
  border:1px solid var(--bd);font-family:monospace
}

/* ── MODAL ───────────────────────────────────────── */
.modal-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);
  z-index:400;align-items:center;justify-content:center;
  backdrop-filter:blur(4px)
}
.modal-box{
  background:var(--wh);border-radius:16px;padding:24px;max-width:500px;width:92%;
  box-shadow:var(--sh-lg);border:1px solid var(--bd)
}
.modal-head{font-size:15px;font-weight:700;margin-bottom:16px;color:var(--tx)}
.modal-tab-row{display:flex;border-bottom:1.5px solid var(--bd);margin-bottom:16px}
.modal-tab{
  padding:7px 14px;font-size:11px;font-weight:600;cursor:pointer;
  border-bottom:2px solid transparent;margin-bottom:-1.5px;color:var(--tx4);
  transition:color .12s
}
.modal-tab.active{color:var(--bl);border-bottom-color:var(--bl)}
.modal-section{display:none}.modal-section.active{display:block}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
textarea.modal-ta{
  width:100%;height:120px;padding:10px 12px;border:1.5px solid var(--bd);
  border-radius:8px;font-family:var(--font);font-size:12px;
  resize:none;outline:none;background:var(--bg);color:var(--tx)
}
textarea.modal-ta:focus{border-color:var(--bl);box-shadow:0 0 0 3px rgba(43,95,142,.1)}
.pdf-drop{
  border:2px dashed var(--bd);border-radius:10px;padding:28px;
  text-align:center;cursor:pointer;position:relative;transition:all .15s
}
.pdf-drop:hover{border-color:var(--bl);background:var(--bl-bg)}
.pdf-drop input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.pdf-drop-icon{font-size:28px;margin-bottom:8px}
.pdf-drop-lbl{font-size:12px;font-weight:600;color:var(--tx2);margin-bottom:4px}
.pdf-drop-sub{font-size:10px;color:var(--tx4)}

/* ══════════════════════════════════════════════════════
   PRINT — Professioneel A4 rapport
   ══════════════════════════════════════════════════════ */
@media print {

  /* ── Pagina-setup ──────────────────────────────────── */
  @page { margin:16mm 14mm 14mm; size:A4 portrait }
  @page :first { margin-top:0 }

  /* ── Base reset ────────────────────────────────────── */
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  html,body{font-size:10px!important;color:#111827!important;background:#fff!important;font-family:'Inter',system-ui,sans-serif!important}

  /* ── Layout: verberg alles behalve hoofdpanel ──────── */
  .hdr,.panel-input,.panel-aside,
  .what-if-section,#PRINT_BTN_ROW,
  .hdr-btn,.doc-upload-btn,.doc-file-del,
  .doc-cat-header,.empty-state{display:none!important}
  .app-shell{display:block!important;max-width:none!important}
  .panel-main{padding:0!important;min-width:0!important}

  /* ── Print cover header (per pagina via running element) */
  .print-header{
    display:flex!important;
    align-items:center;justify-content:space-between;
    padding:10mm 14mm 6mm;
    background:#1e4469;
    color:#fff;
    margin:0 -14mm;
    margin-top:-16mm;
    margin-bottom:8mm;
  }
  .print-logo-wrap{display:flex!important;align-items:center;gap:10px}
  .print-logo-svg svg path,.print-logo-svg svg line,.print-logo-svg svg circle{stroke:#fff!important}
  .print-logo-svg svg text{fill:#fff!important}
  .print-logo-name{color:#fff!important;font-size:15px!important;font-weight:800!important}
  .print-logo-sub{color:rgba(255,255,255,.65)!important;font-size:8px!important;letter-spacing:2px}
  .print-meta{text-align:right;color:rgba(255,255,255,.7)!important;font-size:9px!important;line-height:1.7}
  .print-meta strong{color:#fff!important;font-size:12px!important;display:block;margin-bottom:1px}

  /* ── Deal Snapshot ─────────────────────────────────── */
  .deal-snapshot{
    background:#1e4469!important;
    border-radius:8px!important;
    padding:12px 14px!important;
    margin-bottom:10px!important;
    break-inside:avoid;
    page-break-after:avoid;
  }
  .snap-header{margin-bottom:8px!important}
  .snap-title{font-size:9px!important;letter-spacing:1px;color:rgba(255,255,255,.55)!important}
  .snap-kpis{display:grid!important;grid-template-columns:repeat(5,1fr)!important;gap:6px!important}
  .snap-kpi{
    background:rgba(255,255,255,.1)!important;
    border:1px solid rgba(255,255,255,.15)!important;
    border-radius:6px!important;
    padding:8px 9px!important;
  }
  .snap-kpi-lbl{font-size:7.5px!important;color:rgba(255,255,255,.5)!important;text-transform:uppercase;letter-spacing:.7px;margin-bottom:2px}
  .snap-kpi-val{font-size:18px!important;font-weight:700!important;line-height:1}
  .snap-kpi-val.good{color:#6ee7b7!important}
  .snap-kpi-val.warn{color:#fcd34d!important}
  .snap-kpi-val.bad{color:#fca5a5!important}
  .snap-kpi-val.neutral{color:#fff!important}
  .snap-kpi-sub{font-size:8px!important;color:rgba(255,255,255,.5)!important;margin-top:2px}
  .snap-verdict{
    margin-top:8px!important;
    padding:8px 10px!important;
    background:rgba(255,255,255,.08)!important;
    border-radius:6px!important;
    font-size:9px!important;
    color:rgba(255,255,255,.75)!important;
    border:1px solid rgba(255,255,255,.12)!important;
  }
  .snap-gng{
    font-size:9px!important;font-weight:700!important;letter-spacing:.5px;
    padding:3px 9px!important;border-radius:20px!important;
  }
  .snap-gng.go{background:#065f46!important;color:#6ee7b7!important;border:1px solid #6ee7b7!important}
  .snap-gng.cond{background:#78350f!important;color:#fcd34d!important;border:1px solid #fcd34d!important}
  .snap-gng.no{background:#7f1d1d!important;color:#fca5a5!important;border:1px solid #fca5a5!important}
  .snap-sub-scores{color:rgba(255,255,255,.5)!important;font-size:8.5px!important}

  /* ── Sectiekoppen ─────────────────────────────────── */
  .section-head{
    display:flex!important;align-items:center;gap:8px;
    margin-top:12px!important;margin-bottom:7px!important;
    border-bottom:1.5px solid #dde1e8;padding-bottom:5px;
    page-break-after:avoid;break-after:avoid;
  }
  .section-num{
    background:#2B5F8E!important;color:#fff!important;
    font-size:9px!important;font-weight:700!important;
    width:18px!important;height:18px!important;
    border-radius:50%!important;
    display:inline-flex!important;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .section-head-lbl{font-size:11px!important;font-weight:700!important;color:#111827!important;text-transform:uppercase;letter-spacing:.5px}
  .section-head-line{display:none!important}
  .bdg{font-size:8px!important;padding:2px 7px!important;border-radius:20px!important}

  /* ── Analyse-kaarten ──────────────────────────────── */
  .acard{
    box-shadow:none!important;
    border:1px solid #dde1e8!important;
    border-radius:7px!important;
    break-inside:avoid;
    margin-bottom:7px!important;
    padding:10px 12px!important;
  }
  .acard-hd{margin-bottom:8px!important}
  .acard-lbl{font-size:9px!important;font-weight:700!important;text-transform:uppercase;letter-spacing:.5px;color:#374151!important}
  .acard-lbl::before{background:#D96B3A!important;width:3px!important;height:9px!important}

  /* LTV balk */
  .ltv-grid{display:grid!important;grid-template-columns:1fr 1fr!important;gap:8px!important}
  .ltv-val{font-size:20px!important;font-weight:700!important}
  .ltv-bar-wrap{margin-top:6px!important}

  /* Cashflow grid */
  .cf-grid{display:grid!important;grid-template-columns:repeat(3,1fr)!important;gap:8px!important}
  .cf-kpi-val{font-size:16px!important;font-weight:700!important}

  /* Structuur grid */
  .struct-grid{display:grid!important;grid-template-columns:repeat(4,1fr)!important;gap:8px!important}
  .struct-val{font-size:16px!important;font-weight:700!important}

  /* Badges kleuren bewaren */
  .bdg-g{background:#d1fae5!important;color:#065f46!important;border-color:#6ee7b7!important}
  .bdg-r{background:#fee2e2!important;color:#991b1b!important;border-color:#fca5a5!important}
  .bdg-w{background:#fffbeb!important;color:#78350f!important;border-color:#fcd34d!important}
  .bdg-b{background:#dbeafe!important;color:#1e40af!important;border-color:#93c5fd!important}
  .rd-ok{background:#d1fae5!important;color:#065f46!important}
  .rd-bad{background:#fee2e2!important;color:#991b1b!important}
  .rd-warn{background:#fffbeb!important;color:#78350f!important}
  .rd-bl{background:#dbeafe!important;color:#1e40af!important}

  /* ── Risico's ─────────────────────────────────────── */
  .risk-item{break-inside:avoid;margin-bottom:4px!important;padding:6px 9px!important;font-size:9.5px!important}
  .cf-hard{background:#fee2e2!important;border-color:#fca5a5!important}
  .cf-zacht{background:#fffbeb!important;border-color:#fcd34d!important}
  .action-item{break-inside:avoid;padding:5px 8px!important;font-size:9.5px!important}

  /* ── Verdict ──────────────────────────────────────── */
  .verdict-card{break-inside:avoid;margin-bottom:6px!important;padding:10px 12px!important}
  .verdict-card.good{background:#d1fae5!important;border-color:#6ee7b7!important}
  .verdict-card.blauw{background:#dbeafe!important;border-color:#93c5fd!important}
  .verdict-card.warn{background:#fffbeb!important;border-color:#fcd34d!important}

// ⑥ REGEX + PARSERS
// ════════════════════════════════════════════════════
const RX_RV=[/\b(besloten\s+vennootschap)\b/i,/\b(BV|B\.V\.)\b/,/\b(naamloze\s+vennootschap)\b/i,/\b(NV|N\.V\.)\b/,/\b(eenmanszaak)\b/i,/\b(VOF|V\.O\.F\.)\b/i,/\b(maatschap)\b/i];
const RX_KVK_NR=/\bKVK[-\s]?(?:nummer|nr\.?)?[\s:]*(\d{8})\b/i;
const RX_OPRICH=[/\b(?:opgericht|oprichtingsdatum)[\s:]+(\d{1,2}[-\/]\d{1,2}[-\/]\d{2,4})/i];
const RX_SBI=/\bSBI[-\s]?(?:code)?[\s:]*(\d{4,5})\b/i;
const RX_GRY_SCORE=[/(?:kredietscore|credit\s*score|score)[\s:]*([A-D][+\-]?)/i];
const RX_GRY_NEG=["negatief","verhoogd risico","hoog risico","betalingsachterstand","betalingsincident","faillissement","surseance","schuldsanering","wanbetaling","incasso","deurwaarder"];
const RX_GRY_INC=/(\d+)\s*(?:incasso(?:'s)?|gerechtelijk)/i;
const RX_WOZ_W=[/(?:WOZ[-\s]?waarde|vastgestelde\s+waarde)[\s:]*€?\s*([\d.,]+)/i];
const RX_TAX_W=[/(?:(?:getaxeerde?\s+)?marktwaarde|taxatiewaarde|onderhandse\s+verkoopwaarde)[\s:]*€?\s*([\d.,]+)/i];
const RX_PEIL=[/(?:waardepeildatum|peildatum|taxatiedatum)[\s:]+(\d{1,2}[-\/]\d{1,2}[-\/]\d{2,4})/i];
const RX_TAX_IND=["taxatiewaarde","taxatierapport","nwwi","nvm","rics","mrics","taxateur"];
const RX_KAD_EIG=[/(?:eigenaar|t\.n\.v\.|ten\s+name\s+van)[\s:]+([^\n,;]{3,70})/i];
const RX_KAD_KS=[/(?:koopsom|koopprijs|verkoopsom)[\s:]+€?\s*([\d.,]+)/i];
const RX_KAD_LDAT=[/(?:datum\s+levering|leveringsdatum|gepasseerd\s+op)[\s:]+(\d{1,2}[-\/]\d{1,2}[-\/]\d{2,4})/i];
const RX_EUROS=/€\s*([\d.,]+)/g;

function parseBedrag(s){
  if(!s)return null;
  let t=s.trim().replace(/\s/g,'').replace(/[€$£]/g,'');
  // NL: punt+komma aanwezig → punt=duizend, komma=decimaal
  if(/\d\.\d{3},/.test(t)||/\d\.\d{3}$/.test(t)){
    t=t.replace(/\./g,'').replace(',','.');
  } else if(/,\d{2}$/.test(t)){
    t=t.replace(/\./g,'').replace(',','.');
  } else {
    t=t.replace(/,/g,'');
  }
  const n=parseFloat(t);
  return isNaN(n)||n<100||n>50000000?null:Math.round(n);
}
function norRv(s){if(!s)return null;const m=s.toLowerCase();if(m.includes("besloten")||m==="bv"||m==="b.v.")return"BV";if(m.includes("naamloze")||m==="nv"||m==="n.v.")return"NV";if(m.includes("vof")||m.includes("vennootschap onder firma"))return"VOF";if(m.includes("eenmanszaak"))return"Eenmanszaak";if(m.includes("maatschap"))return"Maatschap";return s.trim();}
function telKw(t,kws){const l=t.toLowerCase();return kws.reduce((a,k)=>a+(l.match(new RegExp(k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"))||[]).length,0);}
function matchFirst(t,pats){for(const p of pats){const m=t.match(p);if(m)return m[1]||m[0];}return null;}
function heuEuros(t,mn=50000,mx=5000000){return[...t.matchAll(RX_EUROS)].map(m=>parseBedrag(m[1])).filter(v=>v&&v>=mn&&v<=mx).sort((a,b)=>b-a);}
function fieldConf(w,base,kw){if(!w)return 0;const km={goed:1.0,matig:0.75,slecht:0.4}[kw]||0.5;return Math.min(0.97,base*km);}
function mkField(w,c,b){return{waarde:w??null,confidence:Math.round(c*100)/100,bron:b};}

// ⑦ FILE READERS

async function readPdfText(file) {
  if(typeof pdfjsLib !== 'undefined') {
    try { return await readPdfWithPdfJs(file); }
    catch(e) { console.warn('[PDF.js]', e.message); }
  }
  return await readPdfLegacy(file);
}

async function readPdfWithPdfJs(file) {
  const ab = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: ab}).promise;
  const pageTexts = [];
  for(let i=1;i<=Math.min(pdf.numPages,80);i++){
    const page = await pdf.getPage(i);
    const tc = await page.getTextContent();
    let lastY=null; const parts=[];
    for(const item of tc.items){
      if(!item.str) continue;
      const y=item.transform?item.transform[5]:null;
      if(lastY!==null&&y!==null&&Math.abs(y-lastY)>3) parts.push('\n');
      parts.push(item.str); lastY=y;
    }
    pageTexts.push(parts.join(' ').replace(/  +/g,' '));
  }
  const text=pageTexts.join('\n\n');
  const words=text.match(/[a-zA-Z\u00C0-\u024F]{3,}/g)||[];
  return {text,wordCount:words.length,kwaliteit:words.length>200?'goed':words.length>50?'matig':'slecht'};
}

async function readPdfLegacy(file) {
  return new Promise(resolve=>{
    const r=new FileReader();
    r.onload=e=>{
      const buf=new Uint8Array(e.target.result); let text='';
      for(let i=0;i<Math.min(buf.length,400000);i++){const c=buf[i];if(c>=32&&c<127)text+=String.fromCharCode(c);else if(c===10||c===13)text+=' ';}
      const words=text.match(/[a-zA-Z]{3,}/g)||[];
      resolve({text,wordCount:words.length,kwaliteit:words.length>200?'goed':words.length>50?'matig':'slecht'});
    };
    r.readAsArrayBuffer(file);
  });
}
async function extractTextFromDoc(file) {
  if(file.type==='application/pdf') return await readPdfText(file);
  if(file.type.startsWith('text/')||file.name.endsWith('.txt')) {
    return new Promise(res=>{const r=new FileReader();r.onload=e=>{const t=e.target.result||'';const w=t.match(/[a-zA-Z]{3,}/g)||[];res({text:t,wordCount:w.length,kwaliteit:w.length>50?'goed':'matig'});};r.readAsText(file);});
  }
  return {text:'',wordCount:0,kwaliteit:'slecht'};
}

function extractKvk(parsed,fn){
  const{text,kwaliteit:k}=parsed;const al=text+' '+fn;
  let rv=null;for(const p of RX_RV){const m=al.match(p);if(m){rv=norRv(m[1]||m[0]);break;}}
  if(!rv&&/\bbv\b|holding/i.test(fn))rv='BV';
  const kvkNr=text.match(RX_KVK_NR);
  const bnM=text.match(/(?:(?:handels|bedrijfs)?naam|onderneming)[\s:]+([^\n]{2,60})/i);
  const bn=bnM?bnM[1].trim().substring(0,60):null;
  const opr=matchFirst(text,RX_OPRICH);const sbi=text.match(RX_SBI);const pc=text.match(/\b(\d{4}\s*[A-Z]{2})\b/);
  return{rechtsvorm:mkField(rv,fieldConf(rv,0.90,k),'KVK'),bedrijfsnaam:mkField(bn,fieldConf(bn,0.80,k),'KVK'),kvkNummer:mkField(kvkNr?.[1],fieldConf(kvkNr?.[1],0.97,k),'KVK'),oprichtingsdatum:mkField(opr,fieldConf(opr,0.85,k),'KVK'),sbiCode:mkField(sbi?.[1],fieldConf(sbi?.[1],0.80,k),'KVK'),vestigingsadres:mkField(pc?.[0],fieldConf(pc?.[0],0.75,k),'KVK'),_rechtsvormRaw:rv,_isBV:rv==='BV'||rv==='NV',_heeftTekst:parsed.wordCount>50,_docKwaliteit:k};
}
function extractGraydon(parsed,fn){
  const{text,kwaliteit:k}=parsed;const al=text+' '+fn;
  const negScore=telKw(al,RX_GRY_NEG);const incM=text.match(RX_GRY_INC);const inc=incM?parseInt(incM[1]):0;
  const isH=negScore>=2||inc>=1||/verhoogd\s+risico|hoog\s+risico/i.test(al);
  const isM=!isH&&(negScore===1||/matig\s+risico/i.test(al));
  const rn=isH?'hoog':isM?'gemiddeld':'laag';
  const sM=matchFirst(text,RX_GRY_SCORE);const sL=sM||{hoog:'C — Verhoogd risico',gemiddeld:'B — Matig risico',laag:'A — Laag risico'}[rn];
  const betM=text.match(/(?:betalingsgedrag|betalingservaring)[\s:]+(.{5,80})/i);const bet=betM?betM[1].trim():inc>0?`${inc} incasso(s) gedetecteerd`:isH?'Achterstand gesignaleerd':'Geen bijzonderheden';
  return{kredietscore:mkField(sL,fieldConf(sL,sM?0.88:0.65,k),'Graydon'),risicoklasse:mkField({hoog:'Hoog',gemiddeld:'Gemiddeld',laag:'Laag'}[rn],fieldConf('x',0.80,k),'Graydon'),betalingsgedrag:mkField(bet,fieldConf('x',betM?0.82:0.60,k),'Graydon'),_risicoNiveau:rn,_incassoCount:inc,_heeftTekst:parsed.wordCount>50,_docKwaliteit:k};
}
function extractWoz(parsed,fn){
  const{text,kwaliteit:k}=parsed;
  const itInd=telKw(text,RX_TAX_IND);const isTax=itInd>=1||fn.includes('taxatie');
  const wozS=matchFirst(text,RX_WOZ_W);const wozW=wozS?parseBedrag(wozS):null;
  const taxS=matchFirst(text,RX_TAX_W);const taxW=taxS?parseBedrag(taxS):null;
  let heuW=null;if(!wozW&&!taxW){const bs=heuEuros(text);heuW=bs[0]??null;}
  const dw=taxW||wozW||heuW;const br=taxW?'Taxatie':wozW?'WOZ':isTax?'Taxatie':'WOZ';
  const wc=taxW?0.92:wozW?0.88:heuW?0.50:0;
  const pd=matchFirst(text,RX_PEIL);const adM=text.match(/(?:objectadres|adres\s+object)[\s:]+([^\n]{5,60})/i);
  const bjM=text.match(/\b(?:bouwjaar)[\s:]+(\d{4})\b/i);const opM=text.match(/\b(?:gebruiksoppervlakte?|woonoppervlakte?)[\s:]+(\d+)\s*m²?\b/i);
  return{waardeLeidend:mkField(dw?'€'+dw.toLocaleString():null,wc,br),peildatum:mkField(pd,fieldConf(pd,0.85,k),br),adresObject:mkField(adM?adM[1].trim():null,fieldConf(adM,0.78,k),br),bouwjaar:mkField(bjM?bjM[1]:null,fieldConf(bjM,0.83,k),br),oppervlakte:mkField(opM?opM[1]+' m²':null,fieldConf(opM,0.80,k),br),_definitieveWaarde:dw,_isTaxatie:isTax||!!taxW,_bronLabel:br,_heeftTekst:parsed.wordCount>50,_docKwaliteit:k};
}
function extractKadaster(parsed,fn){

function extractJaarrekening(parsed,fn){
  const{text,kwaliteit:k}=parsed;

  const ebitda=ebitdaM?parseBedrag(ebitdaM[1]):null;

async function parseDoc(type, file) {
  await new Promise(r => setTimeout(r, 300+Math.random()*400));
  const parsed = await extractTextFromDoc(file);
  const fn = file.name.toLowerCase();
  let velden = {};
  if(type==='kvk')              velden = extractKvk(parsed,fn);
  else if(type==='graydon')     velden = extractGraydon(parsed,fn);
  else if(type==='woz')         velden = extractWoz(parsed,fn);
  else if(type==='kadaster')    velden = extractKadaster(parsed,fn);
  else if(type==='jaarrekeningen') velden = extractJaarrekening(parsed,fn);
  const flds = Object.entries(velden).filter(([k])=>!k.startsWith('_')).filter(([,v])=>v&&typeof v==='object'&&v.waarde!==null);
  const oc = flds.length ? Math.round(flds.reduce((a,[,v])=>a+(v.confidence||0),0)/flds.length*100) : 0;
  return {
    ...velden,
    _meta: {
      bestandsnaam: file.name,
      uploadDatum: new Date().toLocaleDateString('nl-NL'),
      type,
      wordCount: parsed.wordCount,
      documentKwaliteit: parsed.kwaliteit,
      overallConfidence: oc,
      rawText: parsed.text,
      parsedFields: velden,
      parserType: 'regex-v1',
      confidence: oc
    }
  };
}

// ════════════════════════════════════════════════════
// ⑨ AI DOCUMENT ANALYSE — centraal voor alle types
// ════════════════════════════════════════════════════
const AI_TEXT_LIMITS = {kvk:20000,graydon:28000,woz:18000,kadaster:18000,jaarrekeningen:28000};

async function runAiAnalysis(type, rawText) {
  if (!rawText || rawText.trim().length < 30) return null;
  const limit = AI_TEXT_LIMITS[type] || 20000;
  const truncated = rawText.length > limit ? rawText.substring(0, limit) : rawText;
  try {
    const response = await fetch('/api/analyze-document', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ docType: type, text: truncated })
    });
    const data = await response.json();
    if (!response.ok) { console.warn(`[AI ${type}]`, data.error || response.status); return null; }
    if (!data || typeof data !== 'object') return null;
    const hasFields = data.fields && Object.values(data.fields).some(v => v && String(v).trim());
    if (!data.summary && !hasFields) { console.warn(`[AI ${type}] Lege output`); return null; }
    // AI data logged in dev only
    return data;
  } catch (err) {
    console.warn(`[AI ${type}] mislukt:`, err.message);
    return null;
  }
}

// ⑬ UPLOAD LOGICA — één correcte definitie
// ════════════════════════════════════════════════════
async function handleUpload(type, file) {
  if (!file) return;
  const dt = DOC_TYPES[type];
  S.loading[type + '_loading'] = true;

  const panel = document.getElementById(`DOC_CAT_${type}`);
  if (panel) {
    const btn = panel.querySelector('.doc-upload-btn');
    if (btn) btn.classList.add('loading');
  }

  try {
    // Stap 1: regex parse
    const parsed = await parseDoc(type, file);

    // Stap 2: AI analyse (alle types)
    const rawText = parsed._meta?.rawText || parsed._meta?.extractedText || '';
    const ai = await runAiAnalysis(type, rawText);

    if (ai) {
    }

    // Stap 3: fileEntry opslaan
    const fileEntry = {
      id: Date.now() + '_' + Math.random().toString(36).slice(2),
      naam: file.name,
      uploadDatum: new Date().toLocaleDateString('nl-NL'),
      parsed,
      ai,
      _justUploaded: true
    };

    if (!dt.multiple) {
      S.docs[type].files = [fileEntry];
    } else {
      S.docs[type].files.push(fileEntry);
    }

    S.autoFill = buildAutoFill();
    S.loading[type + '_loading'] = false;
    fullRender();

    // Na 3s de justUploaded flag wissen en zacht herrenderen
    setTimeout(() => {
      const fe = S.docs[type].files.find(f => f.id === fileEntry.id);
      if(fe) { fe._justUploaded = false; fullRender(); }
    }, 3000);

  } catch (e) {
    console.error('Upload fout:', e);
    S.loading[type + '_loading'] = false;
    fullRender();
  }
}

function deleteFile(type, fileId) {
  S.docs[type].files = S.docs[type].files.filter(f => f.id !== fileId);
  S.autoFill = buildAutoFill();
  fullRender();
}

function doAutoFill() {
  Object.entries(S.autoFill).forEach(([k,v]) => {
    S.form[k] = v.waarde; S.clientData[k] = v.waarde;
    const el = document.getElementById('fi_'+k);
    if(el) el.value = v.waarde;
  });
  S.autoFill = {};
  fullRender();
}

function checkConflicts(form) {
  const hard=[], zacht=[], onverif=[], bevestigd=[];
  const kvk=getFirstParsed('kvk'), graydon=getFirstParsed('graydon');
  const woz=getFirstParsed('woz'), kadaster=getFirstParsed('kadaster');
  const ingMV=parseFloat(form.marktwaarde)||0, ingA=parseFloat(form.aankoopprijs)||0;
  if(kvk){
    const rv=kvk._rechtsvormRaw,isBV=rv&&['BV','NV'].includes(rv);
    if(isBV&&form.typeKlant==='particulier') hard.push({code:'KVK_TYPE',veld:'Type klant',ingevoerd:'Particulier',document:`${rv} (KVK)`,impact:'BV maar als particulier ingevuld',actie:'Verifieer via welke entiteit'});
    else if(!isBV&&rv&&form.typeKlant==='bv') zacht.push({code:'KVK_TYPE_INV',veld:'Type klant',ingevoerd:'BV',document:`${rv} (KVK)`,impact:'Intake BV maar KVK toont andere rechtsvorm',actie:'Controleer entiteit'});
    else if(rv) bevestigd.push({veld:'Rechtsvorm',waarde:rv,bron:'KVK'});
    if(kvk.kvkNummer?.waarde) bevestigd.push({veld:'KVK-nummer',waarde:kvk.kvkNummer.waarde,bron:'KVK'});
  } else if(form.typeKlant==='bv') onverif.push({veld:'Rechtsvorm BV',impact:'BV aangeduid maar KVK ontbreekt'});
  if(woz){
    const dw=woz._definitieveWaarde;
    if(dw&&ingMV>0){const af=Math.abs(ingMV-dw)/dw*100;
      if(af>15) hard.push({code:'WOZ_MV',veld:'Marktwaarde',ingevoerd:fE(ingMV),document:`${fE(dw)} (${woz._bronLabel})`,impact:`Afwijking ${af.toFixed(0)}%`,actie:'Gebruik documentwaarde of actuele taxatie'});
      else if(af>7) zacht.push({code:'WOZ_SM',veld:'Marktwaarde',ingevoerd:fE(ingMV),document:`${fE(dw)} (${woz._bronLabel})`,impact:`Beperkte afwijking ${af.toFixed(0)}%`,actie:'Controleer actualiteit'});
      else bevestigd.push({veld:'Marktwaarde',waarde:fE(dw),bron:woz._bronLabel});
    }
  } else if(ingMV>0) onverif.push({veld:'Marktwaarde',impact:`${fE(ingMV)} niet documentair onderbouwd`});
  if(kadaster){
    const dk=kadaster._koopsomWaarde;
    if(dk&&ingA>0){const af=Math.abs(dk-ingA)/ingA*100;if(af>10)hard.push({code:'KAD_KS',veld:'Aankoopprijs',ingevoerd:fE(ingA),document:`${fE(dk)} (Kadaster)`,impact:`Afwijking ${af.toFixed(0)}%`,actie:'Verifieer welk bedrag leidend is'});else bevestigd.push({veld:'Aankoopprijs',waarde:fE(dk),bron:'Kadaster'});}
    if(kadaster._heeftHypotheek) zacht.push({code:'KAD_HYP',veld:'Hypotheek',ingevoerd:'Niet opgegeven',document:'Aanwezig (Kadaster)',impact:'Bestaande inschrijving kan rangorde beïnvloeden',actie:'Verifieer omvang en rang'});
    if(kadaster._eigenaarRaw) bevestigd.push({veld:'Eigenaar',waarde:kadaster._eigenaarRaw,bron:'Kadaster'});
  } else onverif.push({veld:'Eigendom',impact:'Eigendom niet via Kadaster geverifieerd'});
  if(graydon){
    if(graydon._risicoNiveau==='hoog') hard.push({code:'GRAY_H',veld:'Kredietprofiel',ingevoerd:'—',document:'Verhoogd risico (Graydon)',impact:'Negatieve betaalhistorie',actie:'Bespreek met klant, onderbouw'});
    else if(graydon._risicoNiveau==='gemiddeld') zacht.push({code:'GRAY_M',veld:'Kredietprofiel',ingevoerd:'—',document:'Matig risico (Graydon)',impact:'Bancaire drempel kan spelen',actie:'Toelichting voorbereiden'});
    else bevestigd.push({veld:'Kredietprofiel',waarde:'Geen bijzonderheden',bron:'Graydon'});
  }
  if(form.typeKlant==='bv' && S.docs.jaarrekeningen.files.length===0) {
    onverif.push({veld:'Jaarrekeningen',impact:'BV vereist jaarrekeningen — ontbreken'});
  }
  return {hard,zacht,onverif,bevestigd};
}

function calcMetrics(form) {
  const a=parseFloat(form.aankoopprijs)||0,mv=parseFloat(form.marktwaarde)||0,l=parseFloat(form.gewensteLening)||0,inb=parseFloat(form.eigenInbreng)||0,h=parseFloat(form.huurPerMaand)||0,r=normalizeRente(form.rente),lo=parseInt(form.looptijd)||20,ann=form.metAflossing==='ja';
  const ref=mv>0?Math.min(a,mv):a;
  const ltv=ref>0?(l/ref)*100:null,ltvA=a>0?(l/a)*100:null,ltvM=mv>0?(l/mv)*100:null;
  const mlIO=l>0?(l*r)/12:0,mlAnn=l>0&&r>0?l*(r/12)/(1-Math.pow(1+r/12,-(lo*12))):0,ml=ann?mlAnn:mlIO;
  const dscrIO=mlIO>0&&h>0?h/mlIO:null,dscrAnn=mlAnn>0&&h>0?h/mlAnn:null,dscr=ann?dscrAnn:dscrIO;
  const cf=h-ml,ibP=a>0?(inb/a)*100:null;
  return{a,mv,l,inb,h,r,lo,ann,ltv,ltvA,ltvM,ref,ml,mlIO,mlAnn,dscrIO,dscrAnn,dscr,cf,ibP,maxLeningIO:h>0?(h/1.25)*12/r:null,maxLening80:ref>0?ref*.8:null,e80:ltv!==null&&ltv>80&&ref>0?Math.max(0,l-ref*.8):0,e70:ltv!==null&&ltv>70&&ref>0?Math.max(0,l-ref*.7):0,bh125:ml>0?ml*1.25:null};
}

// ════════════════════════════════════════════════════
// ⑯ SCORE
// ════════════════════════════════════════════════════
function calculateScore(form, m, dossier) {
  const p=parseInt(form.aantalPanden)||0;
  const kvk=getFirstParsed('kvk'),g=getFirstParsed('graydon'),woz=getFirstParsed('woz'),kad=getFirstParsed('kadaster');

  // ── A: Financiële haalbaarheid (LTV + DSCR + inbreng) ──────────
  let A=0;
  if(m.ltv!==null){const x=SCORE_CFG.LTV.find(r=>m.ltv<r.max);if(x)A+=x.d;}
  // DSCR: niet aanwezig = -2.0 (kritisch missen, niet slechts -1)
  if(m.dscr!==null){
    const x=SCORE_CFG.DSCR.find(r=>m.dscr>=r.min);if(x)A+=x.d;
  } else {
    A -= parseFloat(form.huurPerMaand)>0 ? 1.5 : 2.0; // geen huur = zwaarste aftrek
  }
  if(m.ibP!==null){if(m.ibP>=35)A+=1;else if(m.ibP>=25)A+=.5;else if(m.ibP<15)A-=.5;}
  A=Math.max(-5,Math.min(5,A));

  // ── B: Risicoprofiel (klant + vastgoed + context) ───────────────
  let B=0;
  if(p>=5)B+=1.5;else if(p>=3)B+=1;else if(p>=2)B+=.5;else if(p===0)B-=1;
  if(form.woonland==='buiten-eu')B-=1.5;else if(form.woonland==='eu')B-=.75;
  if(form.typeVastgoed==='recreatie')B-=1.25;else if(form.typeVastgoed==='horeca')B-=1;
  if(form.huurType==='bestaand'&&parseFloat(form.huurPerMaand)>0)B+=.5;else if(form.huurType==='prognose')B-=0.4;
  if(form.doelFinanciering==='herfinanciering')B+=.25;if(form.typeKlant==='bv')B+=.25;
  if(p===0&&m.ltv>75)B-=.5;
  // Inkomen als terugbetalingscapaciteit — zwaarder bij geen huur
  const ink = parseFloat(form.inkomen)||0;
  const heeftHuur = parseFloat(form.huurPerMaand)>0;
  if(ink>0) {
    if(!heeftHuur) {
      // Geen huur: inkomen is de enige bron — weegt zwaarder
      if(ink>=150000)B+=1.2; else if(ink>=100000)B+=0.9; else if(ink>=70000)B+=0.6; else if(ink>=40000)B+=0.2; else B-=0.5;
    } else {
      // Huur aanwezig: inkomen als extra zekerheid
      if(ink>=150000)B+=0.6; else if(ink>=100000)B+=0.4; else if(ink>=60000)B+=0.2;
    }
  } else if(!heeftHuur) {
    B-=1.0; // Geen inkomen én geen huur is al afgestraft in A, extra malus hier
  }
  B=Math.max(-4,Math.min(3,B));

  // ── C: Dossier & documentaire onderbouwing ──────────────────────
  let C=0;
  // Graydon: AI-score heeft prioriteit boven regex-heuristiek
  const gAi=S.docs.graydon?.files[0]?.ai;
  const gScore=gAi?.fields?.score ? parseFloat(gAi.fields.score) : null;
  if(gScore!==null&&!isNaN(gScore)){
    // Score 0–100: boven 80 = bonus, onder 50 = straf
    if(gScore>=80)C+=0.5;else if(gScore>=60)C+=0.2;else if(gScore<40)C-=1.0;else if(gScore<60)C-=0.5;
  } else if(g?._risicoNiveau==='hoog') C-=1.5;
  else if(g?._risicoNiveau==='gemiddeld') C-=0.4;
  else if(g?._risicoNiveau==='laag') C+=0.3;

  if(kvk?._isBV&&form.typeKlant==='bv')C+=.3;

  // WOZ/taxatie: documentaire waarde-onderbouwing
  const wozAi=S.docs.woz?.files[0]?.ai;
  const wozW=wozAi?.fields?.taxatiewaarde||wozAi?.fields?.wozWaarde;
  const wozNum=wozW?parseFloat(wozW):woz?._definitieveWaarde;
  if(wozNum){
    const iw=parseFloat(form.marktwaarde)||0;
    if(iw>0&&iw>wozNum*1.15)C-=.75;
    else if(iw>0&&iw<=wozNum*1.05)C+=.3;
    if(wozAi?.fields?.documentType==='taxatie'||woz?._isTaxatie)C+=.2;
  }

  // Kadaster bevestiging
  if(kad?._koopsomWaarde){const dk=kad._koopsomWaarde,ia=parseFloat(form.aankoopprijs)||0;if(ia>0&&Math.abs(ia-dk)/dk<=.05)C+=.2;else if(ia>0&&Math.abs(ia-dk)/dk>.15)C-=.5;}

  // Jaarrekeningen bij BV
  if(form.typeKlant==='bv'){
    if(S.docs.jaarrekeningen.files.length>=2)C+=.5;
    else if(S.docs.jaarrekeningen.files.length===1)C+=.2;
    else C-=.5; // BV zonder jaarrekeningen is een serieuze tekortkoming
  } else if(S.docs.jaarrekeningen.files.length>0)C+=.15;

  // Dossier kwaliteitsscore weegt meetbaar mee
  if(dossier){
    if(dossier.score>=80)C+=.5;
    else if(dossier.score>=60)C+=.25;
    else if(dossier.score>=40)C+=0;
    else if(dossier.score<20)C-=.5;
    else C-=.25;
  }
  C=Math.max(-3,Math.min(2.5,C));

  let totaal=SCORE_CFG.BASE+A+B+C;
  let cap=10;
  const capRedenen=[];
  if(m.dscr!==null&&m.dscr<1.0){cap=Math.min(cap,SCORE_CFG.CAPS.DSCR_K);capRedenen.push('DSCR < 1.0');}
  if(m.ltv!==null&&m.ltv>85){cap=Math.min(cap,SCORE_CFG.CAPS.LTV_85);capRedenen.push('LTV > 85%');}
  if(!parseFloat(form.inkomen)&&!parseFloat(form.huurPerMaand)){cap=Math.min(cap,SCORE_CFG.CAPS.GEEN_CASH);capRedenen.push('Geen cashflow');}
  if(form.woonland!=='nl'&&['horeca','recreatie'].includes(form.typeVastgoed)){cap=Math.min(cap,SCORE_CFG.CAPS.COMBO);capRedenen.push('Buitenland+risicovastgoed');}
  // Graydon hoog risico: gebruik AI-score als beschikbaar
  const gHoog = (gScore!==null&&!isNaN(gScore)) ? gScore<40 : g?._risicoNiveau==='hoog';
  if(gHoog){cap=Math.min(cap,SCORE_CFG.CAPS.GRAYDON_H);capRedenen.push('Kredietrisico hoog');}
  totaal=Math.max(1,Math.min(cap,Math.round(totaal*10)/10));
  const isCapped=cap<10;
  const capReden=capRedenen.join(' · ');
  let label,klasse,route;
  if(totaal>=7.5){label='Goed financierbaar';klasse='good';route='bancair';}
  else if(totaal>=6){label='Bancair mogelijk';klasse='blauw';route='bancair';}
  else if(totaal>=4){label='Non-bank aanbevolen';klasse='warn';route='non-bank';}
  else if(totaal>=2.5){label='Lastig';klasse='oranje';route='moeilijk';}
  else{label='Niet financierbaar';klasse='bad';route='niet';}
  return{score:totaal,label,klasse,route,isCapped,capReden,subScores:{A:Math.round(A*10)/10,B:Math.round(B*10)/10,C:Math.round(C*10)/10}};
}

// ════════════════════════════════════════════════════
// ⑰ DOSSIER KWALITEIT
// ════════════════════════════════════════════════════
function calcDossierQuality(conf, form) {
  let score=0; const det=[];
  const g=getFirstParsed('graydon'), woz=getFirstParsed('woz');
  Object.entries(DOC_TYPES).forEach(([key, dt]) => {
    const catFiles = S.docs[key].files;
    if(catFiles.length > 0) {
      score += dt.weight * 4;
      det.push({l:`${dt.label} aanwezig (${catFiles.length} bestand${catFiles.length>1?'en':''})`,p:dt.weight*4,pos:true});
      const goed = catFiles.filter(f=>f.parsed?._meta?.documentKwaliteit==='goed').length;
      if(goed > 0) { score += 2; det.push({l:`${dt.label}: goed leesbaar`,p:2,pos:true}); }
    }
  });
  const bevP = Math.min((conf?.bevestigd?.length||0)*4,15);
  score += bevP;
  if(bevP>0) det.push({l:`${conf.bevestigd.length} kernveld(en) bevestigd`,p:bevP,pos:true});
  const hk=(conf?.hard?.length||0)*12; score-=hk;
  if(hk>0) det.push({l:`${conf.hard.length} hard conflict(en)`,p:-hk,pos:false});
  const zk=(conf?.zacht?.length||0)*4; score-=zk;
  if(zk>0) det.push({l:`${conf.zacht.length} zachte afwijking(en)`,p:-zk,pos:false});
  const ok=(conf?.onverif?.length||0)*3; score-=ok;
  if(ok>0) det.push({l:`${conf.onverif.length} veld(en) niet geverifieerd`,p:-ok,pos:false});
  if(g){const gp=g._risicoNiveau==='hoog'?-15:g._risicoNiveau==='gemiddeld'?-5:5;score+=gp;det.push({l:`Graydon: ${g._risicoNiveau} risico`,p:gp,pos:gp>0});}
  if(woz?._isTaxatie){score+=3;det.push({l:'Taxatierapport (sterk bewijs)',p:3,pos:true});}
  if(form.typeKlant==='bv' && S.docs.jaarrekeningen.files.length>=2){score+=5;det.push({l:'Jaarrekeningen 2+ jaar aanwezig',p:5,pos:true});}
  score=Math.max(0,Math.min(100,Math.round(score)));
  let label,klasse;
  if(score>=75){label='Sterk dossier';klasse='good';}
  else if(score>=50){label='Voldoende dossier';klasse='blauw';}
  else if(score>=25){label='Matig dossier';klasse='warn';}
  else{label='Zwak dossier';klasse='bad';}
  return{score,label,klasse,det};
}

// ════════════════════════════════════════════════════
// ⑱ READINESS
// ════════════════════════════════════════════════════
function detectReadiness(form, m, conf, sc) {
  function evalRoute(rk, route) {
    const res = route.vereisten.map(req => {const v=req.check(S.docs,form,m,conf);return{...req,voldoet:v};});
    const kFail=res.filter(r=>r.prioriteit==='kritisch'&&!r.voldoet),hFail=res.filter(r=>r.prioriteit==='hoog'&&!r.voldoet);
    const ind=kFail.length===0,compl=kFail.length===0&&hFail.length===0;
    let status,statusKlasse;
    if(compl){status=rk==='bancair'?'Bank-ready':'Non-bank-ready';statusKlasse='good';}
    else if(ind){status='Bijna klaar';statusKlasse='blauw';}
    else{status='Niet indienbaar';statusKlasse='bad';}
    return{route:rk,label:route.label,status,statusKlasse,resultaten:res,kritischFail:kFail,hoogFail:hFail,indienbaar:ind,compleet:compl};
  }
  const bancair=evalRoute('bancair',DOSSIER_REQS.bancair),nonbank=evalRoute('nonbank',DOSSIER_REQS.nonbank);
  const aanb=sc?.route==='bancair'?'bancair':'nonbank';
  let overallStatus,overallKlasse;
  if(bancair.compleet){overallStatus='Bank-ready';overallKlasse='good';}
  else if(nonbank.compleet){overallStatus='Non-bank-ready';overallKlasse='blauw';}
  else if(nonbank.indienbaar){overallStatus='Bijna non-bank-ready';overallKlasse='warn';}
  else{overallStatus='Nog niet indienbaar';overallKlasse='bad';}
  return{bancair,nonbank,aanb,overallStatus,overallKlasse};
}

// ════════════════════════════════════════════════════
// ⑲ RISKS
// ════════════════════════════════════════════════════
function detectRisks(form, m, conf) {
  const krit=[], aand=[];
  const p=parseInt(form.aantalPanden)||0;
  const g=getFirstParsed('graydon');
  if(m.dscr!==null&&m.dscr<1.0)        krit.push({code:'DSCR_K',t:`DSCR ${m.dscr.toFixed(2)} — huurinkomsten dekken maandlasten niet`,i:'Deal breaker',a:m.bh125?`Huur naar min. ${fE(m.bh125)}/mnd`:'Huur of lening aanpassen',oplosbaar:true});
  if(m.ltv!==null&&m.ltv>90)            krit.push({code:'LTV_E',t:`LTV ${fP(m.ltv)} — buiten alle normen`,i:'Geen financier actief',a:`${fE(m.e80)} extra voor LTV 80%`,oplosbaar:true});
  if(!parseFloat(form.inkomen)&&!parseFloat(form.huurPerMaand)) krit.push({code:'CASH',t:'Geen inkomen én geen huurinkomsten',i:'Cashflow onbekend',a:'Inkomensbewijs of huurcontract vereist',oplosbaar:true});
  if(form.woonland!=='nl'&&['horeca','recreatie'].includes(form.typeVastgoed)) krit.push({code:'COMBO',t:'Buitenland + risicovastgoed',i:'Zelfs specialisten terughoudend',a:'Heroverweeg structuur',oplosbaar:false});
  if(g?._risicoNiveau==='hoog')          krit.push({code:'GRAY_H',t:'Graydon: verhoogd kredietrisico',i:'Negatieve betaalhistorie',a:'Onderbouw bij financier',oplosbaar:true});
  if(conf?.hard?.some(c=>c.code==='KVK_TYPE')) krit.push({code:'KVK_ST',t:'KVK spreekt klanttype/rechtsvorm tegen',i:'Structuurmismatch',a:'Verifieer via welke entiteit',oplosbaar:true});
  if(form.typeKlant==='bv'&&S.docs.jaarrekeningen.files.length===0) krit.push({code:'JAARR',t:'BV zonder jaarrekeningen',i:'Inkomenstoets bancair niet mogelijk',a:'Minimaal 2 jaar jaarrekeningen opvragen',oplosbaar:true});
  if(m.ltv>80&&m.ltv<=90)    aand.push({code:'LTV_H',t:`LTV ${fP(m.ltv)} boven bancaire norm`,i:'Banken niet actief >80%',a:`${fE(m.e80)} extra → LTV 80%`,oplosbaar:true});
  if(m.dscr!==null&&m.dscr>=1&&m.dscr<1.25) aand.push({code:'DSCR_L',t:`DSCR ${m.dscr.toFixed(2)} onder norm 1.25`,i:'Bancaire drempel',a:`Huur naar ${fE(m.bh125)}/mnd`,oplosbaar:true});
  if(form.woonland==='buiten-eu') aand.push({code:'BUIT',t:'Buiten EU — beperkt financiersuniversum',i:'Vrijwel alleen RNHB',a:'Richt op RNHB',oplosbaar:false});
  else if(form.woonland==='eu') aand.push({code:'EU',t:'EU (niet NL) — bancair beperkt',i:'NL-banken doorgaans inactief',a:'Non-bank route',oplosbaar:false});
  if(form.typeVastgoed==='horeca') aand.push({code:'HOR',t:'Horeca — verhoogd risico',i:'Banken mijden horeca',a:'RNHB of NIBC',oplosbaar:false});
  if(form.typeVastgoed==='recreatie') aand.push({code:'REC',t:'Recreatie — nichemarkt',i:'Slechts enkele financiers',a:'RNHB',oplosbaar:false});
  if(p===0&&m.ltv>75) aand.push({code:'NERV',t:'Geen ervaring + hoge LTV',i:'Uitvoeringsrisico',a:'Co-belegger overwegen',oplosbaar:true});
  if(form.huurType==='prognose') aand.push({code:'PROG',t:'Huur op prognose',i:'Zwaarder gewogen door financier',a:'Taxateur validatie',oplosbaar:true});
  if(g?._risicoNiveau==='gemiddeld') aand.push({code:'GRAY_M',t:'Graydon: gemiddeld risico',i:'Bancaire drempel kan spelen',a:'Toelichting voorbereiden',oplosbaar:true});
  if(conf?.hard?.some(c=>c.code==='WOZ_MV')) aand.push({code:'WOZ_AFW',t:'WOZ/taxatie wijkt af van marktwaarde',i:'LTV mogelijk onjuist',a:'Corrigeer marktwaarde',oplosbaar:true});
  return{krit,aand};
}

// ════════════════════════════════════════════════════
// ⑳ ADVICE
// ════════════════════════════════════════════════════
function generateAdvice(form, m, risks, sc, doss, readiness) {
  const acties = [];
  const g=getFirstParsed('graydon'), woz=getFirstParsed('woz'), kad=getFirstParsed('kadaster'), kvk=getFirstParsed('kvk');
  risks.krit.forEach(r => acties.push({p:'kritisch',t:r.a}));
  if(m.dscr!==null&&m.dscr<1.25&&m.bh125){const tk=Math.ceil(m.bh125-m.h);if(tk>0)acties.push({p:'hoog',t:`Huur ${fE(tk)} hoger nodig (→ ${fE(m.bh125)}/mnd) voor DSCR 1.25`});}
  if(m.ltv>85&&m.e80>0) acties.push({p:'kritisch',t:`${fE(m.e80)} extra inbreng voor LTV → 80%`});
  else if(m.ltv>80&&m.ltv<=85&&m.e80>0) acties.push({p:'hoog',t:`${fE(m.e80)} extra inbreng → LTV 80%, opent bancaire route`});
  if(g?._risicoNiveau==='hoog') acties.push({p:'hoog',t:'Graydon verhoogd risico — onderbouw betalingshistorie'});
  if(woz?._definitieveWaarde){const dw=woz._definitieveWaarde,iw=parseFloat(form.marktwaarde)||0;
    if(iw>dw*1.15) acties.push({p:'hoog',t:`${woz._bronLabel} (${fE(dw)}) bevestigt marktwaarde (${fE(iw)}) niet`});
    else acties.push({p:'laag',t:`${woz._isTaxatie?'Taxatierapport':'WOZ'} bevestigt marktwaarde — sterk dossieronderdeel`});
  } else acties.push({p:'medium',t:'Geen WOZ/taxatie — marktwaarde niet onderbouwd.'});
  if(kad?._heeftHypotheek) acties.push({p:'medium',t:'Kadaster: bestaande hypotheekinschrijving — verifieer omvang'});
  if(kvk?._isBV&&form.typeKlant==='bv') acties.push({p:'laag',t:'KVK bevestigt BV-structuur — positief'});
  if(readiness){
    const pr=readiness[readiness.aanb];
    pr?.kritischFail?.forEach(r=>acties.push({p:'kritisch',t:`Vereist voor indiening: ${r.label}`}));
    pr?.hoogFail?.forEach(r=>acties.push({p:'hoog',t:`Wenselijk: ${r.label}`}));
  }
  if(sc.route==='bancair'&&readiness?.bancair?.indienbaar) acties.push({p:'laag',t:'Profiel en dossier lijken klaar voor bancaire indiening'});
  else if(sc.route==='non-bank') acties.push({p:'medium',t:'Richt aanvraag op non-bank financiers'});
  return acties;
}

// ════════════════════════════════════════════════════
// ㉑ LENDER MATCH ENGINE
// Logica: harde blokkers eerst, dan positieve indicatoren
// ════════════════════════════════════════════════════
function matchLenders(form, m, sc, doss) {
  const p = parseInt(form.aantalPanden) || 0;
  const g = getFirstParsed('graydon');
  const gAi = S.docs.graydon?.files[0]?.ai;
  const gScore = gAi?.fields?.score ? parseFloat(gAi.fields.score) : null;
  const gRisico = (gScore !== null && !isNaN(gScore)) ? (gScore >= 70 ? 'laag' : gScore >= 50 ? 'gemiddeld' : 'hoog') : g?._risicoNiveau;

  // Gewogen scoring: elke categorie heeft een max gewicht
  // Totaal max = 100 punten verdeeld over 6 categorieën
  // LTV-match (25) + DSCR-match (25) + Profiel-fit (20) + Leningbedrag (15) + Krediet/trackrecord (10) + Dossier (5)

  return LENDERS.map(l => {
    const plus = [], min = [];

    // ── 1. HARDE BLOKKERS ──────────────────────────────────────
    const hardBlok = [];
    if(!l.woonlanden.includes(form.woonland))
      hardBlok.push(`Woonland (${form.woonland === 'buiten-eu' ? 'buiten EU' : 'EU'}) buiten beleid`);
    if(!l.vastgoedTypes.includes(form.typeVastgoed))
      hardBlok.push(`${form.typeVastgoed} niet in beleid`);
    if(!l.klantTypes.includes(form.typeKlant))
      hardBlok.push(`${form.typeKlant === 'bv' ? 'BV' : 'Particulier'} niet in beleid`);
    if(!l.doelen.includes(form.doelFinanciering))
      hardBlok.push(`${form.doelFinanciering} niet geaccepteerd`);
    if(m.ltv !== null && m.ltv > l.maxLTV)
      hardBlok.push(`LTV ${fP(m.ltv)} overschrijdt max ${l.maxLTV}%`);
    if(m.l > 0 && m.l > l.maxLening)
      hardBlok.push(`Bedrag ${fE(m.l)} boven max ${fE(l.maxLening)}`);
    if(hardBlok.length > 0)
      return {...l, score:0, kl:'bad', matchType:'niet', plus:[], min:hardBlok, blokkers:hardBlok, blokkeerd:true};

    // ── 2. SCORING: elk criterium levert een score 0-100 op ────
    // Eindscore = gewogen gemiddelde van alle criteria
    // Criteria met onbekende waarde tellen neutraal mee (50)

    const criteria = [];

    // A) LTV-ruimte t.o.v. norm van déze financier (gewicht 30)
    // Hoe meer ruimte onder de max-LTV van deze specifieke financier, hoe beter
    if(m.ltv !== null) {
      const marge = l.maxLTV - m.ltv; // bijv. maxLTV 80, ltv 10 → marge 70
      const ltvScore = Math.min(100, Math.max(0, Math.round(marge * 1.2))); // 70 marge → 84 score
      criteria.push({w:30, s:ltvScore});
      if(marge >= 40)      plus.push(`LTV ${fP(m.ltv)} — ruim onder norm (max ${l.maxLTV}%)`);
      else if(marge >= 20) plus.push(`LTV ${fP(m.ltv)} — goed binnen norm (max ${l.maxLTV}%)`);
      else if(marge >= 5)  plus.push(`LTV ${fP(m.ltv)} — krap binnen norm (max ${l.maxLTV}%)`);
      else                 { plus.push(`LTV aan de grens (max ${l.maxLTV}%)`); }
    } else {
      criteria.push({w:30, s:50}); // neutraal
    }

    // B) DSCR t.o.v. minimum van déze financier (gewicht 25)
    // Elke financier heeft een ander minDSCR — hogere ratio = betere score voor díe partij
    if(m.dscr !== null) {
      if(m.dscr < l.minDSCR) {
        const tekort = l.minDSCR - m.dscr;
        const dscrScore = Math.max(0, Math.round(50 - tekort * 80));
        criteria.push({w:25, s:dscrScore});
        min.push(`DSCR ${m.dscr.toFixed(2)} onder minimum ${l.minDSCR} van deze financier`);
      } else {
        const ratio = m.dscr / l.minDSCR; // bijv. dscr 2.4, min 0.9 → ratio 2.67 bij RNHB; min 1.25 → ratio 1.92 bij bank
        const dscrScore = Math.min(100, Math.round(45 + ratio * 20));
        criteria.push({w:25, s:dscrScore});
        if(ratio >= 2.5)     plus.push(`DSCR ${m.dscr.toFixed(2)} — ${ratio.toFixed(1)}× boven norm (min ${l.minDSCR})`);
        else if(ratio >= 1.5) plus.push(`DSCR ${m.dscr.toFixed(2)} ruim boven norm (min ${l.minDSCR})`);
        else                  plus.push(`DSCR ${m.dscr.toFixed(2)} voldoet aan norm (min ${l.minDSCR})`);
      }
    } else {
      criteria.push({w:25, s:40}); // licht negatief: geen cashflow info
      min.push('Geen huurinkomsten — DSCR niet bepaalbaar');
    }

    // C) Leningbedrag-fit voor déze financier (gewicht 20)
    // Kleine lening bij grote financier = slechte fit; lening in kernmarkt = goede fit
    if(m.l > 0) {
      if(m.l < l.minLening) {
        const ratio = m.l / l.minLening; // bijv. 75k bij min 200k → 0.375
        const leningScore = Math.round(ratio * 50); // 0.375 → ~19
        criteria.push({w:20, s:leningScore});
        min.push(`Lening ${fE(m.l)} onder minimum ${fE(l.minLening)} van deze financier`);
      } else {
        // Positie in bereik: dichter bij minimum = kernmarkt = betere fit
        const range = l.maxLening - l.minLening;
        const pos = range > 0 ? (m.l - l.minLening) / range : 0.2;
        // pos 0 = net boven minimum (goede fit), pos 1 = aan maximum (minder ideaal)
        const leningScore = Math.round(95 - pos * 35);
        criteria.push({w:20, s:leningScore});
        if(pos <= 0.15)      plus.push(`${fE(m.l)} is kernbedrag voor deze financier (min ${fE(l.minLening)})`);
        else if(pos <= 0.5)  plus.push(`Leningsbedrag past goed bij profiel`);
        else                 plus.push(`Leningsbedrag aan bovenkant van bereik`);
      }
    } else {
      criteria.push({w:20, s:50});
    }

    // D) Specialisme-match (gewicht 15)
    // Financier die gespecialiseerd is in dit exact profiel scoort hoger
    let specScore = 50;
    const isNicheVastgoed = ['horeca','recreatie'].includes(form.typeVastgoed);
    const isBuitenland = form.woonland !== 'nl';
    if(isNicheVastgoed && l[form.typeVastgoed])      { specScore = 95; plus.push(`Gespecialiseerd in ${form.typeVastgoed}`); }
    else if(isNicheVastgoed && !l[form.typeVastgoed]) { specScore = 20; min.push(`${form.typeVastgoed} buiten kernspecialisme`); }
    else if(isBuitenland && l.buitenland)             { specScore = 85; plus.push('Gespecialiseerd in internationale klanten'); }
    else if(isBuitenland && !l.buitenland)            { specScore = 25; min.push('Niet gespecialiseerd in buitenlandse klanten'); }
    else if(l.type === 'bank' && form.typeKlant === 'particulier' && form.woonland === 'nl') {
      specScore = 70; // standaard bancair profiel
      plus.push('NL-ingezetene — standaard bancair profiel');
    } else if(l.type === 'non-bank' && ['woning','appartementen'].includes(form.typeVastgoed)) {
      specScore = 72;
      plus.push('Woningverhuur binnen kernmarkt');
    } else {
      specScore = 60;
      if(form.woonland === 'nl') plus.push('NL-ingezetene — standaard profiel');
    }
    criteria.push({w:15, s:specScore});

    // E) Kredietprofiel & trackrecord (gewicht 10)
    let kredScore = 55; // neutraal als onbekend
    if(gRisico === 'laag')       { kredScore = 90; plus.push('Sterk kredietprofiel (Graydon laag risico)'); }
    else if(gRisico === 'gemiddeld') {
      kredScore = l.type === 'bank' ? 35 : 60;
      min.push(l.type === 'bank' ? 'Gemiddeld kredietprofiel — bancaire drempel' : 'Kredietprofiel gemiddeld — toelichting wenselijk');
    } else if(gRisico === 'hoog') {
      kredScore = l.type === 'bank' ? 5 : 25;
      min.push(l.type === 'bank' ? 'Hoog kredietrisico — bancaire route vrijwel uitgesloten' : 'Hoog risico — sterke onderbouwing vereist');
    }
    if(l.trackrecordVereist && p === 0) {
      kredScore = Math.max(0, kredScore - 30);
      min.push('Trackrecord vereist — geen panden opgegeven');
    } else if(p >= 5) { kredScore = Math.min(100, kredScore + 15); plus.push(`${p} panden — sterk trackrecord`); }
    else if(p >= 2)   { kredScore = Math.min(100, kredScore + 8); }
    criteria.push({w:10, s:kredScore});

    // ── 3. GEWOGEN EINDSCORE ───────────────────────────────────
    const totaalGewicht = criteria.reduce((s, c) => s + c.w, 0);
    const gewogenScore  = criteria.reduce((s, c) => s + c.w * c.s, 0) / totaalGewicht;
    const score = Math.max(5, Math.min(99, Math.round(gewogenScore)));

    const matchType = score >= 75 ? 'sterk' : score >= 55 ? 'redelijk' : score >= 35 ? 'matig' : 'zwak';
    const kl        = score >= 75 ? 'good'  : score >= 55 ? 'warn'     : 'bad';

    return {
      ...l, score, kl, matchType, blokkeerd: false,
      plus: plus.slice(0, 3),
      min:  min.slice(0, 3),
      blokkers: []
    };
  })
  .sort((a, b) => b.score - a.score)
  .reduce((acc, l) => {
    if(acc.length >= 5) return acc;
    if(!l.blokkeerd) acc.push(l);
    return acc;
  }, []);
}

// ════════════════════════════════════════════════════
// ㉒ CONCLUSIE
// ════════════════════════════════════════════════════
function genConclusie(sc, conf, doss, readiness) {
  const g=getFirstParsed('graydon'), kk=(conf?.hard?.length||0)>0;
  if(g?._risicoNiveau==='hoog') return 'Op basis van Graydon is bancaire financiering niet realistisch. Non-bank financiers bieden mogelijk ruimte mits kredietprofiel wordt toegelicht.';
  if(kk) return `Harde afwijkingen gedetecteerd — eerst verifiëren voordat een aanvraag wordt ingediend.`;
  if(readiness?.overallStatus==='Bank-ready') return 'Economisch en dossiermatig lijkt deze deal bank-ready.';
  if(readiness?.overallStatus==='Non-bank-ready') return 'Haalbaar voor non-bank financiers. Dossier mist nog elementen voor bancaire route.';
  if(sc.route==='bancair'&&sc.score>=7.5) return `Deal lijkt goed financierbaar via bancaire financiers${doss?.score<50?', maar dossier vereist versterking':''}.`;
  if(sc.route==='bancair') return 'Bancaire financiering haalbaar, mits dossier verder wordt versterkt.';
  if(sc.route==='non-bank') return 'Non-bank financiers zijn de meest realistische route.';
  if(sc.route==='moeilijk') return 'Kritische knelpunten belemmeren financiering.';
  return 'In huidige vorm niet financierbaar. Significante aanpassingen noodzakelijk.';
}

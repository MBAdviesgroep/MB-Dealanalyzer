function renderDocCategory(key) {
  const dt = DOC_TYPES[key];
  const cat = S.docs[key];
  const files = cat.files;
  const isLoading = S.loading[key+'_loading'];
  const hasFiles = files.length > 0;
  const isRequired = dt.requiredFor.length > 0;
  const statusCls = hasFiles ? 'ok' : isRequired ? 'miss' : 'opt';
  const statusLbl = hasFiles ? (dt.multiple?`${files.length} bestand${files.length>1?'en':''}`:'✓ Aanwezig') : (isRequired?'Vereist':'Optioneel');

  return `
  <div class="doc-category" id="DOC_CAT_${key}">
    <div class="doc-cat-header" onclick="this.parentElement.querySelector('.doc-cat-body').style.display=this.parentElement.querySelector('.doc-cat-body').style.display==='none'?'block':'none'">
      <span class="doc-cat-icon">${dt.icon}</span>
      <span class="doc-cat-lbl">${dt.label}</span>
      <span class="doc-cat-count">${files.length}</span>
      <span class="doc-cat-status ${statusCls}">${statusLbl}</span>
    </div>
    <div class="doc-cat-body">
      ${files.length>0?`<div class="doc-file-list">
        ${files.map(fEntry=>`
          <div class="doc-file-item">
            <span style="font-size:10px;flex-shrink:0">${dt.icon}</span>
            <span class="doc-file-name" title="${fEntry.naam}">${fEntry.naam}</span>
            <span class="doc-file-date">${fEntry.uploadDatum}</span>
            ${fEntry.parsed?._meta?.documentKwaliteit?`<span style="font-size:7.5px;font-weight:700;padding:1.5px 4px;border-radius:8px;${fEntry.parsed._meta.documentKwaliteit==='goed'?'background:var(--gn-bg);color:var(--gn)':fEntry.parsed._meta.documentKwaliteit==='matig'?'background:var(--wn-bg);color:var(--wn)':'background:var(--rk-bg);color:var(--rk)'}">${fEntry.parsed._meta.documentKwaliteit==='goed'?'OK':fEntry.parsed._meta.documentKwaliteit==='matig'?'Deels':'Slecht'}</span>`:''}
            ${fEntry.ai?`<span style="font-size:7.5px;font-weight:700;padding:1.5px 4px;border-radius:8px;background:var(--pur-bg);color:var(--pur);border:1px solid var(--pur-bd)">AI ✓</span>`:''}
            <button class="doc-file-del" onclick="deleteFile('${key}','${fEntry.id}')" title="Verwijderen">✕</button>
          </div>`).join('')}
      </div>`:''}
      <div class="doc-upload-btn${isLoading?' loading':''}">
        <input type="file" accept="${dt.accepts}" onchange="handleUpload('${key}', this.files[0])">
        ${isLoading?`<span class="spn"></span> Analyseren…`:`+ ${dt.multiple&&hasFiles?'Nog een':'Uploaden'}`}
      </div>
    </div>
  </div>`;
}

// ════════════════════════════════════════════════════
// ㉙ SECTIE 4 — DOCUMENTANALYSE (alle types)
// ════════════════════════════════════════════════════
function renderDocAnalyseBlok() {
  const totalFiles = totalFilesCount();
  const filledCats = filledCategoriesCount();
  if (totalFiles === 0) return '';

  // Helpers
  function getAi(type) {
    return S.docs[type]?.files.find(fe => fe.ai)?.ai || null;
  }
  function fmtBedrag(v) {
    const n = parseFloat(String(v || '').replace(/[^0-9.]/g, ''));
    return (!v || isNaN(n)) ? null : '€' + Math.round(n).toLocaleString('nl-NL');
  }
  function safe(v) { return v && String(v).trim() ? String(v).trim() : null; }

  const aiKvk   = getAi('kvk');
  const aiGray  = getAi('graydon');
  const aiWoz   = getAi('woz');
  const aiKad   = getAi('kadaster');
  const aiJaarr = getAi('jaarrekeningen');

  // Regex-parsed fallbacks
  const kvk    = getFirstParsed('kvk');
  const gray   = getFirstParsed('graydon');
  const woz    = getFirstParsed('woz');
  const kad    = getFirstParsed('kadaster');
  const jaarr  = getFirstParsed('jaarrekeningen');

  // ── Samenvatting ─────────────────────────────────────────────
  const samenvattingItems = [];
  if(safe(aiKvk?.summary))   samenvattingItems.push(aiKvk.summary);
  else if(kvk?._rechtsvormRaw) samenvattingItems.push(`Rechtsvorm <em>${kvk._rechtsvormRaw}</em> herkend via KVK`);

  if(safe(aiGray?.summary))  samenvattingItems.push(aiGray.summary);
  else if(gray?._risicoNiveau) samenvattingItems.push(`Kredietprofiel: <em>${gray._risicoNiveau} risico</em> (Graydon)`);

  if(safe(aiWoz?.summary))   samenvattingItems.push(aiWoz.summary);
  else if(woz?._definitieveWaarde) samenvattingItems.push(`${woz._isTaxatie?'Taxatiewaarde':'WOZ-waarde'}: <em>${fE(woz._definitieveWaarde)}</em>`);

  if(safe(aiKad?.summary))   samenvattingItems.push(aiKad.summary);
  else if(kad?._eigenaarRaw) samenvattingItems.push(`Eigendom op naam van <em>${kad._eigenaarRaw}</em>`);

  if(safe(aiJaarr?.summary)) samenvattingItems.push(aiJaarr.summary);
  else if(jaarr?._jaar) samenvattingItems.push(`Jaarrekening <em>${jaarr._jaar}</em> aanwezig`);

  // ── Inzichten ────────────────────────────────────────────────
  const inzichtItems = [];

  // KVK
  if(aiKvk?.fields) {
    const fi = aiKvk.fields;
    if(safe(fi.bedrijfsnaam))     inzichtItems.push(`Bedrijfsnaam: <em>${fi.bedrijfsnaam}</em>`);
    if(safe(fi.rechtsvorm))       inzichtItems.push(`Rechtsvorm: <em>${fi.rechtsvorm}</em>`);
    if(safe(fi.kvkNummer))        inzichtItems.push(`KVK-nummer: <em>${fi.kvkNummer}</em>`);
    if(safe(fi.sbiCode))          inzichtItems.push(`SBI-code: <em>${fi.sbiCode}</em>`);
    if(safe(fi.oprichtingsdatum)) inzichtItems.push(`Opgericht: <em>${fi.oprichtingsdatum}</em>`);
    if(safe(fi.vestigingsadres))  inzichtItems.push(`Vestiging: <em>${fi.vestigingsadres}</em>`);
  } else if(kvk?._isBV && S.form.typeKlant==='bv') {
    inzichtItems.push('KVK bevestigt BV-structuur — consistent met profiel');
  }

  // Kredietrapport
  if(aiGray?.fields) {
    const fi = aiGray.fields;
    if(safe(fi.score))                inzichtItems.push(`Score: <em>${fi.score}</em>`);
    if(safe(fi.internationaleScore))  inzichtItems.push(`Internationale score: <em>${fi.internationaleScore}</em>`);
    if(safe(fi.risicoklasse))         inzichtItems.push(`Risicoklasse: <em>${fi.risicoklasse}</em>`);
    const gKlimiet = safe(fi.kredietlimiet) || safe(fi.aanbevolenKredietlimiet);
    if(gKlimiet)                      inzichtItems.push(`Kredietlimiet: <em>${gKlimiet}</em>`);
    if(safe(fi.probabilityOfDefault)) inzichtItems.push(`Probability of Default: <em>${fi.probabilityOfDefault}</em>`);
    if(safe(fi.betaalgedrag))         inzichtItems.push(`Betaalgedrag: <em>${fi.betaalgedrag}</em>`);
    if(safe(fi.bijzonderheden))       inzichtItems.push(`Bijzonderheden: <em>${fi.bijzonderheden}</em>`);
    if(safe(fi.incassoCount) && fi.incassoCount !== '0') inzichtItems.push(`Incasso's: <em>${fi.incassoCount}</em>`);
  } else if(gray?._risicoNiveau) {
    inzichtItems.push(`Graydon risiconiveau: <em>${gray._risicoNiveau}</em>`);
  }

  // WOZ / Taxatie
  if(aiWoz?.fields) {
    const fi = aiWoz.fields;
    const wozAdres = safe(fi.adresObject) || safe(fi.adres);
    if(wozAdres)                  inzichtItems.push(`Object: <em>${wozAdres}</em>`);
    const isTaxWoz = fi.documentType === 'taxatie';
    const wv = fmtBedrag(isTaxWoz ? fi.taxatiewaarde : fi.wozWaarde) || fmtBedrag(fi.waarde);
    if(wv)                        inzichtItems.push(`${isTaxWoz?'Taxatiewaarde':'WOZ-waarde'}: <em>${wv}</em>`);
    const wozDatum = safe(fi.peildatum) || safe(fi.waardeDatum);
    if(wozDatum)                  inzichtItems.push(`Peildatum: <em>${wozDatum}</em>`);
    if(safe(fi.bouwjaar))         inzichtItems.push(`Bouwjaar: <em>${fi.bouwjaar}</em>`);
    if(safe(fi.oppervlakte))      inzichtItems.push(`Oppervlakte: <em>${fi.oppervlakte}</em>`);
    if(safe(fi.taxateur))         inzichtItems.push(`Taxateur: <em>${fi.taxateur}</em>`);
  } else if(woz?._definitieveWaarde) {
    inzichtItems.push(`${woz._isTaxatie?'Taxatierapport':'WOZ'}: <em>${fE(woz._definitieveWaarde)}</em> — ${woz._isTaxatie?'hogere bewijskracht':'WOZ-beschikking'}`);
  }

  // Kadaster
  if(aiKad?.fields) {
    const fi = aiKad.fields;
    if(safe(fi.eigenaar))        inzichtItems.push(`Eigenaar: <em>${fi.eigenaar}</em>`);
    if(safe(fi.koopsom))         inzichtItems.push(`Koopsom: <em>${fmtBedrag(fi.koopsom) || fi.koopsom}</em>`);
    if(safe(fi.leveringsdatum))  inzichtItems.push(`Datum levering: <em>${fi.leveringsdatum}</em>`);
    if(fi.hypotheekInschrijving === 'ja') {
      const hb = fi.hypotheekBedrag ? ` (${fmtBedrag(fi.hypotheekBedrag) || fi.hypotheekBedrag})` : '';
      inzichtItems.push(`Hypotheek ingeschreven${hb} — rangorde aandachtspunt`);
    }
    if(safe(fi.bijzonderheden))  inzichtItems.push(`Bijzonderheden: <em>${fi.bijzonderheden}</em>`);
  } else if(kad?._heeftHypotheek) {
    inzichtItems.push('Bestaande hypotheekinschrijving — rangorde aandachtspunt');
  }

  // Jaarrekeningen — beide veldnaamconventies (lowercase + camelCase)
  if(aiJaarr?.fields) {
    const fi = aiJaarr.fields;
    if(safe(fi.bedrijfsnaam))    inzichtItems.push(`Onderneming: <em>${fi.bedrijfsnaam}</em>`);
    if(safe(fi.boekjaar))        inzichtItems.push(`Boekjaar: <em>${fi.boekjaar}</em>`);
    if(safe(fi.omzet))           inzichtItems.push(`Omzet: <em>${fmtBedrag(fi.omzet) || fi.omzet}</em>`);
    const jNettowinst = fi.nettoResultaat || fi.nettowinst;
    if(safe(jNettowinst))        inzichtItems.push(`Nettoresultaat: <em>${fmtBedrag(jNettowinst) || jNettowinst}</em>`);
    if(safe(fi.ebitda))          inzichtItems.push(`EBITDA: <em>${fmtBedrag(fi.ebitda) || fi.ebitda}</em>`);
    const jEv = fi.eigenVermogen || fi.eigenvermogen;
    if(safe(jEv))                inzichtItems.push(`Eigen vermogen: <em>${fmtBedrag(jEv) || jEv}</em>`);
    const jBt = fi.balanstotaal || fi.balansTotaal;
    if(safe(jBt))                inzichtItems.push(`Balanstotaal: <em>${fmtBedrag(jBt) || jBt}</em>`);
    if(safe(fi.solvabiliteit))   inzichtItems.push(`Solvabiliteit: <em>${fi.solvabiliteit}%</em>`);
  } else if(jaarr?._jaar) {
    inzichtItems.push(`Jaarrekening ${jaarr._jaar} aanwezig`);
    if(S.form.typeKlant==='bv' && S.docs.jaarrekeningen.files.length < 2) {
      inzichtItems.push('Minder dan 2 jaarrekeningen — onvoldoende voor bancaire inkomenstoets');
    }
  }

  if(inzichtItems.length === 0) inzichtItems.push('Upload documenten voor automatische inzichten.');

  // ── Risico's ─────────────────────────────────────────────────
  const risicoItems = [];
  const aiSources = [aiKvk, aiGray, aiWoz, aiKad, aiJaarr];
  const seenRisks = new Set();
  aiSources.forEach(ai => {
    if(Array.isArray(ai?.risks)) {
      ai.risks.forEach(r => {
        const clean = String(r).trim();
        if(clean && !seenRisks.has(clean)) { seenRisks.add(clean); risicoItems.push(clean); }
      });
    }
  });
  // Regex fallbacks
  if(!aiGray && gray?._risicoNiveau==='hoog') risicoItems.push('Graydon verhoogd risico — bancaire route waarschijnlijk niet haalbaar');
  if(!aiKvk && kvk && S.form.typeKlant==='bv' && !kvk._isBV) risicoItems.push('Structuurconflict: BV ingevuld maar KVK toont andere rechtsvorm');
  if(!aiWoz && woz?._definitieveWaarde && parseFloat(S.form.marktwaarde)>0 &&
      Math.abs(parseFloat(S.form.marktwaarde)-woz._definitieveWaarde)/woz._definitieveWaarde*100>15)
    risicoItems.push(`Waarde-afwijking >15% — marktwaarde en ${woz._bronLabel} inconsistent`);
  if(S.form.typeKlant==='bv' && S.docs.jaarrekeningen.files.length===0)
    risicoItems.push('Jaarrekeningen ontbreken — inkomenstoets BV niet mogelijk');
  if(risicoItems.length === 0) risicoItems.push("Geen documentaire risico's gedetecteerd op basis van beschikbare bestanden.");

  // ── Aandachtspunten ──────────────────────────────────────────
  const aandachtItems = [];
  const wozAanwezig=woz?._definitieveWaarde||safe(aiWoz?.fields?.wozWaarde)||safe(aiWoz?.fields?.taxatiewaarde)||safe(aiWoz?.fields?.waarde);
  if(!wozAanwezig)
    aandachtItems.push('Taxatierapport ontbreekt — vereist voor bancaire route');
  else
    aandachtItems.push('Controleer actualiteit taxatierapport (max 6 maanden oud voor bancaire indiening)');
  const kadHyp=aiKad?.fields?.hypotheekInschrijving==='ja'||aiKad?.fields?.hypotheekInschrijving==='Aanwezig'||kad?._heeftHypotheek;
  if(kadHyp) aandachtItems.push('Verifieer omvang en rang bestaande hypotheek via notaris');
  const incCount = aiGray?.fields?.incassoCount ? parseInt(aiGray.fields.incassoCount) : (gray?._incassoCount || 0);
  if(incCount > 0) aandachtItems.push(`${incCount} incasso('s) gedetecteerd — schriftelijke toelichting vereist`);
  if(aandachtItems.length === 0) aandachtItems.push('Geen directe aandachtspunten op basis van huidige documenten.');

  // ── Vervolgstappen ───────────────────────────────────────────
  const vervolgItems = [];
  const seenActions = new Set();
  aiSources.forEach(ai => {
    if(Array.isArray(ai?.actions)) {
      ai.actions.forEach(a => {
        const clean = String(a).trim();
        if(clean && !seenActions.has(clean)) { seenActions.add(clean); vervolgItems.push(clean); }
      });
    }
  });
  if(!S.docs.woz.files.length)          vervolgItems.push('Taxatierapport opvragen (max 6 maanden oud)');
  if(!S.docs.kadaster.files.length)     vervolgItems.push('Kadastraal uittreksel opvragen bij notaris of Kadaster');
  if(S.form.typeKlant==='bv' && S.docs.jaarrekeningen.files.length<2) vervolgItems.push('Minimaal 2 jaar jaarrekeningen opvragen bij klant');
  if(!S.docs.graydon.files.length)      vervolgItems.push('Kredietrapport opvragen (Graydon/CreditSafe)');
  if(vervolgItems.length === 0)         vervolgItems.push('Dossier voldoende compleet — voorbereiding indiening kan starten.');

  return `
  <div class="section-head" style="margin-top:16px">
    <span class="section-num" style="background:var(--pur)">4</span>
    <span class="section-head-lbl">Documentanalyse</span>
    <div class="section-head-line"></div>
    <span class="bdg" style="background:var(--pur-bg);color:var(--pur);border:1px solid var(--pur-bd)">
      ${filledCats} categorie${filledCats!==1?'ën':''} · ${totalFiles} bestand${totalFiles!==1?'en':''}
    </span>
  </div>

  <div class="doc-analyse-blok">
    <div class="doc-analyse-header">
      <div class="doc-analyse-badge">AI Documentanalyse</div>
      <div class="doc-analyse-title">Samenvatting geüploade documenten</div>
    </div>
    <div class="doc-analyse-grid">
      <div class="doc-analyse-section">
        <div class="doc-analyse-section-lbl lbl-bl">Samenvatting</div>
        ${samenvattingItems.length>0
          ? samenvattingItems.map(i=>`<div class="doc-analyse-placeholder">· ${i}</div>`).join('')
          : `<div class="doc-analyse-placeholder">Nog onvoldoende documenten voor automatische samenvatting.</div>`}
      </div>
      <div class="doc-analyse-section">
        <div class="doc-analyse-section-lbl lbl-gn">Inzichten</div>
        ${inzichtItems.map(i=>`<div class="doc-analyse-placeholder">→ ${i}</div>`).join('')}
      </div>
      <div class="doc-analyse-section">
        <div class="doc-analyse-section-lbl lbl-rk">Risico's</div>
        ${risicoItems.map(i=>`<div class="doc-analyse-placeholder">⚠ ${i}</div>`).join('')}
      </div>
      <div class="doc-analyse-section">
        <div class="doc-analyse-section-lbl lbl-wn">Aandachtspunten</div>
        ${aandachtItems.map(i=>`<div class="doc-analyse-placeholder">· ${i}</div>`).join('')}
      </div>
    </div>
    <div class="doc-analyse-full">
      <div class="doc-analyse-section-lbl lbl-or">Vervolgstappen</div>
      ${vervolgItems.map((i,idx)=>`<div class="doc-analyse-placeholder"><strong>${idx+1}.</strong> ${i}</div>`).join('')}
    </div>
  </div>`;
}

    <div class="fgrp">

      <textarea id="fi_notitie" style="width:100%;padding:7px 9px;background:var(--bg);border:1.5px solid var(--bd);border-radius:7px;font-family:var(--mono);font-size:11px;resize:none;min-height:60px;outline:none;color:var(--tx)" oninput="S.form.notitie=this.value" placeholder="Context, bijzonderheden…">${f('notitie')}</textarea>
    </div>

    <div class="sec-lbl"><span>Documenten</span></div>
    ${Object.keys(DOC_TYPES).map(key => renderDocCategory(key)).join('')}

    ${hasAF?`<div style="margin-top:7px;padding:8px 10px;background:var(--bl-bg);border:1px solid var(--bl-bd);border-radius:7px">
      <div style="font-family:var(--head);font-size:8px;font-weight:700;text-transform:uppercase;color:var(--bl);margin-bottom:5px;display:flex;justify-content:space-between;align-items:center">Uitgelezen<button class="btn btn-or btn-sm" onclick="doAutoFill()">Overnemen</button></div>
      ${Object.entries(S.autoFill).map(([k,v])=>`<div style="display:flex;justify-content:space-between;padding:2.5px 0;border-bottom:1px solid var(--bd-l);font-size:9.5px"><span style="color:var(--tx3)">${v.veldLabel}</span><span style="font-weight:600;font-family:var(--mono)">${fE(parseFloat(v.waarde))}</span></div>`).join('')}
    </div>`:''}
  `;
}

// ════════════════════════════════════════════════════
// ㉛ CENTER PANEL
// ════════════════════════════════════════════════════
function renderMain(m, sc, risks, conf, doss, readiness, acties, lenders, concl) {
  const afl=f('metAflossing')==='ja'?'ann.':'IO';
  const ltvC=c=>c===null?'neutral':c<70?'good':c>80?'bad':'warn';
  const dscrC=c=>c===null?'neutral':c>=1.25?'good':c>=1?'warn':'bad';
  const hasHard=(conf?.hard?.length||0)>0;
  const isGo=sc.score>=6&&!hasHard&&readiness.bancair.statusKlasse==='good';
  const isNogo=sc.score<3||(hasHard&&sc.score<5);
  const gngLabel=isGo?'GO':isNogo?'NO-GO':'CONDITIONEEL';
  const gngCls=isGo?'go':isNogo?'no':'cond';
  const hasDeal=fv('aankoopprijs')>0&&fv('gewensteLening')>0;
  const datum=new Date().toLocaleDateString('nl-NL',{day:'2-digit',month:'long',year:'numeric'});

  if(!hasDeal) return `<div class="empty-state"><div class="es-icon">📋</div><div style="font-family:var(--head);font-size:13px;font-weight:600;margin-bottom:5px;color:var(--tx3)">Vul dealgegevens in</div><div style="color:var(--tx4)">Voer aankoopprijs en gewenste lening in om de analyse te starten.</div></div>`;

  const topLenders = lenders.filter(l=>l.score>=30).slice(0,4);

  return `
  <div id="PRINT_HEADER" class="print-header" style="display:none"></div>

  <div class="deal-snapshot">
    <div class="snap-header">
      <span class="snap-title">Deal Snapshot — ${datum}</span>
      <div style="display:flex;align-items:center;gap:8px">
        ${f('naamKlant')?`<span style="font-family:var(--head);font-size:10.5px;color:rgba(255,255,255,.55)">${f('naamKlant')}</span>`:''}
        <span class="snap-gng ${gngCls}">${gngLabel}</span>
      </div>
    </div>
    <div class="snap-kpis">
      <div class="snap-kpi">
        <div class="snap-kpi-lbl">Score</div>
        <div class="snap-kpi-val ${sc.klasse==='good'?'good':sc.klasse==='bad'?'bad':sc.klasse==='blauw'?'good':'warn'}">${sc.score}<span style="font-size:11px;opacity:.45;font-weight:500">/10</span></div>
        <div class="snap-kpi-sub">${sc.label}</div>
      </div>
      <div class="snap-kpi">
        <div class="snap-kpi-lbl">LTV</div>
        <div class="snap-kpi-val ${ltvC(m.ltv)}">${m.ltv?fP(m.ltv):'—'}</div>
        <div class="snap-kpi-sub">${m.ltv===null?'—':m.ltv<70?'✓ Ruim':m.ltv<=80?'OK':m.ltv<=85?'> Bancaire norm':'Kritisch'}</div>
      </div>
      <div class="snap-kpi">
        <div class="snap-kpi-lbl">DSCR</div>
        <div class="snap-kpi-val ${dscrC(m.dscr)}">${m.dscr?m.dscr.toFixed(2):'N/B'}</div>
        <div class="snap-kpi-sub">${m.dscr===null?'Geen huur':m.dscr>=1.5?'Sterk':m.dscr>=1.25?'✓ Voldoende':m.dscr>=1.0?'Onder norm':'Kritisch'}</div>
      </div>
      <div class="snap-kpi">
        <div class="snap-kpi-lbl">Cashflow/mnd</div>
        <div class="snap-kpi-val ${!m.h||!m.ml?'neutral':m.cf>0?'good':'bad'}">${m.h&&m.ml?fE(m.cf):'—'}</div>
        <div class="snap-kpi-sub">${m.h&&m.ml?(m.cf>0?'Positief':'Negatief'):'Na lasten'}</div>
      </div>
      <div class="snap-kpi">
        <div class="snap-kpi-lbl">Dossier</div>
        <div class="snap-kpi-val ${doss.klasse==='good'?'good':doss.klasse==='bad'?'bad':'warn'}">${doss.score}<span style="font-size:11px;opacity:.45;font-weight:500">/100</span></div>
        <div class="snap-kpi-sub">${doss.label}</div>
      </div>
    </div>
    <!-- Conclusie + sub-scores -->
    <div class="snap-concl" style="display:flex;gap:12px;align-items:flex-start">
      <div class="snap-concl-txt" style="flex:1">${concl}</div>
      <div style="display:flex;gap:8px;flex-shrink:0;padding-left:12px;border-left:1px solid rgba(255,255,255,.1)">
        ${[['A','Haalb.',sc.subScores.A],['B','Profiel',sc.subScores.B],['C','Dossier',sc.subScores.C]].map(([k,l,v])=>`
          <div style="text-align:center">
            <div style="font-size:7px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:rgba(255,255,255,.35);font-family:var(--head);margin-bottom:2px">${l}</div>
            <div style="font-size:13px;font-weight:700;font-family:var(--head);color:${v>=0.5?'#7ee8a2':v<=-0.5?'#fca5a5':'rgba(255,255,255,.6)'}">${v>0?'+':''}${v.toFixed(1)}</div>
          </div>`).join('')}
      </div>
    </div>
  </div>

  <div class="section-head">
    <span class="section-num">2</span><span class="section-head-lbl">Financiële Analyse</span><div class="section-head-line"></div>
  </div>

  <div class="acard">
    <div class="acard-hd"><span class="acard-lbl">LTV</span><span class="bdg ${m.ltv===null?'bdg-b':m.ltv<70?'bdg-g':m.ltv>80?'bdg-r':'bdg-w'}">${m.ltv?fP(m.ltv):'—'}</span></div>
    <div class="mrow c2" style="margin-bottom:9px">
      <div class="metric"><div class="m-lbl">Op aankoopprijs</div><div class="m-val ${m.ltvA<70?'cg':m.ltvA>80?'cr':'cw'}">${m.ltvA?fP(m.ltvA):'—'}</div></div>
      <div class="metric"><div class="m-lbl">Op marktwaarde</div><div class="m-val ${ltvC(m.ltvM)==='good'?'cg':ltvC(m.ltvM)==='bad'?'cr':'cw'}">${m.ltvM?fP(m.ltvM):'—'}</div><div class="m-sub">${getFirstParsed('woz')?._definitieveWaarde?'✓ '+getFirstParsed('woz')._bronLabel:'Geen taxatie'}</div></div>
    </div>
    <div class="ltv-track"><div class="ltv-fill" style="width:${Math.min(m.ltv||0,100)}%;background:${(m.ltv||0)<70?'var(--gn)':(m.ltv||0)>80?'var(--rk)':'var(--wn)'}"></div></div>
    <div class="ltv-marks"><span>0%</span><span>70%</span><span>80%</span><span>100%</span></div>
  </div>

  <div class="acard">
    <div class="acard-hd"><span class="acard-lbl">Cashflow & Draagkracht</span></div>
    <div class="mrow c3">
      <div class="metric"><div class="m-lbl">DSCR (${afl})</div><div class="m-val ${dscrC(m.dscr)==='good'?'cg':dscrC(m.dscr)==='bad'?'cr':'cw'}">${m.dscr?m.dscr.toFixed(2):'N/B'}</div><div class="m-sub">${m.dscr?m.dscr>=1.25?'✓ Voldoende':m.dscr>=1?'Onder norm':'Kritisch':'Geen huur'}</div></div>
      <div class="metric"><div class="m-lbl">Huur/mnd</div><div class="m-val">${m.h?fE(m.h):'—'}</div><div class="m-sub">${f('huurType')==='bestaand'?'Contract':'Prognose'}</div></div>
      <div class="metric"><div class="m-lbl">Cashflow</div><div class="m-val ${!m.h||!m.ml?'cgy':m.cf>0?'cg':'cr'}">${m.h&&m.ml?fE(m.cf):'—'}</div><div class="m-sub">Na lasten</div></div>
    </div>
    ${m.bh125?`<div style="margin-top:8px;padding:7px 9px;background:var(--bg);border-radius:6px;font-size:10.5px;color:var(--tx3)">Min. huur DSCR 1.25: <strong style="color:var(--tx);font-family:var(--mono)">${fE(m.bh125)}/mnd</strong>${m.h&&m.h<m.bh125?` — tekort ${fE(m.bh125-m.h)}/mnd`:' ✓'}</div>`:''}
  </div>

  <div class="acard">
    <div class="acard-hd"><span class="acard-lbl">Structuur</span></div>
    <div class="mrow c4">
      <div class="metric"><div class="m-lbl">Lening</div><div class="m-val">${fE(m.l)}</div></div>
      <div class="metric"><div class="m-lbl">Inbreng</div><div class="m-val">${fE(m.inb)}</div><div class="m-sub">${m.ibP?fP(m.ibP):''}</div></div>
      <div class="metric"><div class="m-lbl">Maandlast</div><div class="m-val cb">${fE(m.ml)}</div><div class="m-sub">${afl}</div></div>
      <div class="metric"><div class="m-lbl">Rente</div><div class="m-val">${(parseFloat(f('rente')||.05)*100).toFixed(1)}%</div></div>
    </div>
  </div>

  <div class="section-head" style="margin-top:16px">
    <span class="section-num" style="${risks.krit.length>0?'background:var(--rk)':''}">3</span>
    <span class="section-head-lbl">Risico's & Aandachtspunten</span>
    <div class="section-head-line"></div>
    ${risks.krit.length>0?`<span class="bdg bdg-r">${risks.krit.length} kritisch</span>`:''}
  </div>

  <div class="acard">
    ${risks.krit.length===0&&risks.aand.length===0
      ?`<div style="text-align:center;padding:14px;color:var(--gn);font-size:12px">✓ Geen kritieke risico's gedetecteerd</div>`
      :`<div class="risk-list">
        ${risks.krit.map(r=>`<div class="risk-item krit"><div class="risk-dot" style="background:var(--rk)"></div><div><div class="risk-t">${r.t}</div><div class="risk-sub">${r.i} · ${r.oplosbaar?'Oplosbaar':'Niet oplosbaar'}</div>${r.a?`<div class="risk-act">${r.a}</div>`:''}</div></div>`).join('')}
        ${risks.aand.map(r=>`<div class="risk-item aand"><div class="risk-dot" style="background:var(--wn)"></div><div><div class="risk-t">${r.t}</div><div class="risk-sub">${r.i}</div>${r.a?`<div class="risk-act">${r.a}</div>`:''}</div></div>`).join('')}
      </div>`}
  </div>

  <div class="acard">
    <div class="acard-hd"><span class="acard-lbl">Volgende Stappen</span><span style="font-size:9.5px;color:var(--tx4)">${acties.length} acties</span></div>
    ${acties.length===0
      ?`<div style="text-align:center;padding:12px;color:var(--gn);font-size:11.5px">✓ Geen directe acties vereist</div>`
      :acties.map(a=>`<div class="action-item ${a.p}"><span style="font-size:11px">${a.p==='kritisch'?'🔴':a.p==='hoog'?'🟠':a.p==='laag'?'🟢':'🔵'}</span><span>${a.t}</span></div>`).join('')}
  </div>

  <div class="acard what-if-section">
    <div class="acard-hd"><span class="acard-lbl">What-if</span><span style="font-size:9px;color:var(--tx4)">Live herberekening</span></div>
    ${[
      ['rente','Rente','0.03','0.09','0.005',v=>(parseFloat(v)*100).toFixed(1)+'%'],
      ['gewensteLening','Lening','50000','2000000','10000',v=>'€'+Math.round(v).toLocaleString()],
      ['eigenInbreng','Inbreng','0','1000000','5000',v=>'€'+Math.round(v).toLocaleString()],
      ['huurPerMaand','Huur/mnd','0','10000','50',v=>'€'+Math.round(v).toLocaleString()]
    ].map(([k,l,mn,mx,st,fmt])=>`
      <div class="sl-row" style="margin-bottom:7px">
        <span class="sl-lbl">${l}</span>
        <input type="range" min="${mn}" max="${mx}" step="${st}" value="${f(k)||'0'}" oninput="S.form['${k}']=this.value;scheduleAnalysisUpdate()">
        <span class="sl-val">${fmt(f(k)||'0')}</span>
      </div>`).join('')}
    <div class="whatif-result">
      <div class="metric"><div class="m-lbl">Score</div><div class="m-val ${sc.klasse==='good'?'cg':sc.klasse==='bad'?'cr':'cw'}">${sc.score}/10</div></div>
      <div class="metric"><div class="m-lbl">DSCR</div><div class="m-val ${dscrC(m.dscr)==='good'?'cg':dscrC(m.dscr)==='bad'?'cr':'cw'}">${m.dscr?m.dscr.toFixed(2):'—'}</div></div>
      <div class="metric"><div class="m-lbl">LTV</div><div class="m-val ${ltvC(m.ltv)==='good'?'cg':ltvC(m.ltv)==='bad'?'cr':'cw'}">${m.ltv?fP(m.ltv):'—'}</div></div>
    </div>
  </div>

  ${renderDocAnalyseBlok()}

  <div class="section-head" style="margin-top:16px">
    <span class="section-num">5</span><span class="section-head-lbl">Financieringsmogelijkheden</span><div class="section-head-line"></div>
  </div>

  ${topLenders.length===0
    ?`<div class="acard"><div style="font-size:11.5px;color:var(--tx4);font-style:italic">Geen geldverstrekkers voldoen aan huidige parameters.</div></div>`
    :topLenders.map(l=>{
      const clr=l.score>=72?'var(--gn)':l.score>=48?'var(--wn)':'var(--rk)';
      return `<div class="lender-card">
        <div class="lender-card-header">
          <span class="lender-badge-type ${l.type}">${l.type==='bank'?'Bank':'Non-bank'}</span>
          <span class="lender-name">${l.naam}</span>
          <div class="lender-score-wrap">
            <div class="lender-score" style="color:${clr}">${l.score}<span style="font-size:10px;color:var(--tx4)">%</span></div>
            <div class="lender-score-lbl" style="color:${clr}">match</div>
            <div class="lender-bar-outer"><div class="lender-bar-fill" style="width:${l.score}%;background:${clr}"></div></div>
          </div>
        </div>
        <div class="lender-descr">${l.beschrijving}</div>
        <div class="lender-card-body">
          <div><div class="lender-col-lbl">Pluspunten</div>${l.plus.map(p=>`<div class="lender-point plus">${p}</div>`).join('')}</div>
          <div><div class="lender-col-lbl">Aandachtspunten</div>${l.min.map(p=>`<div class="lender-point min">${p}</div>`).join('')}${l.beperking.map(p=>`<div class="lender-point min">${p}</div>`).join('')}</div>
        </div>
        <div style="padding:6px 13px 10px;display:flex;gap:6px;align-items:center">
          <span class="lender-match-type ${l.matchType}">${l.matchType==='sterk'?'Sterke match':l.matchType==='redelijk'?'Redelijke match':'Zwakke match'}</span>
          <span style="font-size:9px;color:var(--tx4);font-family:var(--mono)">LTV max ${l.maxLTV}% · DSCR min ${l.minDSCR} · ${fE(l.minLening)}–${fE(l.maxLening)}</span>
        </div>
      </div>`;
    }).join('')}

  <div class="section-head" style="margin-top:16px">
    <span class="section-num">6</span><span class="section-head-lbl">Intern Oordeel</span><div class="section-head-line"></div>
  </div>
  <div class="verdict-card ${sc.klasse}">
    <div class="verdict-top">
      <span style="font-size:17px">${SC_ICON[sc.klasse]}</span>
      <span class="verdict-gng">${gngLabel}</span>
      <span class="verdict-lbl" style="flex:1">${SC_LABEL[sc.klasse]}</span>
      ${sc.isCapped?`<span class="bdg bdg-r">Begrensd: ${sc.capReden}</span>`:''}
    </div>
    <div class="verdict-txt">${concl}</div>
    ${f('notitie')?`<div style="margin-top:9px;padding-top:9px;border-top:1px solid rgba(0,0,0,.06);font-size:11px;color:var(--tx3);font-style:italic">${f('notitie')}</div>`:''}
  </div>

  ${(conf?.hard?.length||0)+(conf?.zacht?.length||0)>0?`
  <div class="acard">
    <div class="acard-hd"><span class="acard-lbl">Conflicten</span></div>
    ${[...(conf.hard||[]).map(c=>({...c,cat:'hard'})),...(conf.zacht||[]).map(c=>({...c,cat:'zacht'}))].map(item=>`
      <div class="cf-item cf-${item.cat}">
        <div class="cf-dot" style="background:${item.cat==='hard'?'var(--rk)':'var(--wn)'}"></div>
        <div><div class="cf-lbl">${item.veld||item.code}</div>
        ${item.ingevoerd?`<div class="cf-sub">Klant: ${item.ingevoerd} · Doc: ${item.document||'—'}</div>`:''}
        ${item.actie?`<div class="cf-act">${item.actie}</div>`:''}</div>
      </div>`).join('')}
  </div>`:''}

  <div class="section-head" style="margin-top:16px">
    <span class="section-num">7</span><span class="section-head-lbl">Dealoverzicht & Kredietmemo</span><div class="section-head-line"></div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px">
    <div class="acard" style="margin-bottom:0">
      <div class="acard-hd"><span class="acard-lbl">Dealoverzicht</span></div>
      <table class="sum-t">
        ${[['Klant',f('naamKlant')||'—'],['Aankoopprijs',fE(m.a)],['Marktwaarde',fE(m.mv)||'—'],['Lening',fE(m.l)],['LTV',fP(m.ltv)],['DSCR',m.dscr?m.dscr.toFixed(2)+' ('+afl+')':'N/B'],['Dossier',doss.score+'/100'],['Bancair',readiness.bancair.status]].map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('')}
      </table>
    </div>
    <div class="acard" style="margin-bottom:0">
      <div class="acard-hd"><span class="acard-lbl">Checklist</span></div>
      ${['Geldig identiteitsbewijs',f('typeKlant')==='bv'?'Jaarrekeningen (2 jr) + KvK':'Jaaropgave 2 jaar','Taxatierapport (max 6 mnd)','Eigendomsakte / koopcontract',...(m.h>0?[f('huurType')==='bestaand'?'Huurcontracten':'Huurprognoserapport']:[]),...(f('woonland')!=='nl'?['Verblijfsstatus bewijs']:[])].map(d=>`<div class="d-it"><span style="color:var(--tx4)">☐</span>${d}</div>`).join('')}
    </div>
  </div>

  <div class="acard">
    <div class="acard-hd"><span class="acard-lbl">Kredietmemo</span><button class="btn btn-ghost btn-sm" id="MEMO_CPY_BTN" onclick="doCopy('MEMO_OUT','MEMO_CPY_BTN')">Kopiëren</button></div>
    <div class="memo" id="MEMO_OUT">KREDIETMEMO — MB ADVIESGROEP
Datum: ${datum}  ·  Ref: MBA-${Date.now().toString().slice(-6)}
─────────────────────────────────────────

KLANT
Naam              : ${f('naamKlant')||'—'}
Type              : ${f('typeKlant')==='bv'?'BV / Holding':'Particulier'}
Woonland          : ${f('woonland')==='nl'?'Nederland':f('woonland')==='eu'?'EU (niet NL)':'Buiten EU'}
Inkomen/jr        : ${f('inkomen')?'€'+parseInt(f('inkomen')).toLocaleString():'Niet opgegeven'}

PAND
Type              : ${f('typeVastgoed')}  ·  Doel: ${f('doelFinanciering')||'aankoop'}
Aankoopprijs      : ${fE(m.a)}
Marktwaarde       : ${fE(m.mv)||'—'}
Huurinkomsten     : ${m.h?fE(m.h)+'/mnd':'Geen'}

FINANCIERING
Gewenste lening   : ${fE(m.l)}
LTV               : ${fP(m.ltv)}
DSCR              : ${m.dscr?m.dscr.toFixed(2)+' ('+afl+')':'N/B'}
Maandlast         : ${fE(m.ml)} (${f('metAflossing')==='ja'?'annuitair':'interest only'})

DOCUMENTEN
Categorieën       : ${filledCategoriesCount()}/${Object.keys(DOC_TYPES).length} aanwezig
Bestanden         : ${totalFilesCount()} geüpload

BEOORDELING
Score             : ${sc.score}/10 — ${sc.label}
Dossier           : ${doss?.score||0}/100 — ${doss?.label||'—'}
Readiness         : ${readiness?.overallStatus||'—'}
Oordeel           : ${concl}

TOP ACTIES:
${acties.slice(0,5).map((a,i)=>i+1+'. '+a.t).join('\n')}

─────────────────────────────────────────
MB Deal Analyzer v19 | Indicatief — geen rechten ontleenbaar</div>
  </div>
  <div class="btn-row" id="PRINT_BTN_ROW">
    <button class="btn btn-bl" onclick="printReport()">PDF afdrukken</button>
    <button class="btn btn-ghost" onclick="resetApp()">Nieuwe deal</button>
  </div>
  `;
}

// ════════════════════════════════════════════════════
// ㉜ RIGHT SIDEBAR
// ════════════════════════════════════════════════════
function renderAside(m, sc, doss, readiness) {
  const ltvC=m.ltv===null?'cgy':m.ltv<70?'cg':m.ltv>80?'cr':'cw';
  const dscrC=m.dscr===null?'cgy':m.dscr>=1.25?'cg':m.dscr>=1?'cw':'cr';
  const dqC={good:'var(--gn)',blauw:'var(--bl)',warn:'var(--wn)',bad:'var(--rk)'}[doss?.klasse]||'var(--tx3)';
  const rdB=readiness?.bancair,rdNB=readiness?.nonbank;
  const rdCls=r=>({good:'rd-ok',blauw:'rd-bl',warn:'rd-warn',bad:'rd-bad'}[r?.statusKlasse]||'rd-bl');
  const totalFiles=totalFilesCount();
  const filledCats=filledCategoriesCount();
  const totalCats=Object.keys(DOC_TYPES).length;

  document.getElementById('PANEL_ASIDE').innerHTML = `
    <div class="p-head"><div class="p-head-lbl"><div class="p-head-dot" style="background:var(--bl)"></div>Live Dashboard</div></div>

    <div style="background:var(--wh);border:1px solid var(--bd);border-radius:var(--r);padding:11px;margin-bottom:7px;box-shadow:var(--sh)">
      ${scoreRing(sc.score,sc.klasse,sc.subScores,sc.isCapped?sc.capReden:null)}
    </div>

    <div style="background:var(--wh);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:7px;overflow:hidden;box-shadow:var(--sh)">
      <div style="padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--bd-l);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--tx4)">Kerncijfers</div>
      <div style="padding:8px 10px">
        <div class="aside-row"><span class="aside-k">Score</span><span class="aside-v" style="color:${SC_STROKE[sc.klasse]||'var(--bl)'}">${sc.score}/10 — ${sc.label}</span></div>
        <div class="aside-row"><span class="aside-k">LTV</span><span class="aside-v ${ltvC}">${m.ltv?fP(m.ltv):'—'}<span style="font-size:8px;font-weight:400;color:var(--tx4);margin-left:4px">${m.ltv===null?'':m.ltv<70?'✓ ruim':m.ltv<=80?'OK':m.ltv<=85?'> norm':'kritisch'}</span></span></div>
        <div class="aside-row"><span class="aside-k">DSCR</span><span class="aside-v ${dscrC}">${m.dscr?m.dscr.toFixed(2):'—'}<span style="font-size:8px;font-weight:400;color:var(--tx4);margin-left:4px">${m.dscr===null?'geen huur':m.dscr>=1.25?'✓ norm':m.dscr>=1?'< 1.25':'< 1.0'}</span></span></div>
        <div class="aside-row"><span class="aside-k">Maandlast</span><span class="aside-v cb">${m.ml?fE(m.ml):'—'}${m.h&&m.ml?`<span style="font-size:8px;font-weight:400;color:var(--tx4);margin-left:4px">${((m.ml/m.h)*100).toFixed(0)}% v. huur</span>`:''}
        </span></div>
        <div class="aside-row"><span class="aside-k">Cashflow</span><span class="aside-v ${m.cf>0?'cg':m.cf<0?'cr':'cgy'}">${m.h&&m.ml?fE(m.cf):'—'}</span></div>
        <div class="aside-row"><span class="aside-k">Inbreng</span><span class="aside-v">${m.ibP!==null?fP(m.ibP):'—'}${m.inb?`<span style="font-size:8px;font-weight:400;color:var(--tx4);margin-left:4px">${fE(m.inb)}</span>`:''}</span></div>
      </div>
    </div>

    <div style="background:var(--wh);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:7px;overflow:hidden;box-shadow:var(--sh)">
      <div style="padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--bd-l);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--tx4)">Readiness</div>
      <div style="padding:8px 10px">
        <div class="doss-bar"><div class="doss-fill" style="width:${doss?.score||0}%;background:${dqC}"></div></div>
        <div class="doss-lbl"><span style="color:var(--tx4)">Dossier</span><span style="font-weight:700;font-family:var(--mono);color:${dqC}">${doss?.score||0}/100</span></div>
        <div class="rd-pills">
          <div class="rd-pill"><span class="rd-pill-lbl">Bancair</span><span class="rd-pill-val ${rdCls(rdB)}">${rdB?.status||'—'}</span></div>
          <div class="rd-pill"><span class="rd-pill-lbl">Non-bank</span><span class="rd-pill-val ${rdCls(rdNB)}">${rdNB?.status||'—'}</span></div>
          <div class="rd-pill"><span class="rd-pill-lbl">Documenten</span><span class="rd-pill-val rd-bl">${filledCats}/${totalCats} cat. · ${totalFiles} best.</span></div>
        </div>
      </div>
    </div>

    ${f('naamKlant')?`
    <div style="background:var(--wh);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);margin-bottom:7px">
      <div style="padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--bd-l);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--tx4)">Klant</div>
      <div style="padding:8px 10px">
        <div style="font-family:var(--head);font-size:11.5px;font-weight:600;margin-bottom:2px">${f('naamKlant')}</div>
        <div style="font-size:9.5px;color:var(--tx3)">${f('typeKlant')==='bv'?'BV':'Particulier'} · ${f('woonland')==='nl'?'NL':f('woonland')==='eu'?'EU':'Buiten EU'}</div>
        ${f('dossiernr')?`<div style="font-size:9px;color:var(--tx4);margin-top:3px;font-family:var(--mono)">${f('dossiernr')}</div>`:''}
        ${f('adviseur')?`<div style="font-size:9px;color:var(--tx4);font-family:var(--mono)">${f('adviseur')}</div>`:''}
      </div>
    </div>`:''}

    <div style="background:var(--wh);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)">
      <div style="padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--bd-l);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--tx4)">Documenten</div>
      <div style="padding:8px 10px">
        ${Object.entries(DOC_TYPES).map(([key,dt])=>{
          const files=S.docs[key].files;
          const hasFiles=files.length>0;
          const hasAi=files.some(fe=>fe.ai);
          const bestKwal=files.reduce((best,fe)=>{const k=fe.parsed?._meta?.documentKwaliteit;return k==='goed'?'goed':best==='goed'?'goed':k==='matig'?'matig':best;},null);
          return `<div class="aside-row">
            <span class="aside-k" style="font-size:9px">${dt.icon} ${dt.label.substring(0,14)}</span>
            <span style="display:flex;gap:3px;align-items:center">
              <span style="font-size:8.5px;font-weight:700;font-family:var(--head);padding:1.5px 5px;border-radius:10px;${!hasFiles?'background:var(--bg2);color:var(--tx4)':bestKwal==='goed'?'background:var(--gn-bg);color:var(--gn)':bestKwal==='matig'?'background:var(--wn-bg);color:var(--wn)':'background:var(--bl-bg);color:var(--bl)'}">
                ${!hasFiles?'—':`${files.length} best.`}
              </span>
              ${hasAi?`<span style="font-size:7px;font-weight:700;padding:1px 4px;border-radius:8px;background:var(--pur-bg);color:var(--pur)">AI</span>`:''}
            </span>
          </div>`;
        }).join('')}
      </div>
    </div>
  `;
}

// ════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════
fullRender();
</script>
</body>
</html>

function validate() {
  const e = {};
  const a=parseFloat(S.form.aankoopprijs),l=parseFloat(S.form.gewensteLening);
  if(!S.form.naamKlant?.trim()) e.naamKlant='Naam is verplicht';
  if(!S.form.aankoopprijs || isNaN(parseFloat(S.form.aankoopprijs)) || parseFloat(S.form.aankoopprijs) <= 0) e.aankoopprijs='Aankoopprijs verplicht';
  if(!S.form.gewensteLening || isNaN(parseFloat(S.form.gewensteLening)) || parseFloat(S.form.gewensteLening) <= 0) e.gewensteLening='Leningsbedrag verplicht';
  if(!S.form.eigenInbreng || isNaN(parseFloat(S.form.eigenInbreng)) || parseFloat(S.form.eigenInbreng) < 0) e.eigenInbreng='Eigen inbreng verplicht';
  if(l>0&&a>0&&l>a*1.1) e.gewensteLening='Hoger dan aankoopprijs';
  return e;
}

// Normaliseer rente: accepteer zowel 5 als 0.05
function normalizeRente(v) {
  const n = parseFloat(v);
  if(isNaN(n)) return 0.05;
  return n > 1 ? n / 100 : n;
}

// Sla originele waarden op zodra what-if voor het eerst wordt gebruikt
const WHATIF_KEYS = ['rente','gewensteLening','eigenInbreng','huurPerMaand'];
let _whatifSnapshot = null;

function snapWhatIf() {
  if(!_whatifSnapshot) {
    _whatifSnapshot = {};
    WHATIF_KEYS.forEach(k => { _whatifSnapshot[k] = S.form[k]; });
  }
}

function resetWhatIf() {
  if(!_whatifSnapshot) { showToast('Geen wijzigingen om terug te zetten.', 'info'); return; }
  WHATIF_KEYS.forEach(k => { S.form[k] = _whatifSnapshot[k]; });
  _whatifSnapshot = null;
  fullRender();
  showToast('What-if teruggezet naar originele waarden', 'ok');
}
function syncWhatIf(key, value, labelEl) {
  // Sla originele waarden op bij eerste what-if actie
  snapWhatIf();

  // 1. State bijwerken
  S.form[key] = value;

  // 2. Label in what-if sectie bijwerken
  if(labelEl) {
    const n = parseFloat(value);
    if(key === 'rente') labelEl.textContent = (n * 100).toFixed(1) + '%';
    else labelEl.textContent = '€' + Math.round(n).toLocaleString('nl-NL');
  }

  // 3. Bijbehorend inputveld in linkerpaneel syncen (zonder re-render)
  const inp = document.getElementById('fi_' + key);
  if(inp) {
    inp.value = value;
    inp.classList.add('from-client');
  }

  // 4. Rente: ook de slider in het linkerpaneel syncen
  if(key === 'rente') {
    const leftSlider = document.querySelector('#PANEL_INPUT input[type=range][min="0.03"]');
    if(leftSlider) {
      leftSlider.value = value;
      const slVal = leftSlider.nextElementSibling;
      if(slVal) slVal.textContent = (parseFloat(value) * 100).toFixed(1) + '%';
    }
  }

  // 5. Analyse herberekenen (debounced)
  scheduleAnalysisUpdate();
}


const LS_KEY = 'mb_deal_analyzer_state';

function saveToLocalStorage() {
  try {
    // Sla form + docs op (zonder rawText om ruimte te sparen)
    const toSave = {
      form: S.form,
      docs: {}
    };
    Object.entries(S.docs).forEach(([k,v]) => {
      toSave.docs[k] = {
        multiple: v.multiple,
        files: v.files.map(f => ({
          id: f.id,
          naam: f.naam,
          uploadDatum: f.uploadDatum,
          ai: f.ai,
          parsed: f.parsed ? {
            ...f.parsed,
            _meta: f.parsed._meta ? {
              ...f.parsed._meta,
              rawText: undefined,
              extractedText: undefined
            } : undefined
          } : undefined
        }))
      };
    });
    localStorage.setItem(LS_KEY, JSON.stringify(toSave));
  } catch(e) { /* quota overschreden of private mode */ }
}

function loadFromLocalStorage() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return false;
    const saved = JSON.parse(raw);
    if(saved.form) Object.assign(S.form, saved.form);
    if(saved.docs) {
      Object.entries(saved.docs).forEach(([k,v]) => {
        if(S.docs[k]) S.docs[k].files = v.files || [];
      });
    }
    return true;
  } catch(e) { return false; }
}

function showToast(msg, type='ok') {
  let el = document.getElementById('TOAST');
  if(!el) {
    el = document.createElement('div');
    el.id = 'TOAST';
    el.style.cssText = 'position:fixed;bottom:24px;right:24px;z-index:9999;font-family:var(--font);font-size:12px;font-weight:600;padding:10px 16px;border-radius:9px;box-shadow:0 4px 16px rgba(0,0,0,.15);transition:opacity .3s;pointer-events:none';
    document.body.appendChild(el);
  }
  const styles = {
    ok: 'background:var(--gn-bg);color:var(--gn);border:1px solid var(--gn-bd)',
    warn: 'background:var(--wn-bg);color:var(--wn);border:1px solid var(--wn-bd)',
    info: 'background:var(--bl-bg);color:var(--bl);border:1px solid var(--bl-bd)'
  };
  el.style.cssText += ';' + (styles[type]||styles.ok);
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.opacity='0'; }, 2800);
}
let _renderDebounce = null;

function scheduleAnalysisUpdate() {
  clearTimeout(_renderDebounce);
  _renderDebounce = setTimeout(() => updateAnalysisPanels(), 120);
}

// Centrale berekeningsfunctie — voorkomt duplicatie tussen fullRender en updateAnalysisPanels
function calcAll() {
  S.errors = validate();
  const m        = calcMetrics(S.form);
  const conf     = checkConflicts(S.form);
  const doss     = calcDossierQuality(conf, S.form);
  const risks    = detectRisks(S.form, m, conf);
  const sc       = calculateScore(S.form, m, doss);
  const readiness= detectReadiness(S.form, m, conf, sc);
  const acties   = generateAdvice(S.form, m, risks, sc, doss, readiness);
  const lenders  = matchLenders(S.form, m, sc, doss);
  const concl    = genConclusie(sc, conf, doss, readiness);
  return { m, conf, doss, risks, sc, readiness, acties, lenders, concl };
}

function updateAnalysisPanels() {
  const r = calcAll();
  document.getElementById('HDR_K').textContent = S.form.naamKlant||'';
  document.getElementById('PANEL_MAIN').innerHTML = renderMain(r.m, r.sc, r.risks, r.conf, r.doss, r.readiness, r.acties, r.lenders, r.concl);
  renderAside(r.m, r.sc, r.doss, r.readiness);
  updateFieldErrors();
  saveToLocalStorage();
}

function updateFieldErrors() {
  Object.keys(S.errors).filter(k=>!k.startsWith('_')).forEach(k=>{const el=document.getElementById('fi_'+k);if(el)el.classList.add('err');});
  document.querySelectorAll('.finput.err').forEach(el=>{const k=el.id.replace('fi_','');if(!S.errors[k])el.classList.remove('err');});
}

function fullRender() {
  _whatifSnapshot = null; // snapshot wissen bij handmatige formulierwijziging
  const r = calcAll();
  document.getElementById('HDR_K').textContent = S.form.naamKlant||'';
  document.getElementById('PANEL_INPUT').innerHTML = renderInput();
  document.getElementById('PANEL_MAIN').innerHTML = renderMain(r.m, r.sc, r.risks, r.conf, r.doss, r.readiness, r.acties, r.lenders, r.concl);
  renderAside(r.m, r.sc, r.doss, r.readiness);
  saveToLocalStorage();
}

function resetApp() {
  if(!confirm('Weet je zeker dat je alles wilt wissen? Dit kan niet ongedaan worden gemaakt.')) return;
  Object.assign(S, {
    errors:{}, autoFill:{}, clientData:{}, activeImportTab:'json',
    docs:{kvk:{multiple:false,files:[]},graydon:{multiple:false,files:[]},woz:{multiple:true,files:[]},kadaster:{multiple:true,files:[]},jaarrekeningen:{multiple:true,files:[]}},
    loading:{},
    form:{naamKlant:'',inkomen:'',vermogen:'',aantalPanden:'',woonland:'nl',typeKlant:'particulier',doelFinanciering:'aankoop',aankoopprijs:'',marktwaarde:'',huurPerMaand:'',huurType:'bestaand',typeVastgoed:'woning',gewensteLening:'',eigenInbreng:'',rente:'0.05',looptijd:'20',metAflossing:'nee',dossiernr:'',adviseur:'',notitie:'',adresPand:''}
  });
  try { localStorage.removeItem(LS_KEY); } catch(e) {}
  fullRender();

    const map={typeKlant:'typeKlant',doelFinanciering:'doelFinanciering',typeVastgoed:'typeVastgoed',marktwaarde:'marktwaarde',gewensteLening:'gewensteLening',jaarinkomen:'inkomen',naamKlant:'naamKlant',aantalPanden:'aantalPanden',inkomen:'inkomen'};

// Financieringsdata import via PDF (ALLEEN dealgegevens, NIET documentanalyse)
async function handlePdfImport(file) {
  if (!file) return;
  const statusEl = document.getElementById('PDF_IMPORT_STATUS');
  statusEl.innerHTML = `<div style="background:var(--bl-bg);border:1.5px solid var(--bl-bd);border-radius:8px;padding:13px 14px;margin-top:11px"><div style="font-family:var(--head);font-size:10px;font-weight:700;color:var(--bl);margin-bottom:6px;text-transform:uppercase">PDF wordt verwerkt</div><div style="font-size:11px;color:var(--tx2);line-height:1.6">Tekst wordt uitgelezen en geanalyseerd voor dealgegevens…</div></div>`;
  try {
    const parsed = await extractTextFromDoc(file);
    const response = await fetch('/api/openai', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: parsed.text })
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || 'Onbekende fout');
    Object.entries(data).forEach(([key, value]) => {
      if (value !== null && value !== undefined && value !== '') {
        S.form[key] = String(value); S.clientData[key] = String(value);
      }
    });
    if (!S.form.naamKlant && S.form.adviseur) {
  S.form.naamKlant = S.form.adviseur;
  S.clientData.naamKlant = S.form.adviseur;
  S.form.adviseur = '';
  delete S.clientData.adviseur;
}
    statusEl.innerHTML = `<div style="background:var(--gn-bg);border:1.5px solid var(--gn-bd);border-radius:8px;padding:13px 14px;margin-top:11px"><div style="font-family:var(--head);font-size:10px;font-weight:700;color:var(--gn);margin-bottom:6px;text-transform:uppercase">PDF succesvol ingelezen</div><div style="font-size:11px;color:var(--tx2);line-height:1.6">Dealgegevens zijn ingevuld vanuit de PDF.</div></div>`;
    hideImportModal(); fullRender();
  } catch (error) {
    statusEl.innerHTML = `<div style="background:var(--rk-bg);border:1.5px solid var(--rk-bd);border-radius:8px;padding:13px 14px;margin-top:11px"><div style="font-family:var(--head);font-size:10px;font-weight:700;color:var(--rk);margin-bottom:6px;text-transform:uppercase">PDF import mislukt</div><div style="font-size:11px;color:var(--tx2);line-height:1.6">${error.message}</div></div>`;
    console.error(error);
  }
}

function printReport() {
  if (!S.form.naamKlant?.trim() || !parseFloat(S.form.gewensteLening)) {
    showToast('Vul eerst naam en lening in.', 'warn');
    return;
  }

  const report = document.getElementById('PDF_REPORT');
  report.innerHTML = buildPdfHtml();
  report.style.display = 'block';

  document.body.classList.add('pdf-mode');
  window.print();

  setTimeout(() => {
    document.body.classList.remove('pdf-mode');
    report.style.display = 'none';
  }, 800);
}

// ════════════════════════════════════════════════════
// ㉗ UI HELPERS
// ════════════════════════════════════════════════════
function f(k){return S.form[k]||'';}
function fv(k){return parseFloat(S.form[k])||0;}

// Velden die alleen positieve getallen accepteren
const POSITIVE_FIELDS = new Set(['aankoopprijs','marktwaarde','gewensteLening','eigenInbreng','huurPerMaand','inkomen','vermogen','aantalPanden']);

function inp(key,type='text',ph=''){
  const v=(S.form[key]||'').replace(/"/g,'&quot;');
  const fc=S.clientData[key]!==undefined?' from-client':'';
  const ec=S.errors[key]?' err':'';
  const minAttr = (type==='number' && POSITIVE_FIELDS.has(key)) ? ' min="0"' : '';
  const sanitize = (type==='number' && POSITIVE_FIELDS.has(key))
    ? `if(parseFloat(this.value)<0)this.value=0;`
    : '';
  return `<input type="${type}" id="fi_${key}" class="finput${fc}${ec}" value="${v}" placeholder="${ph}"${minAttr} oninput="${sanitize}S.form['${key}']=this.value;scheduleAnalysisUpdate()" onchange="${sanitize}S.form['${key}']=this.value;scheduleAnalysisUpdate()">`;
}
function sel(key,opts){
  const v=S.form[key]||'';const fc=S.clientData[key]!==undefined?' from-client':'';
  const extra = key==='metAflossing' ? `onchange="S.form['${key}']=this.value;const lw=document.getElementById('LOOPTIJD_WRAP');if(lw)lw.style.cssText=this.value==='ja'?'':'opacity:.45;pointer-events:none';fullRender()"` : `onchange="S.form['${key}']=this.value;fullRender()"`;
  return `<select id="fi_${key}" class="fselect${fc}" ${extra}>${opts.map(([val,lbl])=>`<option value="${val}"${v===val?' selected':''}>${lbl}</option>`).join('')}</select>`;
}
function fg(label,input,err=''){return `<div class="fgrp">${label?`<label>${label}</label>`:''}${input}${err?`<div class="ferr">${err}</div>`:''}</div>`;}
function fg2(a,b){return `<div class="fg2">${a}${b}</div>`;}

function scoreRing(sc,kl,sub,cap){
  const r=34,c=2*Math.PI*r,off=c*(1-sc/10);
  const str=SC_STROKE[kl]||'#1B597B';
  // Sub-scores: duidelijke labels in het NL
  const subRows = sub ? [
    ['Haalbaarheid', sub.A],
    ['Risicoprofiel', sub.B],
    // ['Dossier', sub.C] — removed
  ] : [];
  const subHtml = subRows.length ? `
    <div style="width:100%;margin-top:6px;border-top:1px solid var(--bd-l);padding-top:6px">
      ${subRows.map(([l,v])=>`
        <div style="display:flex;justify-content:space-between;align-items:center;padding:2px 0">
          <span style="font-size:8.5px;color:var(--tx4);font-family:var(--head)">${l}</span>
          <span style="font-size:9px;font-weight:700;font-family:var(--mono);color:${v>=0.5?'var(--gn)':v<=-0.5?'var(--rk)':'var(--tx3)'}">${v>0?'+':''}${v.toFixed(1)}</span>
        </div>`).join('')}
    </div>` : '';
  return `<div class="sc-w">
    <div class="sc-r">
      <svg width="76" height="76" viewBox="0 0 80 80">
        <circle class="sc-tr" cx="40" cy="40" r="${r}"/>
        <circle class="sc-fl" cx="40" cy="40" r="${r}" stroke="${str}" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/>
      </svg>
      <div class="sc-in">
        <span class="sc-n" style="color:${str}">${sc}</span>
        <span class="sc-d">/10</span>
      </div>
    </div>
    <div class="sc-lb" style="color:${str}">${SC_LABEL[kl]}</div>
    ${cap?`<div style="font-size:8px;color:var(--rk);margin-top:2px;text-align:center;font-family:var(--head);font-weight:600">${cap}</div>`:''}
    ${subHtml}
  </div>`;
}

// ════════════════════════════════════════════════════
// ㉘ DOCUMENT CATEGORIE UI
// ════════════════════════════════════════════════════
function renderDocCategory(key) {
  const dt = DOC_TYPES[key];
  const cat = S.docs[key];
  const files = cat.files;
  const isLoading = S.loading[key+'_loading'];
  const hasFiles = files.length > 0;
  const isRequired = dt.requiredFor.length > 0;
  const statusCls = hasFiles ? 'ok' : isRequired ? 'miss' : 'opt';
  const statusLbl = hasFiles ? (dt.multiple?`${files.length} bestand${files.length>1?'en':''}`:'✓ Aanwezig') : (isRequired?'Vereist':'Optioneel');
  // Toon recent-uploaded indicator (binnen 3 seconden)
  const recentUpload = files.some(f => f._justUploaded);

  return `
  <div class="doc-category" id="DOC_CAT_${key}">
    <div class="doc-cat-header" onclick="this.parentElement.querySelector('.doc-cat-body').style.display=this.parentElement.querySelector('.doc-cat-body').style.display==='none'?'block':'none'">
      <span class="doc-cat-icon">${dt.icon}</span>
      <span class="doc-cat-lbl">${dt.label}</span>
      <span class="doc-cat-count">${files.length}</span>
      <span class="doc-cat-status ${statusCls}">${statusLbl}</span>
    </div>
    <div class="doc-cat-body">
      ${files.length>0?`<div class="doc-file-list">
        ${files.map(fEntry=>`
          <div class="doc-file-item${fEntry._justUploaded?' doc-file-new':''}">
            <span style="font-size:10px;flex-shrink:0">${fEntry._justUploaded?'✅':dt.icon}</span>
            <span class="doc-file-name" title="${fEntry.naam}">${fEntry.naam}</span>
            <span class="doc-file-date">${fEntry.uploadDatum}</span>
            ${fEntry.parsed?._meta?.documentKwaliteit?`<span style="font-size:7.5px;font-weight:700;padding:1.5px 4px;border-radius:8px;${fEntry.parsed._meta.documentKwaliteit==='goed'?'background:var(--gn-bg);color:var(--gn)':fEntry.parsed._meta.documentKwaliteit==='matig'?'background:var(--wn-bg);color:var(--wn)':'background:var(--rk-bg);color:var(--rk)'}">${fEntry.parsed._meta.documentKwaliteit==='goed'?'OK':fEntry.parsed._meta.documentKwaliteit==='matig'?'Deels':'Slecht'}</span>`:''}
            ${fEntry.ai?`<span style="font-size:7.5px;font-weight:700;padding:1.5px 4px;border-radius:8px;background:var(--pur-bg);color:var(--pur);border:1px solid var(--pur-bd)">AI ✓</span>`:''}
            <button class="doc-file-del" onclick="deleteFile('${key}','${fEntry.id}')" title="Verwijderen">✕</button>
          </div>`).join('')}
      </div>`:''}
      <div class="doc-upload-btn${isLoading?' loading':''}">
        <input type="file" accept="${dt.accepts}" onchange="handleUpload('${key}', this.files[0])">
        ${isLoading?`<span class="spn"></span> Analyseren…`:`+ ${dt.multiple&&hasFiles?'Nog een':'Uploaden'}`}
      </div>
    </div>
  </div>`;
}

// ════════════════════════════════════════════════════
// ㉙ SECTIE 4 — DOCUMENTANALYSE (alle types)
// ════════════════════════════════════════════════════
function renderDocAnalyseBlok() {
  const totalFiles = totalFilesCount();
  const filledCats = filledCategoriesCount();
  if (totalFiles === 0) return '';

  // Helpers
  function getAi(type) {
    return S.docs[type]?.files.find(fe => fe.ai)?.ai || null;
  }
  function fmtBedrag(v) {
    if(!v) return null;
    let s = String(v).trim();
    // NL-notatie: punt als duizendscheider, komma als decimaal (bijv. "220.000" of "€ 220.000,00")
    // Verwijder valutasymbolen en spaties
    s = s.replace(/[€$£\s]/g, '');
    // Als er punten én komma's zijn: punt = duizend, komma = decimaal
    if(s.includes('.') && s.includes(',')) {
      s = s.replace(/\./g, '').replace(',', '.');
    } else if(s.includes('.')) {
      // Alleen punt: kijk of het een duizendscheider is (bijv. 220.000) of decimaal (220.50)
      const parts = s.split('.');
      if(parts[parts.length-1].length === 3) {
        // Laatste deel heeft 3 cijfers → duizendscheider
        s = s.replace(/\./g, '');
      }
      // Anders gewoon laten (echte decimaal)
    } else if(s.includes(',')) {
      s = s.replace(',', '.');
    }
    const n = parseFloat(s);
    return isNaN(n) ? null : '€' + Math.round(n).toLocaleString('nl-NL');
  }
  function safe(v) { return v && String(v).trim() ? String(v).trim() : null; }

  const aiKvk   = getAi('kvk');
  const aiGray  = getAi('graydon');
  const aiWoz   = getAi('woz');
  const aiKad   = getAi('kadaster');
  const aiJaarr = getAi('jaarrekeningen');

  // Regex-parsed fallbacks
  const kvk    = getFirstParsed('kvk');
  const gray   = getFirstParsed('graydon');
  const woz    = getFirstParsed('woz');
  const kad    = getFirstParsed('kadaster');
  const jaarr  = getFirstParsed('jaarrekeningen');

  // ── Samenvatting ─────────────────────────────────────────────
  const samenvattingItems = [];
  if(safe(aiKvk?.summary))   samenvattingItems.push(aiKvk.summary);
  else if(kvk?._rechtsvormRaw) samenvattingItems.push(`Rechtsvorm <em>${kvk._rechtsvormRaw}</em> herkend via KVK`);

  if(safe(aiGray?.summary))  samenvattingItems.push(aiGray.summary);
  else if(gray?._risicoNiveau) samenvattingItems.push(`Kredietprofiel: <em>${gray._risicoNiveau} risico</em> (Graydon)`);

  if(safe(aiWoz?.summary))   samenvattingItems.push(aiWoz.summary);
  else if(woz?._definitieveWaarde) samenvattingItems.push(`${woz._isTaxatie?'Taxatiewaarde':'WOZ-waarde'}: <em>${fE(woz._definitieveWaarde)}</em>`);

  if(safe(aiKad?.summary))   samenvattingItems.push(aiKad.summary);
  else if(kad?._eigenaarRaw) samenvattingItems.push(`Eigendom op naam van <em>${kad._eigenaarRaw}</em>`);

  if(safe(aiJaarr?.summary)) samenvattingItems.push(aiJaarr.summary);
  else if(jaarr?._jaar) samenvattingItems.push(`Jaarrekening <em>${jaarr._jaar}</em> aanwezig`);

  // ── Inzichten ────────────────────────────────────────────────
  const inzichtItems = [];

  // KVK
  if(aiKvk?.fields) {
    const fi = aiKvk.fields;
    if(safe(fi.bedrijfsnaam))     inzichtItems.push(`Bedrijfsnaam: <em>${fi.bedrijfsnaam}</em>`);
    if(safe(fi.rechtsvorm))       inzichtItems.push(`Rechtsvorm: <em>${fi.rechtsvorm}</em>`);
    if(safe(fi.kvkNummer))        inzichtItems.push(`KVK-nummer: <em>${fi.kvkNummer}</em>`);
    if(safe(fi.sbiCode))          inzichtItems.push(`SBI-code: <em>${fi.sbiCode}</em>`);
    if(safe(fi.oprichtingsdatum)) inzichtItems.push(`Opgericht: <em>${fi.oprichtingsdatum}</em>`);
    if(safe(fi.vestigingsadres))  inzichtItems.push(`Vestiging: <em>${fi.vestigingsadres}</em>`);
  } else if(kvk?._isBV && S.form.typeKlant==='bv') {
    inzichtItems.push('KVK bevestigt BV-structuur — consistent met profiel');
  }

  // Kredietrapport
  if(aiGray?.fields) {
    const fi = aiGray.fields;
    if(safe(fi.score))                inzichtItems.push(`Score: <em>${fi.score}</em>`);
    if(safe(fi.internationaleScore))  inzichtItems.push(`Internationale score: <em>${fi.internationaleScore}</em>`);
    if(safe(fi.risicoklasse))         inzichtItems.push(`Risicoklasse: <em>${fi.risicoklasse}</em>`);
    const gKlimiet = safe(fi.kredietlimiet) || safe(fi.aanbevolenKredietlimiet);
    if(gKlimiet)                      inzichtItems.push(`Kredietlimiet: <em>${gKlimiet}</em>`);
    if(safe(fi.probabilityOfDefault)) inzichtItems.push(`Probability of Default: <em>${fi.probabilityOfDefault}</em>`);
    if(safe(fi.betaalgedrag))         inzichtItems.push(`Betaalgedrag: <em>${fi.betaalgedrag}</em>`);
    if(safe(fi.bijzonderheden))       inzichtItems.push(`Bijzonderheden: <em>${fi.bijzonderheden}</em>`);
    if(safe(fi.incassoCount) && fi.incassoCount !== '0') inzichtItems.push(`Incasso's: <em>${fi.incassoCount}</em>`);
  } else if(gray?._risicoNiveau) {
    inzichtItems.push(`Graydon risiconiveau: <em>${gray._risicoNiveau}</em>`);
  }

  // WOZ / Taxatie
  if(aiWoz?.fields) {
    const fi = aiWoz.fields;
    const wozAdres = safe(fi.adresObject) || safe(fi.adres);
    if(wozAdres)                  inzichtItems.push(`Object: <em>${wozAdres}</em>`);
    const isTaxWoz = fi.documentType === 'taxatie';
    const wv = fmtBedrag(isTaxWoz ? fi.taxatiewaarde : fi.wozWaarde) || fmtBedrag(fi.waarde);
    if(wv)                        inzichtItems.push(`${isTaxWoz?'Taxatiewaarde':'WOZ-waarde'}: <em>${wv}</em>`);
    const wozDatum = safe(fi.peildatum) || safe(fi.waardeDatum);
    if(wozDatum)                  inzichtItems.push(`Peildatum: <em>${wozDatum}</em>`);
    if(safe(fi.bouwjaar))         inzichtItems.push(`Bouwjaar: <em>${fi.bouwjaar}</em>`);
    if(safe(fi.oppervlakte))      inzichtItems.push(`Oppervlakte: <em>${fi.oppervlakte}</em>`);
    if(safe(fi.taxateur))         inzichtItems.push(`Taxateur: <em>${fi.taxateur}</em>`);
  } else if(woz?._definitieveWaarde) {
    inzichtItems.push(`${woz._isTaxatie?'Taxatierapport':'WOZ'}: <em>${fE(woz._definitieveWaarde)}</em> — ${woz._isTaxatie?'hogere bewijskracht':'WOZ-beschikking'}`);
  }

  // Kadaster
  if(aiKad?.fields) {
    const fi = aiKad.fields;
    if(safe(fi.eigenaar))        inzichtItems.push(`Eigenaar: <em>${fi.eigenaar}</em>`);
    if(safe(fi.koopsom))         inzichtItems.push(`Koopsom: <em>${fmtBedrag(fi.koopsom) || fi.koopsom}</em>`);
    if(safe(fi.leveringsdatum))  inzichtItems.push(`Datum levering: <em>${fi.leveringsdatum}</em>`);
    if(fi.hypotheekInschrijving === 'ja') {
      const hb = fi.hypotheekBedrag ? ` (${fmtBedrag(fi.hypotheekBedrag) || fi.hypotheekBedrag})` : '';
      inzichtItems.push(`Hypotheek ingeschreven${hb} — rangorde aandachtspunt`);
    }
    if(safe(fi.bijzonderheden))  inzichtItems.push(`Bijzonderheden: <em>${fi.bijzonderheden}</em>`);
  } else if(kad?._heeftHypotheek) {
    inzichtItems.push('Bestaande hypotheekinschrijving — rangorde aandachtspunt');
  }

  // Jaarrekeningen — beide veldnaamconventies (lowercase + camelCase)
  if(aiJaarr?.fields) {
    const fi = aiJaarr.fields;
    if(safe(fi.bedrijfsnaam))    inzichtItems.push(`Onderneming: <em>${fi.bedrijfsnaam}</em>`);
    if(safe(fi.boekjaar))        inzichtItems.push(`Boekjaar: <em>${fi.boekjaar}</em>`);
    if(safe(fi.omzet))           inzichtItems.push(`Omzet: <em>${fmtBedrag(fi.omzet) || fi.omzet}</em>`);
    const jNettowinst = fi.nettoResultaat || fi.nettowinst;
    if(safe(jNettowinst))        inzichtItems.push(`Nettoresultaat: <em>${fmtBedrag(jNettowinst) || jNettowinst}</em>`);
    if(safe(fi.ebitda))          inzichtItems.push(`EBITDA: <em>${fmtBedrag(fi.ebitda) || fi.ebitda}</em>`);
    const jEv = fi.eigenVermogen || fi.eigenvermogen;
    if(safe(jEv))                inzichtItems.push(`Eigen vermogen: <em>${fmtBedrag(jEv) || jEv}</em>`);
    const jBt = fi.balanstotaal || fi.balansTotaal;
    if(safe(jBt))                inzichtItems.push(`Balanstotaal: <em>${fmtBedrag(jBt) || jBt}</em>`);
    if(safe(fi.solvabiliteit))   inzichtItems.push(`Solvabiliteit: <em>${fi.solvabiliteit}%</em>`);
  } else if(jaarr?._jaar) {
    inzichtItems.push(`Jaarrekening ${jaarr._jaar} aanwezig`);
    if(S.form.typeKlant==='bv' && S.docs.jaarrekeningen.files.length < 2) {
      inzichtItems.push('Minder dan 2 jaarrekeningen — onvoldoende voor bancaire inkomenstoets');
    }
  }

  if(inzichtItems.length === 0) inzichtItems.push('Upload documenten voor automatische inzichten.');

  // ── Risico's ─────────────────────────────────────────────────
  const risicoItems = [];
  const aiSources = [aiKvk, aiGray, aiWoz, aiKad, aiJaarr];
  const seenRisks = new Set();
  aiSources.forEach(ai => {
    if(Array.isArray(ai?.risks)) {
      ai.risks.forEach(r => {
        const clean = String(r).trim();
        if(clean && !seenRisks.has(clean)) { seenRisks.add(clean); risicoItems.push(clean); }
      });
    }
  });
  // Regex fallbacks
  if(!aiGray && gray?._risicoNiveau==='hoog') risicoItems.push('Graydon verhoogd risico — bancaire route waarschijnlijk niet haalbaar');
  if(!aiKvk && kvk && S.form.typeKlant==='bv' && !kvk._isBV) risicoItems.push('Structuurconflict: BV ingevuld maar KVK toont andere rechtsvorm');
  if(!aiWoz && woz?._definitieveWaarde && parseFloat(S.form.marktwaarde)>0 &&
      Math.abs(parseFloat(S.form.marktwaarde)-woz._definitieveWaarde)/woz._definitieveWaarde*100>15)
    risicoItems.push(`Waarde-afwijking >15% — marktwaarde en ${woz._bronLabel} inconsistent`);
  if(S.form.typeKlant==='bv' && S.docs.jaarrekeningen.files.length===0)
    risicoItems.push('Jaarrekeningen ontbreken — inkomenstoets BV niet mogelijk');
  if(risicoItems.length === 0) risicoItems.push("Geen documentaire risico's gedetecteerd op basis van beschikbare bestanden.");

  // ── Aandachtspunten ──────────────────────────────────────────
  const aandachtItems = [];
  const wozAanwezig=woz?._definitieveWaarde||safe(aiWoz?.fields?.wozWaarde)||safe(aiWoz?.fields?.taxatiewaarde)||safe(aiWoz?.fields?.waarde);
  if(!wozAanwezig)
    aandachtItems.push('Taxatierapport ontbreekt — vereist voor bancaire route');
  else
    aandachtItems.push('Controleer actualiteit taxatierapport (max 6 maanden oud voor bancaire indiening)');
  const kadHyp=aiKad?.fields?.hypotheekInschrijving==='ja'||aiKad?.fields?.hypotheekInschrijving==='Aanwezig'||kad?._heeftHypotheek;
  if(kadHyp) aandachtItems.push('Verifieer omvang en rang bestaande hypotheek via notaris');
  const incCount = aiGray?.fields?.incassoCount ? parseInt(aiGray.fields.incassoCount) : (gray?._incassoCount || 0);
  if(incCount > 0) aandachtItems.push(`${incCount} incasso('s) gedetecteerd — schriftelijke toelichting vereist`);
  if(aandachtItems.length === 0) aandachtItems.push('Geen directe aandachtspunten op basis van huidige documenten.');

  // ── Bepaal welke KPI-kaarten we tonen (alleen als data beschikbaar) ──────
  const grayFields = aiGray?.fields || {};
  const jaarrFields = aiJaarr?.fields || {};
  const wozFields = aiWoz?.fields || {};

  const kpiScore = safe(grayFields.score);
  const kpiScoreInt = kpiScore ? parseInt(kpiScore) : null;
  const kpiKlasse = safe(grayFields.risicoklasse) || safe(grayFields.internationaleScore);
  const kpiLimiet = fmtBedrag(grayFields.kredietlimiet || grayFields.aanbevolenKredietlimiet);
  const kpiPD = safe(grayFields.probabilityOfDefault);
  // Solvabiliteit: eerst uit jaarrekeningen, dan uit Graydon-rapport
  const kpiSolv = safe(jaarrFields.solvabiliteit) || safe(grayFields.solvabiliteit);
  const kpiBijz = safe(grayFields.bijzonderheden);

  const hasKpis = kpiScore || kpiLimiet || kpiPD || kpiSolv;

  // KPI kleurklasse helper
  function scoreKlasse(n) { return n>=80?'da-good':n>=60?'da-warn':'da-danger'; }
  function pdKlasse(s) { const n=parseFloat(s); return n<1?'da-good':n<5?'da-warn':'da-danger'; }
  function solvKlasse(s) { const n=parseFloat(s); return n>=25?'da-good':n>=15?'da-warn':'da-danger'; }

  // ── Bouw data-kaarten ────────────────────────────────────────────────────
  const bedrijfRows = [];
  const kvkFields = aiKvk?.fields || {};
  if(safe(kvkFields.bedrijfsnaam))     bedrijfRows.push(['Naam', kvkFields.bedrijfsnaam]);
  if(safe(kvkFields.rechtsvorm))       bedrijfRows.push(['Rechtsvorm', kvkFields.rechtsvorm]);
  if(safe(kvkFields.kvkNummer))        bedrijfRows.push(['KVK', kvkFields.kvkNummer]);
  if(safe(kvkFields.sbiCode))          bedrijfRows.push(['SBI-code', kvkFields.sbiCode]);
  if(safe(kvkFields.oprichtingsdatum)) bedrijfRows.push(['Opgericht', kvkFields.oprichtingsdatum]);
  if(safe(kvkFields.vestigingsadres))  bedrijfRows.push(['Vestiging', kvkFields.vestigingsadres]);

  const kredietRows = [];
  if(kpiScore)                         kredietRows.push(['Score', kpiScore, kpiScoreInt?scoreKlasse(kpiScoreInt):null]);
  if(safe(grayFields.internationaleScore)) kredietRows.push(['Int. score', grayFields.internationaleScore]);
  if(safe(grayFields.risicoklasse))    kredietRows.push(['Risicoklasse', grayFields.risicoklasse]);
  if(kpiLimiet)                        kredietRows.push(['Kredietlimiet', kpiLimiet]);
  if(kpiPD)                            kredietRows.push(['Prob. of default', kpiPD, pdKlasse(kpiPD)]);
  if(safe(grayFields.betaalgedrag))    kredietRows.push(['Betaalgedrag', grayFields.betaalgedrag]);

  const vastgoedRows = [];
  const wozAdres = safe(wozFields.adresObject) || safe(wozFields.adres);
  if(wozAdres)                         vastgoedRows.push(['Object', wozAdres]);
  const isTax = wozFields.documentType==='taxatie';
  const wv = fmtBedrag(isTax ? wozFields.taxatiewaarde : wozFields.wozWaarde) || fmtBedrag(wozFields.waarde);
  if(wv)                               vastgoedRows.push([isTax?'Taxatiewaarde':'WOZ-waarde', wv]);
  const wdatum = safe(wozFields.peildatum) || safe(wozFields.waardeDatum);
  if(wdatum)                           vastgoedRows.push(['Peildatum', wdatum]);
  if(safe(wozFields.bouwjaar))         vastgoedRows.push(['Bouwjaar', wozFields.bouwjaar]);
  if(safe(wozFields.oppervlakte))      vastgoedRows.push(['Oppervlakte', wozFields.oppervlakte]);
  if(safe(wozFields.taxateur))         vastgoedRows.push(['Taxateur', wozFields.taxateur]);
  // Kadaster aanvulling
  const kadFields = aiKad?.fields || {};
  if(safe(kadFields.eigenaar))         vastgoedRows.push(['Eigenaar', kadFields.eigenaar]);
  if(safe(kadFields.leveringsdatum))   vastgoedRows.push(['Datum levering', kadFields.leveringsdatum]);

  const finRows = [];
  if(safe(jaarrFields.bedrijfsnaam))   finRows.push(['Onderneming', jaarrFields.bedrijfsnaam]);
  if(safe(jaarrFields.boekjaar))       finRows.push(['Boekjaar', jaarrFields.boekjaar]);
  if(safe(jaarrFields.omzet))          finRows.push(['Omzet', fmtBedrag(jaarrFields.omzet)||jaarrFields.omzet]);
  const jNetto = jaarrFields.nettoResultaat||jaarrFields.nettowinst;
  if(safe(jNetto))                     finRows.push(['Nettoresultaat', fmtBedrag(jNetto)||jNetto]);
  if(safe(jaarrFields.ebitda))         finRows.push(['EBITDA', fmtBedrag(jaarrFields.ebitda)||jaarrFields.ebitda]);
  const jEv = jaarrFields.eigenVermogen||jaarrFields.eigenvermogen;
  if(safe(jEv))                        finRows.push(['Eigen vermogen', fmtBedrag(jEv)||jEv]);
  const jBt = jaarrFields.balanstotaal||jaarrFields.balansTotaal;
  if(safe(jBt))                        finRows.push(['Balanstotaal', fmtBedrag(jBt)||jBt]);
  if(kpiSolv)                          finRows.push(['Solvabiliteit', kpiSolv+'%', solvKlasse(kpiSolv)]);

  function renderDataCard(icon, iconClass, title, rows) {
    if(rows.length===0) return '';
    return `<div class="da-card">
      <div class="da-card-head">
        <em class="da-card-icon ${iconClass}">${icon}</em>
        <span class="da-card-title">${title}</span>
      </div>
      ${rows.map(([k,v,cls])=>`<div class="da-row">
        <span class="da-row-key">${k}</span>
        <span class="da-row-val${cls?' '+cls:''}">${v}</span>
      </div>`).join('')}
    </div>`;
  }

  // ── Vervolgstappen — dealspecifiek, max 6, op prioriteit ────────────────
  // Gebaseerd op: ontbrekende documenten, gedetecteerde conflicten, risico's
  // NIET op generieke AI-actions (te veel, te algemeen)
  const vervolgItems = [];

  // 1. Harde conflicten eerst — deze blokkeren indiening
  if(aiKvk?.fields && S.form.typeKlant === 'particulier') {
    const rv = aiKvk.fields.rechtsvorm || '';
    if(/bv|vennootschap/i.test(rv)) vervolgItems.push('Verifieer via welke entiteit gefinancierd wordt — KVK toont BV');
  }
  const wozAiW = aiWoz?.fields?.taxatiewaarde || aiWoz?.fields?.wozWaarde;
  const wozNum = wozAiW ? parseBedrag(wozAiW) : null;
  const mvNum = parseFloat(S.form.marktwaarde) || 0;
  if(wozNum && mvNum && Math.abs(mvNum - wozNum) / wozNum > 0.15) {
    vervolgItems.push(`Corrigeer marktwaarde — taxatie (${fmtBedrag(String(wozNum))}) wijkt >15% af van ingevoerde waarde`);
  }

  // 2. Ontbrekende kritische documenten
  if(!S.docs.woz.files.length)
    vervolgItems.push('Taxatierapport opvragen — vereist voor bancaire route (max 6 maanden oud)');
  if(!S.docs.kadaster.files.length)
    vervolgItems.push('Kadastraal uittreksel opvragen bij notaris of Kadaster');
  if(!S.docs.graydon.files.length)
    vervolgItems.push('Kredietrapport opvragen (Graydon of CreditSafe)');
  if(S.form.typeKlant === 'bv' && S.docs.kvk.files.length === 0)
    vervolgItems.push('KVK-uittreksel opvragen (max 3 maanden oud) — vereist bij BV');
  if(S.form.typeKlant === 'bv' && S.docs.jaarrekeningen.files.length < 2)
    vervolgItems.push('Minimaal 2 jaar jaarrekeningen opvragen — vereist voor inkomenstoets BV');

  // 3. Specifieke documentbevindingen
  if(kadHyp)
    vervolgItems.push('Bestaande hypotheekinschrijving — verifieer omvang en rang via notaris');
  if(incCount > 0)
    vervolgItems.push(`${incCount} incasso(s) gedetecteerd — schriftelijke toelichting voor financier voorbereiden`);
  const taxDatum = safe(aiWoz?.fields?.peildatum) || safe(aiWoz?.fields?.waardeDatum);
  if(taxDatum) {
    // Controleer of taxatie ouder dan 6 maanden is
    const parts = taxDatum.split(/[-\/]/);
    if(parts.length >= 3) {
      const taxDate = new Date(parts[2].length===4 ? `${parts[2]}-${parts[1].padStart(2,'0')}-${parts[0].padStart(2,'0')}` : taxDatum);
      const sixMonthsAgo = new Date(); sixMonthsAgo.setMonth(sixMonthsAgo.getMonth() - 6);
      if(!isNaN(taxDate) && taxDate < sixMonthsAgo)
        vervolgItems.push(`Taxatierapport van ${taxDatum} is ouder dan 6 maanden — actualisatie vereist voor bancaire indiening`);
    }
  }
  if(safe(aiGray?.fields?.bijzonderheden)?.toLowerCase().includes('verlaagd'))
    vervolgItems.push('Toelichting voorbereiden op verlaagd kredietlimiet voor financier');

  // Dedupliceer en beperk tot max 6
  const seen = new Set();
  const vervolgFinal = vervolgItems.filter(v => {
    if(seen.has(v)) return false;
    seen.add(v); return true;
  }).slice(0, 6);

  const vervolgTonen = vervolgFinal.length > 0 ? vervolgFinal : ['Dossier voldoende compleet — voorbereiding indiening kan starten.'];

  // ── Risico prioritering ──────────────────────────────────────────────────
  function risicoLevel(tekst) {
    const t = tekst.toLowerCase();
    if(t.includes('ontbreken')||t.includes('niet mogelijk')||t.includes('verhoogd')||t.includes('negatief')||t.includes('incasso')||t.includes('afwijking')) return 'r-high';
    if(t.includes('verlaagd')||t.includes('gedaald')||t.includes('rangorde')||t.includes('inconsistent')||t.includes('kwetsbaar')) return 'r-med';
    if(t.includes('controleer')||t.includes('geen')) return 'r-info';
    return 'r-low';
  }

  const allRisicos = [...risicoItems.filter(r=>!r.startsWith('Geen documentaire')), ...aandachtItems.filter(a=>!a.startsWith('Geen directe'))];
  const geenRisicos = allRisicos.length === 0;

  return `
  <div class="section-head" style="margin-top:16px">
    <span class="section-num" style="background:var(--pur)">4</span>
    <span class="section-head-lbl">Documentanalyse</span>
    <div class="section-head-line"></div>
    <span class="bdg" style="background:var(--pur-bg);color:var(--pur);border:1px solid var(--pur-bd)">
      ${filledCats} categorie${filledCats!==1?'ën':''} · ${totalFiles} bestand${totalFiles!==1?'en':''}
    </span>
  </div>

  <div class="da-blok">

    ${samenvattingItems.length>0?`
    <div class="da-summary-blok">
      <div class="da-summary-head">
        <span class="da-summary-badge">AI Documentanalyse</span>
        Samenvatting geüploade documenten
      </div>
      ${samenvattingItems.map(i=>`<div class="da-summary-item">· ${i}</div>`).join('')}
    </div>`:''}

    ${hasKpis?`
    <div class="da-kpi-row">
      ${kpiScore?`<div class="da-kpi">
        <div class="da-kpi-label">Creditscore</div>
        <div class="da-kpi-val ${kpiScoreInt?scoreKlasse(kpiScoreInt):''}">${kpiScore}</div>
        ${kpiKlasse?`<div class="da-kpi-sub">${kpiKlasse}</div>`:''}
      </div>`:''}
      ${kpiPD?`<div class="da-kpi">
        <div class="da-kpi-label">Prob. of default</div>
        <div class="da-kpi-val ${pdKlasse(kpiPD)}">${kpiPD}</div>
        <div class="da-kpi-sub">Kans op falen (12 mnd)</div>
      </div>`:''}
      ${kpiSolv?`<div class="da-kpi">
        <div class="da-kpi-label">Solvabiliteit</div>
        <div class="da-kpi-val ${solvKlasse(kpiSolv)}">${kpiSolv}%</div>
        <div class="da-kpi-sub">Eigen verm. / totale activa</div>
      </div>`:''}
      ${kpiLimiet?`<div class="da-kpi">
        <div class="da-kpi-label">Handelskredietlimiet</div>
        <div class="da-kpi-val ${kpiBijz&&kpiBijz.toLowerCase().includes('verlaagd')?'da-warn':''}" style="font-size:15px">${kpiLimiet}</div>
        <div class="da-kpi-sub" style="color:var(--tx4);font-style:italic">Handelskrediet — niet vastgoed</div>
      </div>`:''}
    </div>`:''}

    <div class="da-cards-grid">
      ${renderDataCard('🏢','da-icon-bedrijf','Bedrijf',bedrijfRows)}
      ${renderDataCard('✓','da-icon-krediet','Kredietprofiel',kredietRows)}
      ${renderDataCard('🏠','da-icon-vastgoed','Vastgoed',vastgoedRows)}
      ${renderDataCard('📊','da-icon-fin','Financiën',finRows)}
    </div>

    ${!geenRisicos?`
    <div class="da-risico-blok">
      <div class="da-risico-head">
        <span class="da-risico-head-title">Risico's &amp; aandachtspunten</span>
        <span class="da-risico-count">${allRisicos.length} punt${allRisicos.length!==1?'en':''}</span>
      </div>
      <div class="da-risico-list">
        ${allRisicos.map(r=>{
          const lvl = risicoLevel(r);
          const parts = r.split(' — ');
          return `<div class="da-risico-item ${lvl}">
            <div class="da-rdot ${lvl}"></div>
            <div class="da-risico-text">
              <strong>${parts[0]}</strong>
              ${parts[1]?`<span>${parts[1]}</span>`:''}
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`:`
    <div class="da-note-bar">
      <span>✓</span>
      <span><strong>Geen risico's gedetecteerd</strong> op basis van de huidige documenten.</span>
    </div>`}

    ${aandachtItems.some(a=>a.includes('taxatie')||a.includes('Taxatie'))?`
    <div class="da-note-bar">
      <span>📋</span>
      <span><strong>Let op:</strong> ${aandachtItems.find(a=>a.includes('taxatie')||a.includes('Taxatie'))}</span>
    </div>`:''}

    ${vervolgTonen.length>0?`
    <div class="da-vervolg-blok">
      <div class="da-vervolg-head">Vervolgstappen</div>
      ${vervolgTonen.map((i,idx)=>`<div class="da-vervolg-item">
        <span class="da-vervolg-num">${idx+1}.</span>
        <span>${i}</span>
      </div>`).join('')}
    </div>`:''}

  </div>`;
}

function renderMain(m, sc, risks, conf, doss, readiness, acties, lenders, concl) {
  const afl=f('metAflossing')==='ja'?'ann.':'IO';
  const ltvC=c=>c===null?'neutral':c<70?'good':c>80?'bad':'warn';
  const dscrC=c=>c===null?'neutral':c>=1.25?'good':c>=1?'warn':'bad';
  const hasHard=(conf?.hard?.length||0)>0;
  const isGo=sc.score>=6&&!hasHard&&readiness.bancair.statusKlasse==='good';
  const isNogo=sc.score<3||(hasHard&&sc.score<5);
  const gngLabel=isGo?'GO':isNogo?'NO-GO':'CONDITIONEEL';
  const gngCls=isGo?'go':isNogo?'no':'cond';
  const hasDeal=fv('aankoopprijs')>0&&fv('gewensteLening')>0;
  const datum=new Date().toLocaleDateString('nl-NL',{day:'2-digit',month:'long',year:'numeric'});

  if(!hasDeal) return `<div class="empty-state"><div class="es-icon">📋</div><div style="font-family:var(--head);font-size:13px;font-weight:600;margin-bottom:5px;color:var(--tx3)">Vul dealgegevens in</div><div style="color:var(--tx4)">Voer aankoopprijs en gewenste lening in om de analyse te starten.</div></div>`;

  const topLenders = lenders.slice(0, 5); // max 5 beste matches

  return `
  <div id="PRINT_HEADER" class="print-header" style="display:none"></div>

  <div class="deal-snapshot">
    <div class="snap-header">
      <span class="snap-title">Deal Snapshot — ${datum}</span>
      <div style="display:flex;align-items:center;gap:8px">
        ${f('naamKlant')?`<span style="font-family:var(--head);font-size:10.5px;color:rgba(255,255,255,.55)">${f('naamKlant')}</span>`:''}
      </div>
    </div>
    <div class="snap-kpis">
      <div class="snap-kpi">
        <div class="snap-kpi-lbl">Score</div>
        <div class="snap-kpi-val ${sc.klasse==='good'?'good':sc.klasse==='bad'?'bad':sc.klasse==='blauw'?'good':'warn'}">${sc.score}<span style="font-size:11px;opacity:.45;font-weight:500">/10</span></div>
        <div class="snap-kpi-sub">${sc.label}</div>
      </div>
      <div class="snap-kpi">
        <div class="snap-kpi-lbl">LTV</div>
        <div class="snap-kpi-val ${ltvC(m.ltv)}">${m.ltv?fP(m.ltv):'—'}</div>
        <div class="snap-kpi-sub">${m.ltv===null?'—':m.ltv<70?'✓ Ruim':m.ltv<=80?'OK':m.ltv<=85?'> Bancaire norm':'Kritisch'}</div>
      </div>
      <div class="snap-kpi">
        <div class="snap-kpi-lbl">DSCR</div>
        <div class="snap-kpi-val ${dscrC(m.dscr)}">${m.dscr?m.dscr.toFixed(2):'N/B'}</div>
        <div class="snap-kpi-sub">${m.dscr===null?'Geen huur':m.dscr>=1.5?'Sterk':m.dscr>=1.25?'✓ Voldoende':m.dscr>=1.0?'Onder norm':'Kritisch'}</div>
      </div>
      <div class="snap-kpi">
        <div class="snap-kpi-lbl">Cashflow/mnd</div>
        <div class="snap-kpi-val ${!m.h||!m.ml?'neutral':m.cf>0?'good':'bad'}">${m.h&&m.ml?fE(m.cf):'—'}</div>
        <div class="snap-kpi-sub">${m.h&&m.ml?(m.cf>0?'Positief':'Negatief'):'Na lasten'}</div>
      </div>

    </div>
    <!-- Conclusie + sub-scores -->
    <div class="snap-concl" style="display:flex;gap:12px;align-items:flex-start">
      <div class="snap-concl-txt" style="flex:1">${concl}</div>
      <div style="display:flex;gap:8px;flex-shrink:0;padding-left:12px;border-left:1px solid rgba(255,255,255,.1)">
        ${[['A','Haalb.',sc.subScores.A],['B','Profiel',sc.subScores.B],['C','Dossier',sc.subScores.C]].map(([k,l,v])=>`
          <div style="text-align:center">
            <div style="font-size:7px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:rgba(255,255,255,.35);font-family:var(--head);margin-bottom:2px">${l}</div>
            <div style="font-size:13px;font-weight:700;font-family:var(--head);color:${v>=0.5?'#7ee8a2':v<=-0.5?'#fca5a5':'rgba(255,255,255,.6)'}">${v>0?'+':''}${v.toFixed(1)}</div>
          </div>`).join('')}
      </div>
    </div>
  </div>

  <div class="section-head">
    <span class="section-num">2</span><span class="section-head-lbl">Financiële Analyse</span><div class="section-head-line"></div>
  </div>

  <div class="acard">
    <div class="acard-hd"><span class="acard-lbl">LTV</span><span class="bdg ${m.ltv===null?'bdg-b':m.ltv<70?'bdg-g':m.ltv>80?'bdg-r':'bdg-w'}">${m.ltv?fP(m.ltv):'—'}</span></div>
    <div class="mrow c2" style="margin-bottom:9px">
      <div class="metric"><div class="m-lbl">Op aankoopprijs</div><div class="m-val ${m.ltvA<70?'cg':m.ltvA>80?'cr':'cw'}">${m.ltvA?fP(m.ltvA):'—'}</div></div>
      <div class="metric"><div class="m-lbl">Op marktwaarde</div><div class="m-val ${ltvC(m.ltvM)==='good'?'cg':ltvC(m.ltvM)==='bad'?'cr':'cw'}">${m.ltvM?fP(m.ltvM):'—'}</div><div class="m-sub">${getFirstParsed('woz')?._definitieveWaarde?'✓ '+getFirstParsed('woz')._bronLabel:'Geen taxatie'}</div></div>
    </div>
    <div class="ltv-track"><div class="ltv-fill" style="width:${Math.min(m.ltv||0,100)}%;background:${(m.ltv||0)<70?'var(--gn)':(m.ltv||0)>80?'var(--rk)':'var(--wn)'}"></div></div>
    <div class="ltv-marks"><span>0%</span><span>70%</span><span>80%</span><span>100%</span></div>
  </div>

  <div class="acard">
    <div class="acard-hd"><span class="acard-lbl">Cashflow & Draagkracht</span></div>
    <div class="mrow c3">
      <div class="metric"><div class="m-lbl">DSCR (${afl})</div><div class="m-val ${dscrC(m.dscr)==='good'?'cg':dscrC(m.dscr)==='bad'?'cr':'cw'}">${m.dscr?m.dscr.toFixed(2):'N/B'}</div><div class="m-sub">${m.dscr?m.dscr>=1.25?'✓ Voldoende':m.dscr>=1?'Onder norm':'Kritisch':'Geen huur'}</div></div>
      <div class="metric"><div class="m-lbl">Huurinkomen/mnd</div><div class="m-val">${m.h?fE(m.h):'—'}</div><div class="m-sub">${f('huurType')==='bestaand'?'Contract':'Prognose'}</div></div>
      <div class="metric"><div class="m-lbl">Cashflow</div><div class="m-val ${!m.h||!m.ml?'cgy':m.cf>0?'cg':'cr'}">${m.h&&m.ml?fE(m.cf):'—'}</div><div class="m-sub">Na lasten</div></div>
    </div>
    ${m.bh125?`<div style="margin-top:8px;padding:7px 9px;background:var(--bg);border-radius:6px;font-size:10.5px;color:var(--tx3)">Min. huurinkomen DSCR 1.25: <strong style="color:var(--tx);font-family:var(--mono)">${fE(m.bh125)}/mnd</strong>${m.h&&m.h<m.bh125?` — tekort ${fE(m.bh125-m.h)}/mnd`:' ✓'}</div>`:''}
  </div>

  <div class="acard">
    <div class="acard-hd"><span class="acard-lbl">Structuur</span></div>
    <div class="mrow c4">
      <div class="metric"><div class="m-lbl">Lening</div><div class="m-val">${fE(m.l)}</div></div>
      <div class="metric"><div class="m-lbl">Inbreng</div><div class="m-val">${fE(m.inb)}</div><div class="m-sub">${m.ibP?fP(m.ibP):''}</div></div>
      <div class="metric"><div class="m-lbl">Maandlast</div><div class="m-val cb">${fE(m.ml)}</div><div class="m-sub">${afl}</div></div>
      <div class="metric"><div class="m-lbl">Rente</div><div class="m-val">${(parseFloat(f('rente')||.05)*100).toFixed(1)}%</div></div>
    </div>
  </div>

  <div class="section-head" style="margin-top:16px">
    <span class="section-num" style="${risks.krit.length>0?'background:var(--rk)':''}">3</span>
    <span class="section-head-lbl">Risico's & Aandachtspunten</span>
    <div class="section-head-line"></div>
    ${risks.krit.length>0?`<span class="bdg bdg-r">${risks.krit.length} kritisch</span>`:''}
  </div>

  <div class="acard">
    ${risks.krit.length===0&&risks.aand.length===0
      ?`<div style="text-align:center;padding:14px;color:var(--gn);font-size:12px">✓ Geen kritieke risico's gedetecteerd</div>`
      :`<div class="risk-list">
        ${risks.krit.map(r=>`<div class="risk-item krit"><div class="risk-dot" style="background:var(--rk)"></div><div><div class="risk-t">${r.t}</div><div class="risk-sub">${r.i} · ${r.oplosbaar?'Oplosbaar':'Niet oplosbaar'}</div>${r.a?`<div class="risk-act">${r.a}</div>`:''}</div></div>`).join('')}
        ${risks.aand.map(r=>`<div class="risk-item aand"><div class="risk-dot" style="background:var(--wn)"></div><div><div class="risk-t">${r.t}</div><div class="risk-sub">${r.i}</div>${r.a?`<div class="risk-act">${r.a}</div>`:''}</div></div>`).join('')}
      </div>`}
  </div>

  <div class="acard">
    <div class="acard-hd"><span class="acard-lbl">Volgende Stappen</span><span style="font-size:9.5px;color:var(--tx4)">${acties.length} acties</span></div>
    ${acties.length===0
      ?`<div style="text-align:center;padding:12px;color:var(--gn);font-size:11.5px">✓ Geen directe acties vereist</div>`
      :acties.map(a=>`<div class="action-item ${a.p}"><span style="font-size:11px">${a.p==='kritisch'?'🔴':a.p==='hoog'?'🟠':a.p==='laag'?'🟢':'🔵'}</span><span>${a.t}</span></div>`).join('')}
  </div>

  <div class="acard what-if-section">
    <div class="acard-hd">
      <span class="acard-lbl">What-if</span>
      <span style="font-size:9px;color:var(--tx4)">Live herberekening</span>
      <button class="btn btn-ghost btn-sm" style="margin-left:auto;font-size:10px" onclick="resetWhatIf()" title="Zet sliders terug naar de originele waarden">↺ Terugzetten</button>
    </div>
    ${[
      ['rente','Rente','0.03','0.15','0.005',v=>(parseFloat(v)*100).toFixed(1)+'%'],
      ['gewensteLening','Lening','50000','2000000','10000',v=>'€'+Math.round(v).toLocaleString()],
      ['eigenInbreng','Inbreng','0','1000000','5000',v=>'€'+Math.round(v).toLocaleString()],
      ['huurPerMaand','Huurinkomen','0','10000','50',v=>'€'+Math.round(v).toLocaleString()]
    ].map(([k,l,mn,mx,st,fmt])=>`
      <div class="sl-row" style="margin-bottom:7px">
        <span class="sl-lbl">${l}</span>
        <input type="range" min="${mn}" max="${mx}" step="${st}" value="${f(k)||'0'}" oninput="syncWhatIf('${k}',this.value,this.nextElementSibling)">
        <span class="sl-val">${fmt(f(k)||'0')}</span>
      </div>`).join('')}
    <div class="whatif-result">
      <div class="metric"><div class="m-lbl">Score</div><div class="m-val ${sc.klasse==='good'?'cg':sc.klasse==='bad'?'cr':'cw'}">${sc.score}/10</div></div>
      <div class="metric"><div class="m-lbl">DSCR</div><div class="m-val ${dscrC(m.dscr)==='good'?'cg':dscrC(m.dscr)==='bad'?'cr':'cw'}">${m.dscr?m.dscr.toFixed(2):'—'}</div></div>
      <div class="metric"><div class="m-lbl">LTV</div><div class="m-val ${ltvC(m.ltv)==='good'?'cg':ltvC(m.ltv)==='bad'?'cr':'cw'}">${m.ltv?fP(m.ltv):'—'}</div></div>
    </div>
  </div>

  ${renderDocAnalyseBlok()}

  <div class="section-head" style="margin-top:16px">
    <span class="section-num">5</span><span class="section-head-lbl">Financieringsmogelijkheden</span><div class="section-head-line"></div>
    ${topLenders.filter(l=>!l.blokkeerd).length>0?`<span class="bdg" style="background:var(--bl-bg);color:var(--bl);border:1px solid var(--bl-bd)">${topLenders.filter(l=>!l.blokkeerd).length} in aanmerking</span>`:''}
  </div>

  ${topLenders.filter(l=>!l.blokkeerd).length===0
    ?`<div class="acard"><div style="text-align:center;padding:16px;color:var(--rk);font-size:12px;font-weight:600">Geen financiers voldoen aan de huidige parameters.<br><span style="font-size:11px;color:var(--tx4);font-weight:400">Pas LTV, lening of huurinkomsten aan om opties te openen.</span></div></div>`
    :topLenders.filter(l=>!l.blokkeerd).map((l, idx)=>{
      const clr = l.score>=70?'var(--gn)':l.score>=45?'var(--wn)':'var(--rk)';
      const isTop = idx===0;
      // Bouw een dealspecifieke motivatie
      const dealMotivatie = [];
      if(m.ltv!==null) dealMotivatie.push(`LTV ${fP(m.ltv)} van max ${l.maxLTV}%`);
      if(m.dscr!==null) dealMotivatie.push(`DSCR ${m.dscr.toFixed(2)} (min ${l.minDSCR})`);
      if(m.l>0) dealMotivatie.push(`${fE(m.l)} past in ticket ${fE(l.minLening)}–${fE(l.maxLening)}`);
      return `<div class="lender-card" style="${isTop?'border-color:var(--bl);border-width:1.5px':''}">
        <div class="lender-card-header">
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:7px;margin-bottom:3px">
              <span class="lender-badge-type ${l.type}">${l.type==='bank'?'Bank':'Non-bank'}</span>
              <span class="lender-name">${l.naam}</span>
              ${isTop?`<span style="font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px;background:var(--bl-bg);color:var(--bl);border:1px solid var(--bl-bd)">Beste match</span>`:''}
            </div>
            <div style="font-size:10px;color:var(--tx4)">${l.specialisme}</div>
          </div>
          <div style="text-align:right;flex-shrink:0">
            <div style="font-size:24px;font-weight:800;line-height:1;color:${clr}">${l.score}<span style="font-size:11px;color:var(--tx4);font-weight:400">%</span></div>
            <div style="font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:${clr}">${l.matchType==='sterk'?'Sterke match':l.matchType==='redelijk'?'Redelijke match':'Zwakke match'}</div>
          </div>
        </div>

        <div style="padding:8px 14px;background:var(--bg);border-bottom:1px solid var(--bd-l);font-size:10.5px;color:var(--tx3);font-style:italic">${l.beschrijving}</div>

        ${l.renteIndicatief?`<div style="padding:7px 14px;border-bottom:1px solid var(--bd-l);display:flex;align-items:center;gap:8px">
          <span style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--tx4)">Indicatieve rente</span>
          <span style="font-size:13px;font-weight:700;color:var(--tx2)">${l.renteIndicatief}</span>
          <span style="font-size:9px;color:var(--tx4);margin-left:auto;font-style:italic">marktindicatie — geen offerte</span>
        </div>`:''}

        <div style="padding:10px 14px;display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <div>
            <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--gn);margin-bottom:5px">Waarom deze deal past</div>
            ${l.plus.map(p=>`<div style="display:flex;gap:5px;font-size:11px;color:var(--tx2);padding:2px 0"><span style="color:var(--gn);flex-shrink:0">✓</span>${p}</div>`).join('')}
          </div>
          <div>
            <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--wn);margin-bottom:5px">Aandachtspunten</div>
            ${l.min.length>0
              ? l.min.map(p=>`<div style="display:flex;gap:5px;font-size:11px;color:var(--tx2);padding:2px 0"><span style="color:var(--wn);flex-shrink:0">−</span>${p}</div>`).join('')
              : `<div style="font-size:11px;color:var(--tx4);font-style:italic">Geen bezwaren voor deze deal</div>`
            }
          </div>
        </div>

        <div style="padding:6px 14px 10px;border-top:1px solid var(--bd-l);display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          ${dealMotivatie.map(d=>`<span style="font-size:9px;background:var(--bg2);color:var(--tx3);padding:2px 7px;border-radius:20px">${d}</span>`).join('')}
        </div>
      </div>`;
    }).join('')}

  ${topLenders.filter(l=>l.blokkeerd).length>0?`
  <div style="margin-top:8px">
    <details>
      <summary style="font-size:10.5px;color:var(--tx4);cursor:pointer;padding:6px 2px;user-select:none">
        ${topLenders.filter(l=>l.blokkeerd).length} financier(s) buiten criteria — toon details
      </summary>
      <div style="margin-top:6px;display:flex;flex-direction:column;gap:6px">
      ${topLenders.filter(l=>l.blokkeerd).map(l=>`
        <div style="background:var(--bg);border:1px solid var(--bd);border-radius:var(--r-sm);padding:10px 14px;display:flex;align-items:flex-start;gap:12px">
          <div style="flex:1">
            <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
              <span class="lender-badge-type ${l.type}">${l.type==='bank'?'Bank':'Non-bank'}</span>
              <span style="font-size:12px;font-weight:600;color:var(--tx3)">${l.naam}</span>
            </div>
            <div style="font-size:10.5px;color:var(--rk)">${l.min.slice(0,2).join(' · ')}</div>
          </div>
          <span style="font-size:9px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--rk-bg);color:var(--rk);border:1px solid var(--rk-bd);flex-shrink:0">Buiten criteria</span>
        </div>`).join('')}
      </div>
    </details>
  </div>`:''}

  <div class="section-head" style="margin-top:16px">
    <span class="section-num">6</span><span class="section-head-lbl">Intern Oordeel</span><div class="section-head-line"></div>
  </div>
  <div class="verdict-card ${sc.klasse}">
    <div class="verdict-top">
      <span style="font-size:17px">${SC_ICON[sc.klasse]}</span>
      <span class="verdict-gng">${gngLabel}</span>
      <span class="verdict-lbl" style="flex:1">${SC_LABEL[sc.klasse]}</span>
      ${sc.isCapped?`<span class="bdg bdg-r">Begrensd: ${sc.capReden}</span>`:''}
    </div>
    <div class="verdict-txt">${concl}</div>
    ${f('notitie')?`<div style="margin-top:9px;padding-top:9px;border-top:1px solid rgba(0,0,0,.06);font-size:11px;color:var(--tx3);font-style:italic">${f('notitie')}</div>`:''}
  </div>

  ${(conf?.hard?.length||0)+(conf?.zacht?.length||0)>0?`
  <div class="acard">
    <div class="acard-hd"><span class="acard-lbl">Conflicten</span></div>
    ${[...(conf.hard||[]).map(c=>({...c,cat:'hard'})),...(conf.zacht||[]).map(c=>({...c,cat:'zacht'}))].map(item=>`
      <div class="cf-item cf-${item.cat}">
        <div class="cf-dot" style="background:${item.cat==='hard'?'var(--rk)':'var(--wn)'}"></div>
        <div><div class="cf-lbl">${item.veld||item.code}</div>
        ${item.ingevoerd?`<div class="cf-sub">Klant: ${item.ingevoerd} · Doc: ${item.document||'—'}</div>`:''}
        ${item.actie?`<div class="cf-act">${item.actie}</div>`:''}</div>
      </div>`).join('')}
  </div>`:''}

  <div class="section-head" style="margin-top:16px">
    <span class="section-num">7</span><span class="section-head-lbl">Dealoverzicht & Kredietmemo</span><div class="section-head-line"></div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px">
    <div class="acard" style="margin-bottom:0">
      <div class="acard-hd"><span class="acard-lbl">Dealoverzicht</span></div>
      <table class="sum-t">
        ${[['Klant',f('naamKlant')||'—'],['Aankoopprijs',fE(m.a)],['Marktwaarde',fE(m.mv)||'—'],['Lening',fE(m.l)],['LTV',fP(m.ltv)],['DSCR',m.dscr?m.dscr.toFixed(2)+' ('+afl+')':'N/B']].map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('')}
      </table>
    </div>
    <div class="acard" style="margin-bottom:0">
      <div class="acard-hd"><span class="acard-lbl">Checklist</span></div>
      ${['Geldig identiteitsbewijs',f('typeKlant')==='bv'?'Jaarrekeningen (2 jr) + KvK':'Jaaropgave 2 jaar','Taxatierapport (max 6 mnd)','Eigendomsakte / koopcontract',...(m.h>0?[f('huurType')==='bestaand'?'Huurcontracten':'Huurprognoserapport']:[]),...(f('woonland')!=='nl'?['Verblijfsstatus bewijs']:[])].map(d=>`<div class="d-it"><span style="color:var(--tx4)">☐</span>${d}</div>`).join('')}
    </div>
  </div>

  <div class="acard">
    <div class="acard-hd"><span class="acard-lbl">Kredietmemo</span><button class="btn btn-ghost btn-sm" id="MEMO_CPY_BTN" onclick="doCopy('MEMO_OUT','MEMO_CPY_BTN')">Kopiëren</button></div>
    <div class="memo" id="MEMO_OUT">KREDIETMEMO — MB ADVIESGROEP
Datum: ${datum}  ·  Ref: MBA-${Date.now().toString().slice(-6)}
─────────────────────────────────────────

KLANT
Naam              : ${f('naamKlant')||'—'}
Type              : ${f('typeKlant')==='bv'?'BV / Holding':'Particulier'}
Woonland          : ${f('woonland')==='nl'?'Nederland':f('woonland')==='eu'?'EU (niet NL)':'Buiten EU'}
Inkomen/jr        : ${f('inkomen')?'€'+parseInt(f('inkomen')).toLocaleString():'Niet opgegeven'}

PAND
Type              : ${f('typeVastgoed')}  ·  Doel: ${f('doelFinanciering')||'aankoop'}
Aankoopprijs      : ${fE(m.a)}
Marktwaarde       : ${fE(m.mv)||'—'}
Huurinkomsten      : ${m.h?fE(m.h)+'/mnd':'Geen'}

FINANCIERING
Gewenste lening   : ${fE(m.l)}
LTV               : ${fP(m.ltv)}
DSCR              : ${m.dscr?m.dscr.toFixed(2)+' ('+afl+')':'N/B'}
Maandlast         : ${fE(m.ml)} (${f('metAflossing')==='ja'?'annuitair':'interest only'})

DOCUMENTEN
Categorieën       : ${filledCategoriesCount()}/${Object.keys(DOC_TYPES).length} aanwezig
Bestanden         : ${totalFilesCount()} geüpload

BEOORDELING
Score             : ${sc.score}/10 — ${sc.label}
Oordeel           : ${concl}

TOP ACTIES:
${acties.slice(0,5).map((a,i)=>i+1+'. '+a.t).join('\n')}

─────────────────────────────────────────
MB Deal Analyzer v20 | Indicatief — geen rechten ontleenbaar</div>
  </div>
  <div class="btn-row" id="PRINT_BTN_ROW">
    <button class="btn btn-bl" onclick="printReport()">PDF afdrukken</button>
    <button class="btn btn-ghost" onclick="resetApp()">Nieuwe deal</button>
  </div>
  `;
}

// ════════════════════════════════════════════════════
// ㉜ RIGHT SIDEBAR
// ════════════════════════════════════════════════════
function renderAside(m, sc, doss, readiness) {
  const ltvC=m.ltv===null?'cgy':m.ltv<70?'cg':m.ltv>80?'cr':'cw';
  const dscrC=m.dscr===null?'cgy':m.dscr>=1.25?'cg':m.dscr>=1?'cw':'cr';
  const dqC={good:'var(--gn)',blauw:'var(--bl)',warn:'var(--wn)',bad:'var(--rk)'}[doss?.klasse]||'var(--tx3)';
  const rdB=readiness?.bancair,rdNB=readiness?.nonbank;
  const rdCls=r=>({good:'rd-ok',blauw:'rd-bl',warn:'rd-warn',bad:'rd-bad'}[r?.statusKlasse]||'rd-bl');
  const totalFiles=totalFilesCount();
  const filledCats=filledCategoriesCount();
  const totalCats=Object.keys(DOC_TYPES).length;

  document.getElementById('PANEL_ASIDE').innerHTML = `
    <div class="p-head"><div class="p-head-lbl"><div class="p-head-dot" style="background:var(--bl)"></div>Live Dashboard</div></div>

    <div style="background:var(--wh);border:1px solid var(--bd);border-radius:var(--r);padding:11px;margin-bottom:7px;box-shadow:var(--sh)">
      ${scoreRing(sc.score,sc.klasse,sc.subScores,sc.isCapped?sc.capReden:null)}
    </div>

    <div style="background:var(--wh);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:7px;overflow:hidden;box-shadow:var(--sh)">
      <div style="padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--bd-l);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--tx4)">Kerncijfers</div>
      <div style="padding:8px 10px">
        <div class="aside-row"><span class="aside-k">Score</span><span class="aside-v" style="color:${SC_STROKE[sc.klasse]||'var(--bl)'}">${sc.score}/10 — ${sc.label}</span></div>
        <div class="aside-row"><span class="aside-k">LTV</span><span class="aside-v ${ltvC}">${m.ltv?fP(m.ltv):'—'}<span style="font-size:8px;font-weight:400;color:var(--tx4);margin-left:4px">${m.ltv===null?'':m.ltv<70?'✓ ruim':m.ltv<=80?'OK':m.ltv<=85?'> norm':'kritisch'}</span></span></div>
        <div class="aside-row"><span class="aside-k">DSCR</span><span class="aside-v ${dscrC}">${m.dscr?m.dscr.toFixed(2):'—'}<span style="font-size:8px;font-weight:400;color:var(--tx4);margin-left:4px">${m.dscr===null?'geen huur':m.dscr>=1.25?'✓ norm':m.dscr>=1?'< 1.25':'< 1.0'}</span></span></div>
        <div class="aside-row"><span class="aside-k">Maandlast</span><span class="aside-v cb">${m.ml?fE(m.ml):'—'}${m.h&&m.ml?`<span style="font-size:8px;font-weight:400;color:var(--tx4);margin-left:4px">${((m.ml/m.h)*100).toFixed(0)}% v. huur</span>`:''}
        </span></div>
        <div class="aside-row"><span class="aside-k">Cashflow</span><span class="aside-v ${m.cf>0?'cg':m.cf<0?'cr':'cgy'}">${m.h&&m.ml?fE(m.cf):'—'}</span></div>
        <div class="aside-row"><span class="aside-k">Inbreng</span><span class="aside-v">${m.ibP!==null?fP(m.ibP):'—'}${m.inb?`<span style="font-size:8px;font-weight:400;color:var(--tx4);margin-left:4px">${fE(m.inb)}</span>`:''}</span></div>
      </div>
    </div>



    ${f('naamKlant')?`
    <div style="background:var(--wh);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);margin-bottom:7px">
      <div style="padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--bd-l);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--tx4)">Klant</div>
      <div style="padding:8px 10px">
        <div style="font-family:var(--head);font-size:11.5px;font-weight:600;margin-bottom:2px">${f('naamKlant')}</div>
        <div style="font-size:9.5px;color:var(--tx3)">${f('typeKlant')==='bv'?'BV':'Particulier'} · ${f('woonland')==='nl'?'NL':f('woonland')==='eu'?'EU':'Buiten EU'}</div>
        ${f('dossiernr')?`<div style="font-size:9px;color:var(--tx4);margin-top:3px;font-family:var(--mono)">${f('dossiernr')}</div>`:''}
        ${f('adviseur')?`<div style="font-size:9px;color:var(--tx4);font-family:var(--mono)">${f('adviseur')}</div>`:''}
      </div>
    </div>`:''}

    <div style="background:var(--wh);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)">
      <div style="padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--bd-l);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--tx4)">Documenten</div>
      <div style="padding:8px 10px">
        ${Object.entries(DOC_TYPES).map(([key,dt])=>{
          const files=S.docs[key].files;
          const hasFiles=files.length>0;
          const hasAi=files.some(fe=>fe.ai);
          const bestKwal=files.reduce((best,fe)=>{const k=fe.parsed?._meta?.documentKwaliteit;return k==='goed'?'goed':best==='goed'?'goed':k==='matig'?'matig':best;},null);
          return `<div class="aside-row">
            <span class="aside-k" style="font-size:9px">${dt.icon} ${dt.label.substring(0,14)}</span>
            <span style="display:flex;gap:3px;align-items:center">
              <span style="font-size:8.5px;font-weight:700;font-family:var(--head);padding:1.5px 5px;border-radius:10px;${!hasFiles?'background:var(--bg2);color:var(--tx4)':bestKwal==='goed'?'background:var(--gn-bg);color:var(--gn)':bestKwal==='matig'?'background:var(--wn-bg);color:var(--wn)':'background:var(--bl-bg);color:var(--bl)'}">
                ${!hasFiles?'—':`${files.length} best.`}
              </span>
              ${hasAi?`<span style="font-size:7px;font-weight:700;padding:1px 4px;border-radius:8px;background:var(--pur-bg);color:var(--pur)">AI</span>`:''}
            </span>
          </div>`;
        }).join('')}
      </div>
    </div>
  `;
}


// ════════════════════════════════════════════════════
// INIT — herstel vanuit localStorage indien beschikbaar
// ════════════════════════════════════════════════════
(function init() {
  const restored = loadFromLocalStorage();
  fullRender();
  if(restored && S.form.naamKlant) {
    // Kleine vertraging zodat de UI eerst rendert
    setTimeout(() => showToast('Vorige sessie hersteld — ' + S.form.naamKlant, 'info'), 400);
  }
  // Autosave indicator in header subtitel
  const sub = document.querySelector('.logo-app-sub');
  if(sub) {
    setInterval(() => {
      sub.textContent = 'Opgeslagen ' + new Date().toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'});
      setTimeout(() => { if(sub) sub.textContent = 'Kredietanalyse'; }, 2000);
    }, 30000);
  }
})();

</script>
